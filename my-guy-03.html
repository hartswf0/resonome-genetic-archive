                    this.mesh.material.uniforms.mouse.value.copy(globalMouse); 
                    this.mesh.material.uniforms.time.value = this.time;
                    this.mesh.material.uniforms.intensity.value = this.visualIntensity;
                    this.mesh.material.uniforms.flow.value = this.visualFlow;
                    this.mesh.material.uniforms.audioLevel.value = this.audioLevel;
                    this.mesh.material.uniforms.beatPulse.value = this.beatPulse;
                    // Update grid color based on active layer's color
                    const currentLayerColor = this.layerColors[this.activeLayerIndex] || this.layerColors[0];
                    this.mesh.material.uniforms.gridColor.value.setHSL(currentLayerColor[0], currentLayerColor[1], currentLayerColor[2]);
                }

                if (this.beatPulse > 0.001) {
                    this.beatPulse *= 0.9;
                } else {
                    this.beatPulse = 0;
                }
            }

            setBPM(bpm) {
                this.bpm = bpm;
                this.secondsPerStep = (60 / this.bpm) / 4;
                if (this.audioContext && this.audioContext.state === 'running') {
                    this.startSequencerScheduler(); // Restart scheduler for new tempo
                }
            }

            setInfluence(val) {
                this.influence = val;
            }

            togglePlayPause() {
                this.isPlaying = !this.isPlaying;
                // If starting playback, ensure audio context is resumed
                if (this.isPlaying && this.audioContext && this.audioContext.state !== 'running') {
                    this.audioContext.resume();
                }
                // When toggling play/pause, update the sequencer visuals immediately
                this.updateSequencerVisualNodes();
            }
        }

        // =========================================================
        // Global Application Setup and UI Management
        // =========================================================

        // --- GLOBAL UI STATE ---
        portalApp.uiVisible = true; // For main control panel
        portalApp.crossfaderValue = 0.5; // Blends drone vs sample
        portalApp.masterOutputVolume = 0.5;

        // UI Hide timers (for BPM and Layer panels)
        portalApp.hideBpmTimer = null;
        portalApp.hideLayerControlTimer = null;

        // --- GLOBAL APP ENTRY POINT ---
        window.addEventListener('load', () => {
            const startButton = document.getElementById('start-button');
            startButton.addEventListener('click', portalApp.initApplication);

            portalApp.loadStateFromURL(); 
            document.getElementById('loading').style.display = 'none'; 
        });

        portalApp.initApplication = async () => {
            if (portalApp.audioContext) return; // Already initialized

            try {
                portalApp.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                await portalApp.audioContext.resume();

                // Setup master gain (final output volume)
                portalApp.masterGain = portalApp.audioContext.createGain();
                portalApp.masterGain.gain.value = portalApp.masterOutputVolume; // Initial master volume
                portalApp.masterGain.connect(portalApp.audioContext.destination);

                // NEW: Create main mixing bus where all active audio streams will merge
                portalApp.mainMixBus = portalApp.audioContext.createGain();
                portalApp.mainMixBus.gain.value = 1.0; // Default pass-through gain

                // Analyser for global audio level, connected before fuzz/master
                portalApp.globalAnalyser = portalApp.audioContext.createAnalyser();
                portalApp.globalAnalyser.fftSize = 256;
                portalApp.mainMixBus.connect(portalApp.globalAnalyser); // Main mix feeds analyser
                portalApp.globalFrequencyData = new Uint8Array(portalApp.globalAnalyser.frequencyBinBinCount);

                // Global Fuzz setup (Wet/Dry Mixer)
                portalApp.globalFuzzNode = portalApp.audioContext.createWaveShaper();
                portalApp.globalFuzzNode.curve = makeDistortionCurve(portalApp.globalFuzzAmount * 100);
                portalApp.globalFuzzNode.oversample = '4x';

                portalApp.globalFuzzWetGain = portalApp.audioContext.createGain();
                portalApp.globalFuzzDryGain = portalApp.audioContext.createGain();

                // Connect mainMixBus to both dry and wet fuzz branches
                portalApp.mainMixBus.connect(portalApp.globalFuzzDryGain);
                portalApp.mainMixBus.connect(portalApp.globalFuzzWetGain);

                // Connect the dry branch directly to masterGain
                portalApp.globalFuzzDryGain.connect(portalApp.masterGain);

                // Connect the wet branch (through waveshaper) to masterGain
                portalApp.globalFuzzWetGain.connect(portalApp.globalFuzzNode);
                portalApp.globalFuzzNode.connect(portalApp.masterGain);


                // Setup crossfader (Drone vs Sampler)
                portalApp.crossfaderInputDrone = portalApp.audioContext.createGain(); // Input A to crossfader
                portalApp.crossfaderInputSample = portalApp.audioContext.createGain(); // Input B to crossfader
                portalApp.crossfaderOutput = portalApp.audioContext.createGain(); // Output of crossfader

                // Connect crossfader inputs to its output
                portalApp.crossfaderInputDrone.connect(portalApp.crossfaderOutput);
                portalApp.crossfaderInputSample.connect(portalApp.crossfaderOutput);
                
                // Crossfader output connects to the main mixing bus
                portalApp.crossfaderOutput.connect(portalApp.mainMixBus);


                // Sampler Master Gain (Controls sampler volume from slider)
                portalApp.samplerMasterGain = portalApp.audioContext.createGain();
                portalApp.samplerMasterGain.gain.value = 0; // Default off, controlled by slider
                portalApp.samplerMasterGain.connect(portalApp.crossfaderInputSample); // Sampler feeds into Crossfader Sample Input


                // Setup Three.js (single canvas)
                const canvas = document.getElementById('canvas');
                portalApp.renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
                portalApp.renderer.setSize(window.innerWidth, window.innerHeight);
                portalApp.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                portalApp.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                portalApp.camera.position.z = 5; // Adjust camera to see entire 20x20 plane (drone is -10 to 0, seq is 0 to 10)


                // Initialize Modules, passing their respective shader configs and mainMixBus
                portalApp.droneModule = new DroneModule(droneShaderConfig);
                portalApp.droneModule.init(portalApp.scene, portalApp.camera, portalApp.renderer, portalApp.audioContext, portalApp.crossfaderInputDrone);

                portalApp.sequencerModule = new SequencerModule(sequencerShaderConfig);
                portalApp.sequencerModule.init(portalApp.scene, portalApp.camera, portalApp.renderer, portalApp.audioContext, portalApp.mainMixBus); // Now connects to mainMixBus

                // Sampler Setup (capture destination connects FROM masterGain to capture ALL audio)
                portalApp.captureDestination = portalApp.audioContext.createMediaStreamDestination();
                portalApp.masterGain.connect(portalApp.captureDestination); 


                // Apply loaded state (order is crucial: modules initialized, then state applied)
                portalApp.applyDeferredState();

                // Setup UI Listeners
                portalApp.setupUILeseners();
                portalApp.createLayerControlIcons(); // Create layer icons after sequencer module is initialized

                // Hide start button
                document.getElementById('start-button').classList.add('hidden');
                
                // Set initial UI visibility (main panel will be hidden/shown, others always visible)
                portalApp.toggleUI(portalApp.uiVisible); 

                // Ensure initial values are applied (updated again after deferred state to override if needed)
                portalApp.updateCrossfader(portalApp.crossfaderValue);
                portalApp.updateGlobalFuzz(portalApp.globalFuzzAmount);
                portalApp.updateMasterVolume(portalApp.masterOutputVolume);
                portalApp.updateSampleVolume(document.getElementById('sample-volume-slider').value); // Ensure sample volume is set from loaded value

                portalApp.animate();
                window.dispatchEvent(new Event('resize')); // Trigger initial resize

                console.log("Morphic Resonance Deck Initialized.");

            } catch (error) {
                console.error('Failed to initialize AudioContext:', error);
                alert('Audio cannot be started. Please ensure your browser allows autoplay or try refreshing. Error: ' + error.message);
            }
        };

        portalApp.animate = () => {
            requestAnimationFrame(portalApp.animate);

            // Update global audio level for visualizers
            if (portalApp.globalAnalyser && portalApp.globalFrequencyData) {
                let sum = 0;
                portalApp.globalAnalyser.getByteFrequencyData(portalApp.globalFrequencyData);
                for (let i = 0; i < portalApp.globalFrequencyData.length; i++) {
                    sum += portalApp.globalFrequencyData[i];
                }
                portalApp.globalAudioLevel = (sum / portalApp.globalFrequencyData.length) / 255;
            }

            // Get global mouse position for shaders
            const globalMousePos = new THREE.Vector2(
                portalApp.mouse.x / window.innerWidth, // mouse.x is clientX
                1.0 - portalApp.mouse.y / window.innerHeight // mouse.y is clientY, invert for UV
            );

            // Update modules
            if (portalApp.droneModule) portalApp.droneModule.update(performance.now() / 1000, portalApp.globalAudioLevel, globalMousePos);
            if (portalApp.sequencerModule) portalApp.sequencerModule.update(performance.now() / 1000, portalApp.globalAudioLevel, globalMousePos);
            
            // Render the combined scene
            if (portalApp.renderer && portalApp.scene && portalApp.camera) {
                portalApp.renderer.render(portalApp.scene, portalApp.camera);
            }
        };

        // --- UI CONTROL FUNCTIONS ---

        portalApp.setupUILeseners = () => {
            // Main Panel BPM Controls
            document.getElementById('bpm-up-btn').onclick = () => portalApp.changeBPM(5);
            document.getElementById('bpm-down-btn').onclick = () => portalApp.changeBPM(-5);

            // Main Panel Volume Sliders
            document.getElementById('drone-volume-slider').oninput = (e) => {
                if (portalApp.droneModule && portalApp.droneModule.outputGain) portalApp.droneModule.outputGain.gain.value = parseFloat(e.target.value);
                portalApp.updateCrossfader(portalApp.crossfaderValue); // Re-apply crossfader for instant volume update
                portalApp.updateStateInURL();
            };
            document.getElementById('seq-volume-slider').oninput = (e) => {
                if (portalApp.sequencerModule && portalApp.sequencerModule.outputGain) portalApp.sequencerModule.outputGain.gain.value = parseFloat(e.target.value);
                portalApp.updateStateInURL();
            };
            document.getElementById('master-output-volume-slider').oninput = (e) => {
                portalApp.updateMasterVolume(parseFloat(e.target.value));
                portalApp.updateStateInURL();
            };

            // Sampler Controls
            document.getElementById('capture-sample-btn').onclick = () => portalApp.captureSample();
            document.getElementById('play-sample-btn').onclick = () => portalApp.playSample();
            document.getElementById('sample-volume-slider').oninput = (e) => {
                portalApp.updateSampleVolume(parseFloat(e.target.value));
                portalApp.updateStateInURL();
            };

            // Crossfader (Drone vs Sample)
            document.getElementById('crossfader-slider').oninput = (e) => {
                portalApp.updateCrossfader(parseFloat(e.target.value));
                portalApp.updateStateInURL();
            };

            // Global Fuzz
            document.getElementById('fuzz-slider').oninput = (e) => {
                portalApp.updateGlobalFuzz(parseFloat(e.target.value));
                portalApp.updateStateInURL();
            };

            // Sequencer Influence
            const influenceSlider = document.getElementById('influence-slider');
            influenceSlider.oninput = (e) => {
                if (portalApp.sequencerModule) portalApp.sequencerModule.setInfluence(parseFloat(e.target.value));
                portalApp.updateStateInURL();
            };

            // Mouse Scroll Wheel for Influence Slider
            window.addEventListener('wheel', (e) => {
                if (!portalApp.sequencerModule) return;
                e.preventDefault(); 
                let currentValue = parseFloat(influenceSlider.value);
                const step = 0.02; 
                if (e.deltaY < 0) { currentValue = Math.min(1.0, currentValue + step); } 
                else { currentValue = Math.max(0.0, currentValue - step); }
                influenceSlider.value = currentValue;
                portalApp.sequencerModule.setInfluence(currentValue);
                portalApp.updateStateInURL();
            }, { passive: false });

            // Global Play/Pause Button
            document.getElementById('play-pause-button').onclick = () => {
                if (portalApp.sequencerModule) portalApp.sequencerModule.togglePlayPause();
                document.getElementById('play-pause-button').textContent = portalApp.sequencerModule.isPlaying ? '❚❚' : '►';
                portalApp.updateStateInURL();
            };
            
            // Canvas Interaction (Unified Logic for MOUSE)
            const canvas = document.getElementById('canvas');
            portalApp.mouse = { x: 0, y: 0, down: false }; // Global mouse state for drag

            canvas.addEventListener('mousedown', (e) => {
                portalApp.mouse.down = true;
                portalApp.mouse.x = e.clientX;
                portalApp.mouse.y = e.clientY;

                // Check for UI toggle first (Shift+Click)
                if (e.shiftKey) {
                    portalApp.toggleUI();
                    e.preventDefault(); // Prevent default browser action
                    return; // Don't proceed with other click handling
                }

                if (e.clientX < window.innerWidth / 2) { // Left half (Drone interaction)
                    // No explicit action here, mousemove handles sculpting
                } else { // Right half (Sequencer interaction)
                    if (portalApp.sequencerModule) {
                        portalApp.sequencerModule.handleCanvasClick(e);
                    }
                }
            });

            canvas.addEventListener('mousemove', (e) => {
                portalApp.mouse.x = e.clientX;
                portalApp.mouse.y = e.clientY;
                
                // For drone module, update its mouse position only if mouse is down and it's on left half
                if (portalApp.mouse.down && e.clientX < window.innerWidth / 2) {
                    if (!portalApp.uiVisible && portalApp.droneModule) { // Still sculpt if UI is hidden
                        const mouseX_norm_on_left_half = e.clientX / (window.innerWidth / 2); // Normalize mouseX to 0-1 for left half
                        const mouseY_norm = 1.0 - e.clientY / window.innerHeight; // Invert Y
                        
                        portalApp.droneModule.setMousePosition(mouseX_norm_on_left_half, mouseY_norm);
                        portalApp.droneModule.droneAudioFrequency = 100 + mouseX_norm_on_left_half * 400; 
                        portalApp.droneModule.droneAudioResonance = Math.sin(portalApp.droneModule.time * 0.01 + mouseX_norm_on_left_half * Math.PI) * 0.5 + 0.5;
                        portalApp.droneModule.visualBloom = 0.3 + mouseY_norm * 0.7;
                        portalApp.droneModule.visualFlow = mouseX_norm_on_left_half * 2;
                        portalApp.droneModule.visualIntensity = 0.5 + mouseY_norm * 0.5;
                        portalApp.droneModule.updateAudioParameters();
                        portalApp.updateStateInURL(); 
                    }
                }
            });

            canvas.addEventListener('mouseup', () => {
                portalApp.mouse.down = false;
            });
            canvas.addEventListener('mouseleave', () => {
                portalApp.mouse.down = false;
            });

            // Canvas Interaction (Unified Logic for TOUCH)
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Prevent scrolling/zooming
                portalApp.mouse.down = true;
                portalApp.mouse.x = e.touches[0].clientX;
                portalApp.mouse.y = e.touches[0].clientY;

                if (e.touches.length === 2) { // 2-finger tap for UI (main panel)
                    portalApp.toggleUI();
                } else if (e.touches.length === 3) { // 3-finger tap for Layer Control
                    portalApp.toggleLayerControl();
                } else if (e.touches.length === 1) { // Single finger for interaction
                    if (e.touches[0].clientX < window.innerWidth / 2) { // Left half (Drone interaction)
                        // Handled by touchmove
                    } else { // Right half (Sequencer interaction)
                        if (portalApp.sequencerModule) {
                            portalApp.sequencerModule.handleCanvasClick(e.touches[0]);
                        }
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1 && portalApp.mouse.down) {
                    portalApp.mouse.x = e.touches[0].clientX;
                    portalApp.mouse.y = e.touches[0].clientY;

                    // For drone module, update its mouse position only if touch is down and it's on left half
                    if (e.touches[0].clientX < window.innerWidth / 2) {
                        if (!portalApp.uiVisible && portalApp.droneModule) { // Still sculpt if UI is hidden
                            const mouseX_norm_on_left_half = e.touches[0].clientX / (window.innerWidth / 2); // Normalize mouseX to 0-1 for left half
                            const mouseY_norm = 1.0 - e.touches[0].clientY / window.innerHeight; // Invert Y
                            
                            portalApp.droneModule.setMousePosition(mouseX_norm_on_left_half, mouseY_norm);
                            portalApp.droneModule.droneAudioFrequency = 100 + mouseX_norm_on_left_half * 400; 
                            portalApp.droneModule.droneAudioResonance = Math.sin(portalApp.droneModule.time * 0.01 + mouseX_norm_on_left_half * Math.PI) * 0.5 + 0.5;
                            portalApp.droneModule.visualBloom = 0.3 + mouseY_norm * 0.7;
                            portalApp.droneModule.visualFlow = mouseX_norm_on_left_half * 2;
                            portalApp.droneModule.visualIntensity = 0.5 + mouseY_norm * 0.5;
                            portalApp.droneModule.updateAudioParameters();
                            portalApp.updateStateInURL(); 
                        }
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                if (e.touches.length === 0) {
                    portalApp.mouse.down = false;
                }
            }, { passive: false });

            // Keyboard event for Layer Control
            document.addEventListener('keydown', (e) => {
                if (e.key === 'l' || e.key === 'L') { 
                    portalApp.toggleLayerControl();
                }
            });

            // BPM Control click handler (for the circular button)
            document.getElementById('bpm-control').addEventListener('click', (e) => {
                e.stopPropagation(); 
                portalApp.changeBPM(5); // Cycle BPM directly
                portalApp.scheduleHideBPMControl(); 
            });
            
            // Layer Control Panel click handler (for any area outside icons)
            document.getElementById('layer-control-panel').addEventListener('click', (e) => {
                if (e.target === document.getElementById('layer-control-panel')) {
                    portalApp.scheduleHideLayerControl();
                }
            });

            // General click to hide any visible controls
            document.addEventListener('click', (e) => {
                if (portalApp.bpmControlVisible && !e.target.closest('#bpm-control')) {
                    portalApp.scheduleHideBPMControl();
                }
                if (portalApp.layerControlVisible && !e.target.closest('#layer-control-panel')) {
                    portalApp.scheduleHideLayerControl();
                }
            });

            // Prevent immediate hide on hover (desktop only)
            document.getElementById('bpm-control').addEventListener('mouseenter', () => clearTimeout(portalApp.hideBpmTimer));
            document.getElementById('bpm-control').addEventListener('mouseleave', () => portalApp.scheduleHideBPMControl());
            document.getElementById('layer-control-panel').addEventListener('mouseenter', () => clearTimeout(portalApp.hideLayerControlTimer));
            document.getElementById('layer-control-panel').addEventListener('mouseleave', () => portalApp.scheduleHideLayerControl());

            // Window Resize Listener
            window.addEventListener('resize', () => {
                if (portalApp.renderer && portalApp.camera) {
                    portalApp.camera.aspect = window.innerWidth / window.innerHeight;
                    portalApp.camera.updateProjectionMatrix();
                    portalApp.renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });
        };

        // --- GLOBAL STATE UPDATE FUNCTIONS ---

        // Schedule hide for BPM control
        portalApp.scheduleHideBPMControl = () => {
            clearTimeout(portalApp.hideBpmTimer);
            portalApp.hideBpmTimer = setTimeout(() => {
                document.getElementById('bpm-control').classList.remove('visible');
                portalApp.bpmControlVisible = false;
            }, 3000);
        };

        // Schedule hide for Layer control
        portalApp.scheduleHideLayerControl = () => {
            clearTimeout(portalApp.hideLayerControlTimer);
            portalApp.hideLayerControlTimer = setTimeout(() => {
                document.getElementById('layer-control-panel').classList.remove('visible');
                portalApp.layerControlVisible = false;
            }, 3000);
        };

        portalApp.updateControlsUI = () => {
            // Update values on DOM elements for the main control panel
            if (portalApp.sequencerModule) {
                document.getElementById('bpm-display-panel').textContent = portalApp.sequencerModule.bpm;
                document.getElementById('seq-volume-slider').value = portalApp.sequencerModule.outputGain.gain.value;
                document.getElementById('influence-slider').value = portalApp.sequencerModule.influence;
                document.getElementById('bpm-display').textContent = portalApp.sequencerModule.bpm; // For the circular BPM display
                document.getElementById('play-pause-button').textContent = portalApp.sequencerModule.isPlaying ? '❚❚' : '►';
            }
            if (portalApp.droneModule) {
                 document.getElementById('drone-volume-slider').value = portalApp.droneModule.outputGain.gain.value;
            }
            
            document.getElementById('master-output-volume-slider').value = portalApp.masterOutputVolume;
            document.getElementById('crossfader-slider').value = portalApp.crossfaderValue;
            document.getElementById('fuzz-slider').value = portalApp.globalFuzzAmount;
            
            if (portalApp.samplerMasterGain) {
                document.getElementById('sample-volume-slider').value = portalApp.samplerMasterGain.gain.value;
            }
            document.getElementById('play-sample-btn').disabled = !portalApp.samplerBuffer;
            document.getElementById('play-sample-btn').classList.toggle('active', portalApp.isSamplerPlaying);
            
            portalApp.updateLayerControlUI(); // Ensure layer selection is updated
        };

        portalApp.changeBPM = (delta) => {
            if (!portalApp.sequencerModule) return;
            portalApp.sequencerModule.setBPM(Math.max(60, Math.min(240, portalApp.sequencerModule.bpm + delta))); 
            document.getElementById('bpm-display-panel').textContent = portalApp.sequencerModule.bpm; // Update panel BPM
            document.getElementById('bpm-display').textContent = portalApp.sequencerModule.bpm; // Update circular BPM
            portalApp.updateStateInURL(); 
        };

        portalApp.updateMasterVolume = (value) => {
            portalApp.masterOutputVolume = value;
            if (portalApp.masterGain && portalApp.audioContext && !isNaN(value)) {
                portalApp.masterGain.gain.setTargetAtTime(value, portalApp.audioContext.currentTime, 0.05);
            }
        };

        portalApp.updateCrossfader = (value) => {
            portalApp.crossfaderValue = value;
            if (!portalApp.crossfaderInputDrone || !portalApp.crossfaderInputSample || !portalApp.audioContext) return;

            // Equal-power crossfading for audio (Drone vs Sample)
            const gainDrone = Math.cos(value * 0.5 * Math.PI); // Drone on left
            const gainSample = Math.sin(value * 0.5 * Math.PI); // Sample on right

            // Apply to their respective crossfader inputs' gains
            if (!isNaN(gainDrone) && portalApp.droneModule && portalApp.droneModule.outputGain) {
                portalApp.crossfaderInputDrone.gain.setTargetAtTime(gainDrone * portalApp.droneModule.outputGain.gain.value, portalApp.audioContext.currentTime, 0.01);
            }
            if (!isNaN(gainSample) && portalApp.samplerMasterGain) { 
                portalApp.crossfaderInputSample.gain.setTargetAtTime(gainSample * portalApp.samplerMasterGain.gain.value, portalApp.audioContext.currentTime, 0.01);
            }

            // Visual crossfading of the canvas sections (based on overall UI visibility)
            const baseOpacity = portalApp.uiVisible ? 0.2 : 1.0;
            if (portalApp.droneModule && portalApp.droneModule.mesh && portalApp.droneModule.mesh.material) {
                portalApp.droneModule.mesh.material.opacity = baseOpacity * gainDrone; 
            }
            if (portalApp.sequencerModule && portalApp.sequencerModule.mesh && portalApp.sequencerModule.mesh.material) {
                // Sequencer opacity is not tied to crossfader, but to baseOpacity
                // Let's keep it simple and tie it to the max visual opacity if UI hidden, otherwise its own uniform.
                // Or, if it IS meant to be tied to the crossfader, it would be blended with Drone.
                // Assuming it's NOT tied to crossfader:
                portalApp.sequencerModule.mesh.material.opacity = baseOpacity; 
            }
        };

        portalApp.updateGlobalFuzz = (value) => {
            portalApp.globalFuzzAmount = value;
            if (portalApp.globalFuzzNode && portalApp.audioContext && !isNaN(value)) {
                portalApp.globalFuzzNode.curve = makeDistortionCurve(value * 100);
                portalApp.globalFuzzDryGain.gain.setTargetAtTime(1 - value, portalApp.audioContext.currentTime, 0.01);
                portalApp.globalFuzzWetGain.gain.setTargetAtTime(value, portalApp.audioContext.currentTime, 0.01);
            }
        };

        portalApp.updateSampleVolume = (value) => {
            if (portalApp.samplerMasterGain && portalApp.audioContext && !isNaN(value)) {
                portalApp.samplerMasterGain.gain.setTargetAtTime(value, portalApp.audioContext.currentTime, 0.05);
            }
            // Re-apply crossfader mix with new base sampler volume
            portalApp.updateCrossfader(portalApp.crossfaderValue); 
        };

        portalApp.createLayerControlIcons = () => {
            const layerControlPanel = document.getElementById('layer-control-panel');
            if (!portalApp.sequencerModule) return; 

            // Clear existing icons if recreating
            layerControlPanel.innerHTML = ''; 

            portalApp.sequencerModule.layers.forEach((layer, index) => {
                const iconDiv = document.createElement('div');
                iconDiv.className = 'layer-icon';
                iconDiv.textContent = String.fromCharCode(0x2460 + index); // Circled numbers
                iconDiv.dataset.layerIndex = index;
                iconDiv.addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    portalApp.selectLayer(index);
                    portalApp.scheduleHideLayerControl(); 
                });
                layerControlPanel.appendChild(iconDiv);
            });
            portalApp.updateLayerControlUI(); // Ensure initial UI state is correct after creation
        };

        portalApp.selectLayer = (index) => {
            if (!portalApp.sequencerModule || index < 0 || index >= portalApp.sequencerModule.layers.length) return;

            if (portalApp.sequencerModule.activeLayerIndex === index) { 
                // If clicking the currently selected layer, toggle its active (playback) state
                portalApp.sequencerModule.layers[index].isActive = !portalApp.sequencerModule.layers[index].isActive;
            } else {
                // If selecting a different layer, make it the active editing layer
                portalApp.sequencerModule.activeLayerIndex = index;
            }
            portalApp.sequencerModule.updateSequencerVisualNodes(); // Update 3D nodes to show pattern of newly selected layer
            portalApp.updateLayerControlUI(); // Update UI to reflect changes
            portalApp.updateStateInURL(); 
        };

        portalApp.updateLayerControlUI = () => {
            const layerIcons = document.querySelectorAll('#layer-control-panel .layer-icon');
            layerIcons.forEach((icon, i) => {
                if (!portalApp.sequencerModule) return; 

                const layer = portalApp.sequencerModule.layers[i];
                // Toggle 'active' class based on layer's isActive playback state
                icon.classList.toggle('active', layer.isActive);
                // Toggle 'selected' class based on activeLayerIndex (for editing)
                icon.classList.toggle('selected', i === portalApp.sequencerModule.activeLayerIndex);

                // Set background color of icon based on its layer's assigned color
                const layerColor = portalApp.sequencerModule.layerColors[layer.colorIndex] || portalApp.sequencerModule.layerColors[0];
                icon.style.backgroundColor = portalApp.hsvToRgb(layerColor[0], layerColor[1], layerColor[2], 0.2); 
                
                // Set border color based on state
                if(icon.classList.contains('active')) {
                    icon.style.borderColor = portalApp.hsvToRgb(layerColor[0], layerColor[1], layerColor[2]);
                    icon.style.boxShadow = `0 0 10px ${portalApp.hsvToRgb(layerColor[0], layerColor[1], layerColor[2])}`;
                } else {
                    icon.style.borderColor = `rgba(255,255,255,0.1)`;
                    icon.style.boxShadow = 'none';
                }

                // Override border/shadow if selected (editing)
                if (icon.classList.contains('selected')) {
                    icon.style.borderColor = '#fff';
                    icon.style.boxShadow = '0 0 15px #fff';
                }
            });
        };

        portalApp.toggleLayerControl = () => {
            const panel = document.getElementById('layer-control-panel');
            portalApp.layerControlVisible = !portalApp.layerControlVisible;
            if (portalApp.layerControlVisible) {
                panel.classList.add('visible');
                portalApp.updateLayerControlUI(); 
                portalApp.scheduleHideLayerControl();
            } else {
                panel.classList.remove('visible');
            }
        };

        portalApp.toggleUI = (forceVisibility = null) => {
            portalApp.uiVisible = (forceVisibility !== null) ? forceVisibility : !portalApp.uiVisible;
            
            const elementsToToggle = [
                document.getElementById('master-control-panel'),
                // document.getElementById('play-pause-button') // Play/Pause is now always visible
            ];
            
            if (portalApp.uiVisible) {
                elementsToToggle.forEach(el => el.classList.remove('hidden'));
            } else {
                elementsToToggle.forEach(el => el.classList.add('hidden'));
            }
            
            portalApp.updateCrossfader(portalApp.crossfaderValue); // Update canvas opacity based on UI visibility AND crossfader

            portalApp.updateStateInURL(); 
        };

        // --- SAMPLER FUNCTIONS ---
        portalApp.captureSample = async () => {
            if (!portalApp.audioContext || portalApp.audioContext.state !== 'running') {
                console.warn("AudioContext not running, cannot capture.");
                return;
            }
            if (portalApp.isSampling) {
                console.warn("Already sampling.");
                return;
            }
            
            const captureBtn = document.getElementById('capture-sample-btn');
            const playBtn = document.getElementById('play-sample-btn');
            
            captureBtn.classList.add('active'); // Indicate recording
            playBtn.disabled = true; // Disable play during capture

            portalApp.recorder = new MediaRecorder(portalApp.captureDestination.stream);
            portalApp.recordedChunks = [];
            portalApp.isSampling = true;

            portalApp.recorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    portalApp.recordedChunks.push(event.data);
                }
            };

            portalApp.recorder.onstop = async () => {
                captureBtn.classList.remove('active');
                playBtn.disabled = false; // Enable play button
                
                const blob = new Blob(portalApp.recordedChunks, { type: 'audio/webm' });
                const audioURL = URL.createObjectURL(blob);
                
                try {
                    const response = await fetch(audioURL);
                    const arrayBuffer = await response.arrayBuffer();
                    portalApp.samplerBuffer = await portalApp.audioContext.decodeAudioData(arrayBuffer);
                    console.log("Sampler loop captured and decoded.");
                    portalApp.playSample(); // Play immediately after capture
                } catch (error) {
                    console.error("Error decoding audio data:", error);
                    alert("Error capturing sample. Try again.");
                } finally {
                    URL.revokeObjectURL(audioURL);
                    portalApp.isSampling = false;
                    portalApp.updateStateInURL(); 
                }
            };

            portalApp.recorder.start();
            console.log("Sampling started for " + portalApp.captureDuration + " seconds.");
            setTimeout(() => {
                if (portalApp.recorder.state === 'recording') {
                    portalApp.recorder.stop();
                }
            }, portalApp.captureDuration * 1000); 
        };

        portalApp.playSample = () => {
            if (!portalApp.samplerBuffer) {
                console.warn("No audio loop captured.");
                return;
            }

            const playBtn = document.getElementById('play-sample-btn');
            if (portalApp.isSamplerPlaying) {
                // Already playing, stop it
                if (portalApp.samplerSource) {
                    portalApp.samplerMasterGain.gain.setTargetAtTime(0, portalApp.audioContext.currentTime, 0.05); // Fade out
                    portalApp.samplerSource.stop(portalApp.audioContext.currentTime + 0.1); 
                    portalApp.samplerSource.onended = () => {
                        portalApp.samplerSource.disconnect();
                        portalApp.samplerSource = null;
                    };
                }
                portalApp.isSamplerPlaying = false;
                playBtn.classList.remove('active');
                console.log("Sampler loop stopped.");
            } else {
                // Start playing
                portalApp.samplerSource = portalApp.audioContext.createBufferSource();
                portalApp.samplerSource.buffer = portalApp.samplerBuffer;
                portalApp.samplerSource.loop = true;
                portalApp.samplerSource.connect(portalApp.samplerMasterGain);
                portalApp.samplerSource.start(0);

                portalApp.samplerMasterGain.gain.setTargetAtTime(portalApp.samplerMasterGain.gain.value, portalApp.audioContext.currentTime, 0.05); // Fade in to current sample volume
                portalApp.isSamplerPlaying = true;
                playBtn.classList.add('active');
                console.log("Sampler loop playing.");
            }
            portalApp.updateStateInURL(); 
        };

        // --- STATE PERSISTENCE ---

        portalApp.updateStateInURL = () => {
            const state = {
                droneModule: portalApp.droneModule ? {
                    visualIntensity: portalApp.droneModule.visualIntensity,
                    visualFlow: portalApp.droneModule.visualFlow,
                    visualBloom: portalApp.droneModule.visualBloom,
                    droneAudioFrequency: portalApp.droneModule.droneAudioFrequency,
                    droneAudioResonance: portalApp.droneModule.droneAudioResonance,
                    outputGainValue: portalApp.droneModule.outputGain.gain.value
                } : null,
                sequencerModule: portalApp.sequencerModule ? {
                    bpm: portalApp.sequencerModule.bpm,
                    layers: portalApp.sequencerModule.layers,
                    activeLayerIndex: portalApp.sequencerModule.activeLayerIndex,
                    influence: portalApp.sequencerModule.influence,
                    isPlaying: portalApp.sequencerModule.isPlaying,
                    outputGainValue: portalApp.sequencerModule.outputGain.gain.value
                } : null,
                crossfaderValue: portalApp.crossfaderValue,
                globalFuzzAmount: portalApp.globalFuzzAmount,
                masterOutputVolume: portalApp.masterOutputVolume,
                uiVisible: portalApp.uiVisible,
                samplerVolume: portalApp.samplerMasterGain ? portalApp.samplerMasterGain.gain.value : 0,
                isSamplerPlaying: portalApp.isSamplerPlaying
                // NOTE: Sampler buffer itself is NOT stored in URL hash due to size constraints.
            };
            try {
                const encoded = btoa(JSON.stringify(state));
                window.location.hash = encoded;
            } catch (error) {
                console.warn('Failed to update URL state (likely too large or malformed):', error);
            }
        };
        
        portalApp.loadStateFromURL = () => {
            try {
                if (window.location.hash) {
                    const state = JSON.parse(atob(window.location.hash.slice(1)));
                    
                    // Robustly load global numeric values
                    portalApp.crossfaderValue = (typeof state.crossfaderValue === 'number' && !isNaN(state.crossfaderValue)) ? state.crossfaderValue : 0.5;
                    portalApp.globalFuzzAmount = (typeof state.globalFuzzAmount === 'number' && !isNaN(state.globalFuzzAmount)) ? state.globalFuzzAmount : 0.0;
                    portalApp.masterOutputVolume = (typeof state.masterOutputVolume === 'number' && !isNaN(state.masterOutputVolume)) ? state.masterOutputVolume : 0.5;
                    portalApp.uiVisible = state.uiVisible !== undefined ? state.uiVisible : true;
                    portalApp.isSamplerPlaying = state.isSamplerPlaying !== undefined ? state.isSamplerPlaying : false;
                    
                    portalApp.deferredState = state; // Defer module-specific state loading
                    
                }
            } catch (error) {
                console.warn('Failed to load state from URL:', error);
                // Default values are already set initially, so no need to reset here, just warn.
            }
        };

        // Apply deferred module state after modules are fully initialized
        portalApp.applyDeferredState = () => {
            if (portalApp.deferredState) {
                if (portalApp.droneModule && portalApp.deferredState.droneModule) {
                    const droneState = portalApp.deferredState.droneModule;
                    if (droneState.visualIntensity !== undefined) portalApp.droneModule.visualIntensity = droneState.visualIntensity;
                    if (droneState.visualFlow !== undefined) portalApp.droneModule.visualFlow = droneState.visualFlow;
                    if (droneState.visualBloom !== undefined) portalApp.droneModule.visualBloom = droneState.visualBloom;
                    if (droneState.droneAudioFrequency !== undefined) portalApp.droneModule.droneAudioFrequency = droneState.droneAudioFrequency;
                    if (droneState.droneAudioResonance !== undefined) portalApp.droneModule.droneAudioResonance = droneState.droneAudioResonance;
                    if (droneState.outputGainValue !== undefined) portalApp.droneModule.outputGain.gain.value = droneState.outputGainValue;
                }
                if (portalApp.sequencerModule && portalApp.deferredState.sequencerModule) {
                    const seqState = portalApp.deferredState.sequencerModule;
                    if (seqState.bpm !== undefined) portalApp.sequencerModule.setBPM(seqState.bpm);
                    if (seqState.layers) {
                         // Deep copy and validate layers
                        portalApp.sequencerModule.layers = seqState.layers.map(layer => ({
                            id: layer.id,
                            nodeStates: Array.isArray(layer.nodeStates) && layer.nodeStates.length === 8 ? 
                                layer.nodeStates.map(ns => typeof ns === 'boolean' ? ns : false) : Array(8).fill(false),
                            colorIndex: typeof layer.colorIndex === 'number' && !isNaN(layer.colorIndex) && portalApp.sequencerModule.layerColors && layer.colorIndex >= 0 && layer.colorIndex < portalApp.sequencerModule.layerColors.length ? 
                                layer.colorIndex : 0,
                            isActive: typeof layer.isActive === 'boolean' ? layer.isActive : false
                        }));
                    }
                    if (seqState.activeLayerIndex !== undefined) portalApp.sequencerModule.activeLayerIndex = seqState.activeLayerIndex;
                    if (seqState.influence !== undefined) portalApp.sequencerModule.setInfluence(seqState.influence);
                    if (seqState.isPlaying !== undefined) portalApp.sequencerModule.isPlaying = seqState.isPlaying;
                    if (seqState.outputGainValue !== undefined) portalApp.sequencerModule.outputGain.gain.value = seqState.outputGainValue;

                    portalApp.sequencerModule.updateSequencerVisualNodes(); // Apply loaded pattern
                }
                if (portalApp.samplerMasterGain && portalApp.deferredState.samplerVolume !== undefined) {
                    portalApp.samplerMasterGain.gain.value = portalApp.deferredState.samplerVolume;
                }

                portalApp.deferredState = null; // Clear deferred state
            }
        };

    </script>
</body>
</html>
