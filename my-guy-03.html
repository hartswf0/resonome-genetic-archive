<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Morphic Resonance Deck</title>
    <style>
        /* General Reset and Body Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Prevent text selection by default */
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        }
        
        body {
            background: #000;
            overflow: hidden; /* Prevent body scroll */
            cursor: none; /* Hide default cursor to emphasize custom interaction */
            touch-action: none; /* Prevent browser gestures like pull-to-refresh, zoom */
            font-family: 'Courier New', monospace; /* Classic monospace font */
            color: #E0FFFF; /* Light cyan text color */
        }

        /* Main Canvas (single canvas for both decks) */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: opacity 0.5s ease; /* For fading when UI is shown */
        }
        
        /* Loading Indicator */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(224, 255, 255, 0.5); /* Semi-transparent cyan */
            font-size: 1.2em;
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Unified Master Control Panel */
        #master-control-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Spacing between control groups */
            z-index: 50;
            opacity: 1; /* Initially visible */
            transition: opacity 0.4s ease, transform 0.4s ease; /* Smooth show/hide and scale */
            backdrop-filter: blur(5px);
            background: rgba(0, 0, 0, 0.4);
            padding: min(5vw, 25px); /* Responsive padding: 5vw or max 25px */
            border-radius: 15px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            pointer-events: auto; /* Active when visible */
            
            /* Mobile Responsiveness for Panel */
            max-width: 95vw; /* Limit width on small screens */
            max-height: 95vh; /* Limit height on small screens */
            overflow-y: auto; /* Allow scrolling if content overflows vertically */
            -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */

            /* Morphic Glow */
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.2);
            animation: panel-glow 3s infinite alternate ease-in-out;
        }

        #master-control-panel.hidden {
            opacity: 0;
            pointer-events: none; /* Make non-interactive when hidden */
            transform: translate(-50%, -50%) scale(0.95); /* Slight scale down on hide */
        }

        @keyframes panel-glow {
            from { box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.2); }
            to { box-shadow: 0 0 25px rgba(0, 255, 255, 0.8), inset 0 0 15px rgba(0, 255, 255, 0.4); }
        }
        
        /* Control Group Layout */
        .control-group {
            display: flex;
            flex-direction: column; /* Stack label and control */
            align-items: center;
            gap: 8px;
            width: 100%; /* Take full width of panel */
        }

        .control-group label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(224, 255, 255, 0.8);
        }

        /* BPM Display and Buttons - Make them cell-like */
        .bpm-display-panel { /* Specific for the panel BPM display */
            font-size: 2.2em; /* Large BPM number */
            font-weight: bold;
            color: #00FFFF;
            padding: 10px 15px; /* More padding */
            min-width: 80px; /* Ensure consistent width */
            text-align: center;
            background: rgba(224, 255, 255, 0.1); /* Cell background */
            border: 2px solid rgba(0, 255, 255, 0.3); /* Themed border */
            border-radius: 8px; /* Consistent border radius */
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6); /* Inner shadow for depth */
        }
        
        .bpm-btns {
            display: flex;
            gap: 12px; /* Spacing between BPM buttons */
        }

        .bpm-btn {
            width: clamp(45px, 12vw, 55px); /* Responsive sizing, matches step cells */
            height: clamp(45px, 12vw, 55px); /* Responsive sizing, matches step cells */
            background: rgba(224, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.3); /* Themed border */
            color: #E0FFFF;
            font-size: 2.5em; /* Larger symbols */
            line-height: 1; /* Center symbol */
            cursor: pointer;
            border-radius: 8px; /* Consistent with cells */
            transition: background 0.1s ease, border-color 0.1s ease, box-shadow 0.1s ease;
            display: flex; /* For centering unicode symbols */
            align-items: center;
            justify-content: center;
        }
        .bpm-btn:hover {
            background: rgba(224, 255, 255, 0.2);
            border-color: #E0FFFF;
        }
        .bpm-btn:active {
            background: #E0FFFF;
            color: #000;
            box-shadow: 0 0 10px #E0FFFF;
            transform: scale(0.98); /* Slight press effect */
        }

        /* Slider Styles (Chunkier, Dot Grid Matrix-like) */
        input[type="range"] {
            -webkit-appearance: none;
            width: 200px; /* Wider slider */
            max-width: 100%; /* Ensure it fits within parent on smaller screens */
            height: 24px; /* Much thicker slider track */
            background: rgba(0, 255, 255, 0.15); /* Themed background */
            border-radius: 8px; /* Consistent with cells */
            outline: none;
            cursor: grab;
            margin: 0;
            padding: 0;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6); /* Inner shadow for depth */
            border: 2px solid rgba(0, 255, 255, 0.3); /* Themed border for track */
            transition: background 0.1s ease, border-color 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px; /* Cell-like thumb */
            height: 28px; /* Cell-like thumb */
            border-radius: 4px; /* Slightly rounded square for pixel-art feel */
            background: #00FFFF; /* Cyan thumb */
            cursor: grab;
            box-shadow: 0 0 10px #00FFFF; /* Strong glow */
            border: 2px solid #00FFFF; /* Matching border */
            transition: background 0.1s ease, box-shadow 0.1s ease, transform 0.1s ease;
            margin-top: -6px; /* Adjust to center vertically on thicker track */
        }

        input[type="range"]:active::-webkit-slider-thumb {
            cursor: grabbing;
            background: #E0FFFF; /* White on active grab */
            box-shadow: 0 0 15px #E0FFFF, 0 0 30px rgba(224,255,255,0.5);
            transform: scale(1.1); /* Slight press effect */
        }

        /* Firefox specific slider styles */
        input[type="range"]::-moz-range-track { 
            height: 24px;
            background: rgba(0, 255, 255, 0.15);
            border-radius: 8px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6);
        }

        input[type="range"]::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 4px; /* Slightly rounded square */
            background: #00FFFF;
            cursor: grab;
            box-shadow: 0 0 10px #00FFFF;
            border: 2px solid #00FFFF;
            transition: background 0.1s ease, box-shadow 0.1s ease, transform 0.1s ease;
        }
        input[type="range"]:active::-moz-range-thumb {
            cursor: grabbing;
            background: #E0FFFF;
            box-shadow: 0 0 15px #E0FFFF, 0 0 30px rgba(224,255,255,0.5);
            transform: scale(1.1);
        }
        
        /* Sampler Buttons */
        .sampler-btns {
            display: flex;
            gap: 10px;
        }
        .sampler-btn {
            width: clamp(45px, 12vw, 55px); /* Responsive sizing */
            height: clamp(45px, 12vw, 55px); /* Responsive sizing */
            background: rgba(224, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.3); /* Themed border */
            color: #E0FFFF;
            font-size: 2.5em; /* Larger symbols */
            line-height: 1; /* Center symbol */
            cursor: pointer;
            border-radius: 8px; /* Consistent with cells */
            transition: background 0.1s ease, border-color 0.1s ease, box-shadow 0.1s ease;
            display: flex; /* For centering unicode symbols */
            align-items: center;
            justify-content: center;
        }
        .sampler-btn:hover { background: rgba(224, 255, 255, 0.2); border-color: #E0FFFF; }
        .sampler-btn:active { background: #E0FFFF; color: #000; box-shadow: 0 0 10px #E0FFFF; transform: scale(0.98); }
        .sampler-btn.active { background: #FF0096; border-color: #FF0096; color: #000; box-shadow: 0 0 10px #FF0096; } /* Active (recording/playing) color: Magenta */
        .sampler-btn[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(100%);
        }


        /* Crossfader (bottom center) - Always Visible */
        #crossfader-container {
            position: fixed;
            bottom: min(3vh, 30px); /* Responsive position */
            left: 50%;
            transform: translateX(-50%);
            z-index: 60; /* Above canvases, below main panel */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px 15px;
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
        }

        #crossfader-slider {
            width: min(70vw, 400px); /* Responsive width */
        }
        #crossfader-labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.75em;
            color: rgba(224, 255, 255, 0.7);
            user-select: text; /* Allow selection for labels */
        }

        /* Vertical Sliders (Side controls) - Always Visible */
        .vertical-slider-container {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 60px; /* Wider container for better touch */
            height: min(80vh, 300px); /* Responsive height */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 60;
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px 0;
        }

        #fuzz-slider-container { left: min(2vw, 20px); } /* Responsive position */
        #influence-slider-container { right: min(2vw, 20px); } /* Responsive position */

        .vertical-slider {
            -webkit-appearance: none;
            appearance: none;
            width: min(70vh, 250px); /* Responsive length */
            height: 24px; /* Chunkier track */
            background: rgba(0, 255, 255, 0.15);
            border-radius: 8px;
            outline: none;
            transform: rotate(-90deg); /* Vertical orientation */
            transform-origin: center; /* Rotate around center */
            cursor: grab;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6);
            border: 2px solid rgba(0, 255, 255, 0.3);
            transition: background 0.1s ease, border-color 0.1s ease;
        }
        /* Thumb styles for vertical sliders, consistent with horizontal */
        .vertical-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 28px; height: 28px; border-radius: 4px;
            background: #00FFFF; cursor: grab;
            box-shadow: 0 0 10px #00FFFF; border: 2px solid #00FFFF;
            transition: background 0.1s ease, box-shadow 0.1s ease, transform 0.1s ease;
        }
        .vertical-slider:active::-webkit-slider-thumb {
            cursor: grabbing; background: #E0FFFF;
            box-shadow: 0 0 15px #E0FFFF, 0 0 30px rgba(224,255,255,0.5); transform: scale(1.1);
        }
        .vertical-slider::-moz-range-thumb {
            width: 28px; height: 28px; border-radius: 4px;
            background: #00FFFF; cursor: grab;
            box-shadow: 0 0 10px #00FFFF; border: 2px solid #00FFFF;
            transition: background 0.1s ease, box-shadow 0.1s ease, transform 0.1s ease;
        }
        .vertical-slider:active::-moz-range-thumb {
            cursor: grabbing; background: #E0FFFF;
            box-shadow: 0 0 15px #E0FFFF, 0 0 30px rgba(224,255,255,0.5); transform: scale(1.1);
        }

        .vertical-label {
            color: #E0FFFF;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: absolute;
            bottom: -20px; 
            white-space: nowrap; /* Prevent wrapping */
            user-select: text; /* Allow selection for labels */
        }
        #fuzz-label { color: #FF00FF; } /* Magenta for Fuzz */
        #influence-label { color: #00FF00; } /* Green for Influence */

        /* Play/Pause Button */
        #play-pause-button {
            position: fixed;
            bottom: min(10vh, 100px); /* Position it above crossfader */
            left: 50%;
            transform: translateX(-50%);
            width: 55px; /* Consistent with other buttons */
            height: 55px; /* Consistent with other buttons */
            background: rgba(224, 255, 255, 0.1);
            color: #E0FFFF;
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px; /* Consistent with other buttons */
            cursor: pointer;
            transition: all 0.3s;
            z-index: 60; /* Above canvases, below main panel */
            font-size: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        #play-pause-button:hover { background: rgba(224, 255, 255, 0.2); border-color: #E0FFFF; }
        #play-pause-button:active { background: #E0FFFF; color: #000; box-shadow: 0 0 10px #E0FFFF; transform: scale(0.98); }
        #play-pause-button.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(20px);
        }


        /* Start Button (initial screen) */
        #start-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 200;
            font-family: 'Courier New', monospace;
        }

        #start-button:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        #start-button.hidden { 
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.9); /* Subtle scale down on hide */
        }

        /* Info Text */
        .info-text {
            font-size: 0.75em;
            text-align: center;
            color: rgba(224, 255, 255, 0.6);
            margin-top: 10px;
            line-height: 1.4;
            user-select: text; /* Allow selection for info text */
        }
        .sampler-info { /* Special styling for sampler info if needed */
            margin-top: -5px; 
            margin-bottom: 5px; 
        }

        /* --- UI ELEMENTS for "single canvas" concepts --- */
        /* Hidden BPM Control (Circular) */
        #bpm-control {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(0,255,255,0.1) 0%, transparent 70%);
            border: 2px solid rgba(0,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(0,255,255,0.8);
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer;
            z-index: 5; /* Below main panel */
            user-select: none;
            backdrop-filter: blur(2px);
        }
        
        #bpm-control.visible {
            opacity: 1;
        }
        
        #bpm-control:hover {
            background: radial-gradient(circle, rgba(0,255,255,0.2) 0%, transparent 70%);
            border-color: rgba(0,255,255,0.6);
        }

        /* Hidden Layer Control Panel */
        #layer-control-panel {
            position: fixed;
            top: 50%;
            left: min(2vw, 20px); /* Position it near left vertical slider */
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            opacity: 0;
            pointer-events: none; /* Initially non-interactive */
            transition: opacity 0.3s ease;
            z-index: 10; /* Below main panel */
            backdrop-filter: blur(5px);
        }

        #layer-control-panel.visible {
            opacity: 1;
            pointer-events: auto; /* Interactive when visible */
        }

        .layer-icon {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.6);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .layer-icon:hover {
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-color: rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.8);
        }

        .layer-icon.active { /* Currently playing */
            background: radial-gradient(circle, rgba(0,255,255,0.2) 0%, transparent 70%);
            border-color: #0ff;
            box-shadow: 0 0 10px #0ff;
            color: #0ff;
        }

        .layer-icon.selected { /* Currently being edited */
            border-color: #fff;
            box-shadow: 0 0 15px #fff;
            transform: scale(1.1);
        }
        
    </style>
</head>
<body>
    <div id="portal-container">
        <!-- The single canvas for both visual decks -->
        <canvas id="canvas" class="morphic-canvas"></canvas>
    </div>

    <div class="loading" id="loading">Initializing Morphic Field...</div>
    
    <div id="master-control-panel" class="hidden">
        <div class="control-group">
            <label>BPM</label>
            <div class="bpm-display-panel" id="bpm-display-panel">120</div> <!-- Specific for the panel BPM display -->
            <div class="bpm-btns">
                <button class="bpm-btn" id="bpm-down-btn">𓃑</button>
                <button class="bpm-btn" id="bpm-up-btn">𓉗</button>
            </div>
        </div>

        <div class="control-group">
            <label>DRONE VOLUME</label>
            <input type="range" id="drone-volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>

        <div class="control-group">
            <label>SEQUENCER VOLUME</label>
            <input type="range" id="seq-volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>
        
        <div class="control-group">
            <label>MASTER OUTPUT VOLUME</label>
            <input type="range" id="master-output-volume-slider" min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="control-group">
            <label>SAMPLE</label>
            <div class="sampler-btns">
                <button class="sampler-btn" id="capture-sample-btn">𓈌</button>
                <button class="sampler-btn" id="play-sample-btn" disabled>𓈋</button>
            </div>
            <div class="info-text sampler-info">
                Capture: Records live field audio (4s). Play: Loops captured sample.
            </div>
        </div>
        
        <div class="control-group">
            <label>SAMPLE VOLUME</label>
            <input type="range" id="sample-volume-slider" min="0" max="1" step="0.01" value="0">
        </div>

        <div class="info-text">
            Left side: Drone (Mouse X/Y sculpts).<br>
            Right side: Sequencer (Click grid to toggle notes).<br><br>
            SHIFT+CLICK / 2-Finger Tap: Toggle UI.
        </div>
    </div>

    <!-- Always visible performance controls -->
    <div id="crossfader-container">
        <div id="crossfader-labels">
            <span>DRONE</span>
            <span>SAMPLE</span> <!-- Label changed to reflect new crossfader role -->
        </div>
        <input type="range" id="crossfader-slider" min="0" max="1" step="0.01" value="0.5">
    </div>

    <div id="fuzz-slider-container" class="vertical-slider-container">
        <input type="range" id="fuzz-slider" class="vertical-slider" min="0" max="1" step="0.01" value="0">
        <span id="fuzz-label" class="vertical-label">GLOBAL FUZZ</span>
    </div>
    <div id="influence-slider-container" class="vertical-slider-container">
        <input type="range" id="influence-slider" class="vertical-slider" min="0" max="1" step="0.01" value="1.0">
        <span id="influence-label" class="vertical-label">INFLUENCE</span>
    </div>

    <!-- Play/Pause for Sequencer (global) -->
    <button id="play-pause-button">►</button> <!-- Starts paused -->

    <!-- Global BPM control (circular) -->
    <div id="bpm-control">
        <div id="bpm-display">120</div>
    </div>

    <!-- Layer control panel -->
    <div id="layer-control-panel"></div>

    <!-- Start button, disappears after first interaction -->
    <button id="start-button">Enter Morphic Field</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Global portal app object
        const portalApp = {};
        window.portalApp = portalApp;

        // Utility: HSV to RGBA converter
        function hsvToRgb(h, s, v, a = 1.0) {
            let r, g, b;
            const i = Math.floor(h * 6);
            const f = h * 6 - i;
            const p = v * (1 - s);
            const q = v * (1 - f * s);
            const t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v, g = t, b = p; break;
                case 1: r = q, g = v, b = p; break;
                case 2: r = p, g = v, b = t; break;
                case 3: r = p, g = q, b = v; break;
                case 4: r = t, g = p, b = v; break;
                case 5: r = v, g = p, b = q; break;
            }
            return `rgba(${Math.round(r * 255)}, ${Math.round(g * 255)}, ${Math.round(b * 255)}, ${a})`;
        }
        portalApp.hsvToRgb = hsvToRgb;

        // Utility: Distortion curve for Fuzz
        function makeDistortionCurve(amount) {
            const k = typeof amount === 'number' ? amount : 50;
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;
            for (let i = 0; i < n_samples; i++) {
                const x = i * 2 / n_samples - 1;
                curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        // --- GLOBAL AUDIO NODES (Declared here, initialized in initApplication) ---
        portalApp.audioContext = null;
        portalApp.masterGain = null;
        portalApp.globalAnalyser = null;
        portalApp.globalFrequencyData = null;
        portalApp.globalAudioLevel = 0;

        portalApp.mainMixBus = null; // NEW: Central mixing point

        portalApp.globalFuzzNode = null;
        portalApp.globalFuzzWetGain = null;
        portalApp.globalFuzzDryGain = null;
        portalApp.globalFuzzAmount = 0.0;

        // Inputs to the crossfader (Drone and Sample)
        portalApp.crossfaderInputDrone = null; // Renamed for clarity
        portalApp.crossfaderInputSample = null; // Renamed for clarity
        // Output of the crossfader
        portalApp.crossfaderOutput = null;

        // Sampler specific audio nodes
        portalApp.samplerMasterGain = null;
        portalApp.samplerBuffer = null;
        portalApp.samplerSource = null;
        portalApp.isSampling = false;
        portalApp.isSamplerPlaying = false;
        portalApp.recorder = null;

        // Manages the Drone (visuals on left half, audio source)

            init(scene, camera, renderer, audioContext, crossfaderInputDrone) {

            createVisuals() {
                // Plane representing the left half of the overall scene (world width 20 units)

                const material = new THREE.ShaderMaterial({
                    vertexShader: this.shaderConfig.vertexShader,
                    fragmentShader: this.shaderConfig.fragmentShader,
                    uniforms: uniforms,
                    transparent: true, blending: THREE.AdditiveBlending
                });

                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.x = offset; 
                this.scene.add(this.mesh);
            }

            createAudio() {
                const baseFreqs = [55, 73.42, 98]; // Fewer voices for drone to conserve resources
                baseFreqs.forEach((freq, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    const filter = this.audioContext.createBiquadFilter();
                    
                    osc.type = ['sine', 'sawtooth', 'triangle'][i % 3];
                    osc.frequency.value = freq;
                    gain.gain.value = 0.1 / baseFreqs.length;
                    
                    filter.type = 'lowpass';
                    filter.frequency.value = 1000 + i * 500;
                    filter.Q.value = 5;
                    
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.outputGain);
                    osc.start();
                    this.droneOscillators.push(osc);
                    this.droneFilters.push(filter);
                });
            }

            updateAudioParameters() {
                if (!this.audioContext || this.droneOscillators.length === 0) return;
                
                const baseFreq = this.droneAudioFrequency;
                const frequencies = [baseFreq, baseFreq * 1.5, baseFreq * 2];
                
                this.droneOscillators.forEach((osc, i) => {
                    osc.frequency.setTargetAtTime(frequencies[i], this.audioContext.currentTime, 0.1);
                });
                
                this.droneFilters.forEach(filter => {
                    filter.frequency.setTargetAtTime(
                        200 + this.visualIntensity * 1500, 
                        this.audioContext.currentTime,
                        0.1
                    );
                    filter.Q.setTargetAtTime(
                        this.droneAudioResonance * 15 + 1,
                        this.audioContext.currentTime,
                        0.1
                    );
                });
            }

                this.audioLevel = globalAudioLevel;
                this.mouse.copy(globalMouse); // Get global mouse from portalApp

                this.mesh.material.uniforms.time.value = this.time;
                this.mesh.material.uniforms.intensity.value = this.visualIntensity;
                this.mesh.material.uniforms.flow.value = this.visualFlow;
                this.mesh.material.uniforms.bloom.value = this.visualBloom;
                this.mesh.material.uniforms.mouse.value.copy(this.mouse);
                this.mesh.material.uniforms.audioLevel.value = this.audioLevel;

        // Manages the Sequencer (visuals on right half, audio voices)
        class SequencerModule {

                this.layerColors = [ // Specific colors for layers (HSV)
                    [0.0, 0.8, 1.0], // Red-Orange (Layer 0)

            init(scene, camera, renderer, audioContext, mainMixBus) { // Simplified init arguments

                this.outputGain = this.audioContext.createGain();
                this.outputGain.gain.value = 0.7; // Base gain, controlled by "SEQUENCER VOLUME" slider

                // Connect sequencer output directly to the main mixing bus

                this.createVisuals();
                this.createAudio();

                this.createSequencerVisualNodes(); // Create 3D meshes for grid

            }

            createVisuals() {
                // Plane representing the right half of the overall scene (world width 20 units)
                // Positioned from x=0 to x=10 in world coordinates
                const geometry = new THREE.PlaneGeometry(10, 20, 128, 128); 
                const offset = 5; // Half of 10-unit width

                uniforms.intensity.value = this.visualIntensity;
                uniforms.flow.value = this.visualFlow;
                uniforms.beatPulse.value = this.beatPulse;

                    vertexShader: this.shaderConfig.vertexShader, // Use config from constructor
                    fragmentShader: this.shaderConfig.fragmentShader, // Use config from constructor

                    transparent: true, blending: THREE.AdditiveBlending

                this.mesh.position.x = offset; 
                this.scene.add(this.mesh);

            createAudio() {
                const baseFreqs = [55, 73.42, 98, 130.81, 174.61, 233.08, 311.13, 415.30];
                this.sequencerVoices = baseFreqs.map((freq, i) => {
                    const voice = {
                        osc: this.audioContext.createOscillator(),
                        gain: this.audioContext.createGain(),
                        filter: this.audioContext.createBiquadFilter()
                    };
                    voice.osc.type = 'triangle';
                    voice.osc.frequency.value = freq;
                    voice.gain.gain.value = 0; // Starts silent
                    voice.filter.type = 'lowpass';
                    voice.filter.frequency.value = 2000;
                    voice.filter.Q.value = 5;

                    voice.osc.connect(voice.filter);
                    voice.filter.connect(voice.gain);
                    voice.gain.connect(this.outputGain); // Connects to SequencerModule's outputGain
                    voice.osc.start();

            initializeLayers() {
                for (let i = 0; i < this.numLayers; i++) {
                    this.layers.push({
                        id: i,
                        nodeStates: Array(8).fill(false), // All notes OFF by default for an empty sequencer
                        colorIndex: i % this.layerColors.length, // Assign a color to each layer
                        isActive: false // Layer is not active for playback by default
                    });

                // REMOVED DEFAULT PATTERN: this.layers[0].nodeStates = [true, false, true, false, true, false, true, false];
                // REMOVED DEFAULT ACTIVE: this.layers[0].isActive = true;

            }

            createSequencerVisualNodes() {
                this.sequencerVisualNodes = [];
                // Dimensions in world units. The sequencer plane is 10x20.
                const gridWidthWorld = 10 * 0.8; // 80% of 10 units wide
                const gridHeightWorld = 20 * 0.8; // 80% of 20 units tall
                
                // Calculate local coordinates for the grid's top-left corner relative to its mesh's center
                // Mesh center is at (0,0) in its local coordinate system.
                // Grid needs to be centered within the 10x20 mesh.
                const startXLocal = - (gridWidthWorld / 2); // Left edge of the grid
                const startYLocal = (gridHeightWorld / 2); // Top edge of the grid (Y is up in Three.js)

                // Individual node dimensions
                const nodeSizeWorld = gridWidthWorld / 8; // Width for each of 8 columns
                const nodeHeightWorld = gridHeightWorld / 4; // Height for each of 4 rows

                for (let y = 0; y < 4; y++) { // Rows (layers)
                    for (let x = 0; x < 8; x++) { // Columns (steps)
                        // Calculate position for the center of each node
                        const posX = startXLocal + (x * nodeSizeWorld) + (nodeSizeWorld / 2);
                        const posY = startYLocal - (y * nodeHeightWorld) - (nodeHeightWorld / 2);
                        
                        const geometry = new THREE.PlaneGeometry(nodeSizeWorld * 0.9, nodeHeightWorld * 0.9); // Slight padding between nodes
                        const material = new THREE.MeshBasicMaterial({ 
                            color: 0xcccccc, 
                            transparent: true, 
                            opacity: 0.5, 
                            depthTest: false, // Ensures nodes draw over the field mesh
                            blending: THREE.AdditiveBlending 
                        });
                        const nodeMesh = new THREE.Mesh(geometry, material);
                        // Position relative to the sequencer mesh's center and slightly forward
                        nodeMesh.position.set(posX, posY, 0.1); 
                        this.mesh.add(nodeMesh); // Add node to sequencer mesh's children
                        this.sequencerVisualNodes.push(nodeMesh);
                    }
                }
                this.updateSequencerVisualNodes(); // Set initial colors/states

            updateSequencerVisualNodes() {
                if (!this.sequencerVisualNodes || this.sequencerVisualNodes.length === 0) return;

                let nodeIndex = 0;
                for (let y = 0; y < 4; y++) {
                    for (let x = 0; x < 8; x++) {
                        const mesh = this.sequencerVisualNodes[nodeIndex];
                        if (!mesh) { nodeIndex++; continue; }

                        const layerState = this.layers[y]; // Get state for this specific layer/row
                        const nodeIsActive = layerState.nodeStates[x];
                        const isPlayingStep = (this.currentStep === x && this.isPlaying);
                        
                        // Use the color of the *current selected layer* for all nodes on display
                        const hsvColor = this.layerColors[this.activeLayerIndex] || this.layerColors[0]; 
                        const baseColor = new THREE.Color().setHSL(hsvColor[0], hsvColor[1], hsvColor[2]);

                        // --- Visuals as per image hints ---
                        if (nodeIsActive) {
                            // Active (ON) state
                            mesh.material.color.copy(baseColor);
                            mesh.material.opacity = 0.9;
                            // Active cells are vibrant
                        } else {
                            // Inactive (OFF) state - very dim and subtle
                            mesh.material.color.setHex(0x1a1a1a); /* Very dark grey for inactive cells */
                            mesh.material.opacity = 0.15; /* Very low opacity for inactive */
                        }

                        if (isPlayingStep) {
                            // Playing step (column highlight)
                            mesh.material.color.setHex(0xFFFFFF); /* White glow */
                            mesh.material.opacity = 1.0;
                            // Stronger scale pulse when playing
                            mesh.scale.set(1.15 * (1 + this.beatPulse * 0.1), 1.15 * (1 + this.beatPulse * 0.1), 1.15); 
                        } else {
                            // Reset scale when not playing this step
                            mesh.scale.set(1.0, 1.0, 1.0); 
                        }
                        nodeIndex++;
                    }
                }
            }

            startSequencerScheduler() {
                if (this.schedulerInterval) clearInterval(this.schedulerInterval);
                this.nextStepTime = this.audioContext.currentTime;
                this.schedulerInterval = setInterval(() => this.scheduler(), this.lookahead * 1000 * 0.5);
                console.log('Sequencer started/restarted with BPM:', this.bpm);
            }

            scheduler() {
                if (!this.isPlaying || !this.audioContext || this.audioContext.state !== 'running') {
                    // Update visual current step even if paused, but don't schedule audio
                    // The play/pause button handler will toggle `isPlaying`
                    if (this.audioContext && this.audioContext.state === 'running' && this.schedulerInterval) { 
                         this.currentStep = (this.currentStep + 1) % 8;
                         this.updateSequencerVisualNodes(); // Still update playing indicator
                    }
                    return;
                }

                while (this.nextStepTime < this.audioContext.currentTime + this.lookahead) {
                    this.scheduleStep(this.currentStep, this.nextStepTime);
                    this.nextStepTime += this.secondsPerStep;
                    this.currentStep = (this.currentStep + 1) % 8;
                }
            }

            scheduleStep(step, time) {
                this.beatPulse = 1.0; // Trigger visual pulse

                // Update current step for visual nodes
                this.updateSequencerVisualNodes();

                // Play notes only from layers that are both 'active' and have the current 'step' enabled
                this.layers.forEach(layer => {
                    if (layer.isActive && layer.nodeStates[step]) {
                        const voice = this.sequencerVoices[step];
                        if (voice) {
                            voice.gain.gain.cancelScheduledValues(time);
                            voice.gain.gain.setValueAtTime(0, time);
                            voice.gain.gain.linearRampToValueAtTime(0.5 * this.influence, time + 0.01);
                            voice.gain.gain.exponentialRampToValueAtTime(0.001, time + this.secondsPerStep * 0.8);

                            // Apply some modulation based on layer parameters or mouse interaction
                            voice.filter.frequency.setTargetAtTime(1000 + layer.id * 500, time, 0.05);
                            voice.filter.Q.setTargetAtTime(3 + layer.id, time, 0.05);
                        }
                    }
                });
            }

            // Handles clicks on the sequencer canvas area (right half)
            handleCanvasClick(e) {
                // Get mouse coordinates relative to the canvas
                const rect = this.renderer.domElement.getBoundingClientRect();
                this.mouseVector.x = ((e.clientX - rect.left) / rect.width) * 2 - 1; // Normalize to -1 to +1
                this.mouseVector.y = - ((e.clientY - rect.top) / rect.height) * 2 + 1; // Invert Y and normalize

                // Set the raycaster from the camera and mouse position
                this.raycaster.setFromCamera(this.mouseVector, this.camera);

                // Intersect the ray with the sequencer's 3D grid nodes
                const intersects = this.raycaster.intersectObjects(this.sequencerVisualNodes);

                if (intersects.length > 0) {
                    // Get the first intersected object (closest to camera)
                    const intersectedMesh = intersects[0].object;
                    
                    // Find which node corresponds to this mesh
                    const nodeIndex = this.sequencerVisualNodes.indexOf(intersectedMesh);

                    if (nodeIndex !== -1) {
                        // Calculate layer (row) and step (column) from the linear nodeIndex
                        const layer = Math.floor(nodeIndex / 8); // 0-3
                        const step = nodeIndex % 8; // 0-7

                        const currentLayerState = this.layers[layer];
                        currentLayerState.nodeStates[step] = !currentLayerState.nodeStates[step];
                        
                        this.activeLayerIndex = layer; // Automatically select the layer being edited
                        portalApp.updateLayerControlUI(); // Update layer icons to show selection
                        this.updateSequencerVisualNodes(); // Update 3D nodes to reflect state change
                        portalApp.updateStateInURL();
                    }
                }
            }


            update(globalTime, globalAudioLevel, globalMouse) {
                this.time = globalTime;
                this.audioLevel = globalAudioLevel;
                // Global mouse is also passed to sequencer shader for its own cursor glow
