<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Deep Resonance Sculptor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gl-canvas"></canvas>
    <div id="controls">
        <!-- Layers will be added here dynamically -->
    </div>
    <button id="add-layer-btn">Add Layer</button>

    <!-- Shaders -->
    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        precision highp float;
        uniform float u_time;
        uniform sampler2D u_layer_texture;
        uniform float u_depth;
        uniform float u_fft;
        varying vec2 vUv;

        vec3 hsv2rgb(vec3 c) {
            vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
            vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
            return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        void main() {
            vec2 p = vUv * 2.0 - 1.0;
            float t = u_time * 0.1;

            float recursion_depth = 2.0 + u_depth * 8.0;
            float amplitude = 0.5 + u_depth * 1.5 + u_fft * 2.0;

            for(float i = 1.0; i < 9.0; i++) {
                if (i > recursion_depth) break;
                p.x += 0.5 / i * sin(i * 2.0 * p.y + t + cos(t * 0.5));
                p.y += 0.5 / i * cos(i * 3.0 * p.x + t + sin(t * 0.4));
            }

            float color_val = length(p);
            float hue = 0.6 + u_depth * 0.3 + t * 0.1;
            vec3 color = hsv2rgb(vec3(hue, 0.8, 0.9));

            float final_val = pow(sin(color_val * 3.0) * 0.5 + 0.5, 2.0);
            float bloom = smoothstep(0.8, 1.0, final_val) * (0.5 + u_depth * 1.5);

            vec4 base_color = vec4(color * final_val + bloom, 1.0);
            vec4 prev_layer = texture2D(u_layer_texture, vUv);

            gl_FragColor = mix(prev_layer, base_color, base_color.a); // Additive blending
        }
    </script>

    <script src="renderer.js"></script>
</body>
</html>
