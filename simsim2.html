<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resonant Philosophy Engine – All Phases (Single File)</title>
<style>
  body{margin:0;overflow:hidden;font-family:"Segoe UI",sans-serif;background:#000;color:#fff}
  #info{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);padding:15px;border-radius:8px;max-width:300px;box-shadow:0 0 15px #0ff;z-index:100}
  #controls{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  button{background:#0ff;color:#000;border:none;padding:6px 10px;border-radius:4px;font-weight:bold;cursor:pointer}
  button:hover{background:#f0f}
  canvas{display:block}
</style>
</head>
<body>

<div id="info">
  <h3>Resonant Philosophy Engine</h3>
  <p id="insight">Drag the bright sphere to explore.</p>
  <div id="controls">
    <label>Player Influence
      <input type="range" id="influence" min="0.1" max="1.5" step="0.05" value="0.75">
    </label>
    <button id="resetBtn">Reset</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
<script>
/* =========================================================
   0.  CONSTANTS & UTILS
========================================================= */
const TICKS_PER_SEC   = 60;
const INSIGHT_COOLDOWN = TICKS_PER_SEC * 5;
const MAX_AGENTS      = 12;
const WORLD_RADIUS    = 35;
const INTERACTION_R   = 10;

/* =========================================================
   1.  PHILOSOPHICAL DATA (LEGOS-lite)
========================================================= */
const PHILOSOPHERS = [
  {id:'rosa',      name:'Rosa Resonance Engine',   traits:['transformative','uncontrollable','affective','dialogical']},
  {id:'taylor',    name:'Taylor Recognition Sys',  traits:['dialogical','authentic','cultural','meaning-seeking']},
  {id:'wikan',     name:'Wikan Empathic Resonator',traits:['embodied','empathetic','experiential','cross-cultural']},
  {id:'coupling',  name:'Structural Coupler',      traits:['autopoietic','adaptive','boundary']},
  {id:'dialogical',name:'Dialogical Self',         traits:['identity-forming','relational','narrative']},
  {id:'authentic', name:'Authenticity Seeker',     traits:['self-determining','resistant']},
  {id:'alienation',name:'Alienation Force',        traits:['disconnecting','instrumentalizing','control-seeking']},
  {id:'mediator',  name:'Recognition Mediator',    traits:['validating','identity-shaping','social']},
  {id:'player',    name:'Player-Philosopher',      traits:['curious','experimental','reflective']}
];

/* =========================================================
   2.  AGENT STATE MACHINE
========================================================= */
class Agent {
  constructor(id, name, traits){
    this.id=id; this.name=name; this.traits=traits;
    this.reset();
    // Three.js mesh
    const geo = new THREE.SphereGeometry(1.5,16,16);
    const col = id==='player' ? 0xffffff : 0x0088ff;
    const mat = new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:.1});
    this.mesh = new THREE.Mesh(geo,mat);
    scene.add(this.mesh);
  }
  reset(){
    this.r        = .3+Math.random()*.4;       // resonance
    this.rec      = .3+Math.random()*.4;       // recognition
    this.ident    = .5;                        // identity strength
    this.authentic= .5;
    this.alienRes = .5;
    this.cultAff  = Math.random();
    this.controlPenalty = 0; // Rosa’s control paradox
  }
  update(dt, global){
    // Rosa uncontrollability
    if(this.id==='rosa'){
      const d = this.mesh.position.distanceTo(player.mesh.position);
      const ctrl = global.playerInfluence * Math.max(0,1-d/WORLD_RADIUS);
      this.controlPenalty = Math.min(1, this.controlPenalty + ctrl*dt*0.1);
      this.r = Math.max(.01, this.r - this.controlPenalty*dt*0.05);
    }
    // Alienation Force
    if(this.id==='alienation'){
      global.alienation = Math.min(1, global.alienation + dt*0.05);
      this.r = Math.max(.01, this.r - dt*0.02);
    }
    // All agents mild drift
    this.r  = THREE.MathUtils.clamp(this.r  + (Math.random()-.5)*dt*.01, .01,1);
    this.rec= THREE.MathUtils.clamp(this.rec+ (Math.random()-.5)*dt*.01, .01,1);

    // Visual feedback
    this.mesh.material.emissiveIntensity = this.r*.5;
    this.mesh.material.color.setScalar(this.r);
  }
}

/* =========================================================
   3.  SIMULATION WORLD
========================================================= */
let scene, camera, renderer, player;
let agents = new Map();
let lines = new THREE.Group();
let global = {tick:0, resonance:0.5, alienation:0.1, playerInfluence:0.75, insightCooldown:0};

function initWorld(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, .1, 1000);
  camera.position.z = 50;
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x404040,2));
  scene.add(new THREE.DirectionalLight(0xffffff,1).position.set(1,1,1).normalize());
  scene.add(lines);

  // create agents
  PHILOSOPHERS.forEach((p,i)=>{
    const phi = Math.acos(-1 + 2*i/MAX_AGENTS);
    const theta = Math.sqrt(MAX_AGENTS*Math.PI)*phi;
    const pos = new THREE.Vector3(
      WORLD_RADIUS*Math.cos(theta)*Math.sin(phi),
      WORLD_RADIUS*Math.sin(theta)*Math.sin(phi),
      WORLD_RADIUS*Math.cos(phi)
    );
    const a = new Agent(p.id,p.name,p.traits);
    a.mesh.position.copy(pos);
    agents.set(p.id,a);
    if(p.id==='player') player=a;
  });

  // event listeners
  renderer.domElement.addEventListener('pointerdown',onPointerDown);
  renderer.domElement.addEventListener('pointermove',onPointerMove);
  renderer.domElement.addEventListener('pointerup',onPointerUp);
  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
  });
  document.getElementById('influence').addEventListener('input',e=>global.playerInfluence=parseFloat(e.target.value));
  document.getElementById('resetBtn').addEventListener('click',resetWorld);
}

/* =========================================================
   4.  INTERACTIONS & EMERGENCE
========================================================= */
function processInteractions(){
  lines.clear();
  let totalR=0, totalRec=0, count=0;
  let highR=0, highAlien=global.alienation;
  let crossCult=0;

  agents.forEach((a,ai)=>{
    agents.forEach((b,bi)=>{
      if(ai>=bi) return;
      const d = a.mesh.position.distanceTo(b.mesh.position);
      if(d>INTERACTION_R) return;

      // Mutual transformation
      const compat = (a.r+b.r+a.rec+b.rec)/4;
      const gain = (1-d/INTERACTION_R)*0.02;
      a.r   = THREE.MathUtils.clamp(a.r   + gain*compat, .01,1);
      b.r   = THREE.MathUtils.clamp(b.r   + gain*compat, .01,1);
      a.rec = THREE.MathUtils.clamp(a.rec + gain*compat, .01,1);
      b.rec = THREE.MathUtils.clamp(b.rec + gain*compat, .01,1);

      // Recognition Spiral
      if(a.traits.includes('dialogical') && b.traits.includes('dialogical')){
        a.ident = THREE.MathUtils.clamp(a.ident + (compat>0.6?0.002:-0.001),0,1);
        b.ident = THREE.MathUtils.clamp(b.ident + (compat>0.6?0.002:-0.001),0,1);
      }
      // Cross-cultural empathy
      if(Math.abs(a.cultAff-b.cultAff)>0.5 && compat>0.7) crossCult++;

      // line visual
      const mat = new THREE.LineBasicMaterial({color:0x00ff00,transparent:true,opacity:compat});
      const geo = new THREE.BufferGeometry().setFromPoints([a.mesh.position,b.mesh.position]);
      lines.add(new THREE.Line(geo,mat));

      totalR += a.r; totalRec += a.rec; count++;
    });
  });
  global.resonance = count?totalR/count:0.5;
  global.crossCultural = crossCult;

  // emergent insight
  if(global.insightCooldown<=0){
    let msg="";
    if(global.resonance>0.7 && global.alienation<0.2)
      msg="Authentic resonance spreads; new meanings crystallize.";
    else if(global.alienation>0.5)
      msg="Alienation lingers—recognition falters.";
    else if(crossCult>3)
      msg="Empathic bridges span cultural divides.";
    else if(Math.random()<.05)
      msg=["Philosophy is lived, not merely spoken","Control erodes authentic connection","To be seen is to become"][Math.floor(Math.random()*3)];
    if(msg){
      document.getElementById('insight').innerText=msg;
      global.insightCooldown=INSIGHT_COOLDOWN;
    }
  }
}

/* =========================================================
   5.  PLAYER DRAG
========================================================= */
let dragging=false, offset=new THREE.Vector3();
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function onPointerDown(e){
  pointer.x=(e.clientX/innerWidth)*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hit=raycaster.intersectObject(player.mesh);
  if(hit.length){dragging=true; offset.copy(player.mesh.position).sub(hit[0].point);}
}
function onPointerMove(e){
  if(!dragging) return;
  pointer.x=(e.clientX/innerWidth)*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
  const pt=new THREE.Vector3();
  raycaster.ray.intersectPlane(plane,pt);
  player.mesh.position.copy(pt.add(offset));
  if(player.mesh.position.length()>WORLD_RADIUS) player.mesh.position.setLength(WORLD_RADIUS);
}
function onPointerUp(){dragging=false;}

/* =========================================================
   6.  MAIN LOOP & RESET
========================================================= */
function resetWorld(){
  global={tick:0,resonance:0.5,alienation:0.1,playerInfluence:parseFloat(document.getElementById('influence').value),insightCooldown:0};
  agents.forEach(a=>a.reset());
  document.getElementById('insight').innerText="Simulation reset.";
}
function animate(){
  requestAnimationFrame(animate);
  global.tick++;
  global.insightCooldown=Math.max(0,global.insightCooldown-1);
  agents.forEach(a=>a.update(1/60,global));
  processInteractions();
  renderer.render(scene,camera);
}

/* =========================================================
   7.  BOOTSTRAP
========================================================= */
initWorld();
animate();
</script>
</body>
</html>
