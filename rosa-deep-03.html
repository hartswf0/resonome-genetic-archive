<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Rosa’s Resonance Engine – Integrated Simulation</title>
<style>
    :root{
        --bg:#111;
        --text:#eee;
        --accent:#0f6;
        --alert:#f33;
        --mediator:#5af;
    }
    body{
        margin:0;
        font-family:Segoe UI,Helvetica,Arial,sans-serif;
        background:var(--bg);
        color:var(--text);
        overflow:hidden;
    }
    #canvas{
        position:absolute;
        top:0;left:0;
        width:100vw;height:100vh;
    }
    #ui{
        position:absolute;
        top:10px;right:10px;
        width:280px;
        background:rgba(0,0,0,.65);
        padding:10px;
        border-radius:6px;
        font-size:14px;
        max-height:90vh;
        overflow-y:auto;
    }
    #ui h3{margin:0 0 6px 0;font-weight:400;color:var(--accent)}
    #ui button{
        margin:2px 0;
        width:100%;
        background:#222;
        border:1px solid #444;
        color:var(--text);
        padding:4px 6px;
        border-radius:3px;
        cursor:pointer;
    }
    #ui button:hover{background:#333}
    #journal{
        max-height:200px;
        overflow-y:auto;
        font-size:12px;
        line-height:1.3;
        white-space:pre-wrap;
    }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
    <h3>Controls</h3>
    <button id="addAgent">Add Random Agent</button>
    <button id="addMediator">Add Mediator</button>
    <button id="addAlien">Add Alienation Source</button>
    <button id="step">Step (Paused)</button>
    <label><input type="checkbox" id="pause">Pause</label>

    <h3>Journal</h3>
    <div id="journal"></div>
</div>

<script>
/* ===============================
   CONFIGURATION CONSTANTS
============================== */
const TICK = 16;                // ms per frame
const FIELD_DECAY = 0.98;
const PROXIMITY_D0 = 120;       // pixels
const RESONANCE_THRESHOLD = 0.6;
const MEDIATOR_PROX = 100;
const MAX_AGENTS = 25;

/* ===============================
   UTILITIES
============================== */
const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));
const rand = (a,b)=>Math.random()*(b-a)+a;

/* ===============================
   ENTITY CLASS
============================== */
class Entity {
    constructor(type='agent'){
        this.id = Math.random().toString(36).slice(2,7);
        this.type = type;           // agent | mediator | alienation | structural_coupling
        this.x = rand(50, innerWidth-50);
        this.y = rand(50, innerHeight-50);
        this.vx = rand(-0.5,0.5);
        this.vy = rand(-0.5,0.5);
        this.radius = 12;

        // affective & efficacy
        this.resonance   = rand(-0.3,0.3);   // A
        this.efficacy    = rand(0.3,0.7);    // E
        this.identity    = rand(0.4,0.9);
        this.authenticity = rand(0.5,0.9);
        this.alienation_resistance = rand(0.4,0.8);

        // memory
        this.memory = {};          // {otherId: {lastVal:0, count:0}}
        this.forced_flag = 0;      // frames remaining

        // traits
        this.traits = new Set(['openness', 'curiosity']);
    }

    step(agents){
        // wander
        this.vx += rand(-0.05,0.05);
        this.vy += rand(-0.05,0.05);
        this.vx *= 0.95; this.vy *= 0.95;
        this.x += this.vx; this.y += this.vy;
        this.x = clamp(this.x,0,innerWidth);
        this.y = clamp(this.y,0,innerHeight);

        // structural coupling dampener
        if (this.type === 'structural_coupling') return;

        // interactions
        let nearby = agents.filter(a=>a!==this && dist(this,a)<PROXIMITY_D0);
        let mediator = agents.find(a=>a.type==='mediator' && dist(this,a)<MEDIATOR_PROX);

        // mediator pulse
        if (mediator && this.type==='agent'){
            this.resonance = clamp(this.resonance+0.02,-1,1);
            this.efficacy   = clamp(this.efficacy+0.01,0,1);
        }

        // mutual resonance
        let partners = nearby.filter(a=>a.resonance>RESONANCE_THRESHOLD && this.resonance>RESONANCE_THRESHOLD);
        partners.forEach(p=>{
            let bump = rand(0.05,0.1);
            this.resonance = clamp(this.resonance+bump,-1,1);
            p.resonance    = clamp(p.resonance+bump,-1,1);
            this.record(p,'resonance',bump);
            p.record(this,'resonance',bump);
        });

        // alienation forces
        let aliens = nearby.filter(a=>a.type==='alienation');
        aliens.forEach(a=>{
            let d = dist(this,a);
            let force = -0.01*(1-d/PROXIMITY_D0);
            this.resonance = clamp(this.resonance+force,-1,1);
            this.efficacy   = clamp(this.efficacy-0.005,0,1);
            this.record(a,'alienation',force);
            if (this.forced_flag<=0) this.forced_flag = 60; // mark forced
        });

        // forced resonance decay
        if (this.forced_flag>0){
            this.resonance *= 0.95;
            this.forced_flag--;
        }

        // identity growth/decay
        let deltaId = 0;
        if (partners.length>0) deltaId += 0.01;
        if (aliens.length>0) deltaId -= 0.01;
        this.identity = clamp(this.identity+deltaId,0,1);

        // trait evolution
        if (Math.random()<0.001 && partners.length>2){
            this.traits.add('courage');
        }
    }

    record(other,event,val){
        if (!this.memory[other.id]) this.memory[other.id]={lastVal:0,count:0};
        let m = this.memory[other.id];
        m.lastVal = val;
        m.count++;
    }
}

/* ===============================
   SIMULATION
============================== */
class Simulation {
    constructor(){
        this.agents = [];
        this.paused = false;
        this.running = true;

        // structural coupling agent (invisible)
        let sc = new Entity('structural_coupling');
        sc.radius = 0;
        this.agents.push(sc);

        // start with a few
        for(let i=0;i<5;i++) this.agents.push(new Entity('agent'));
    }

    add(type){
        if (this.agents.filter(a=>a.type==='agent').length>=MAX_AGENTS && type==='agent') return;
        this.agents.push(new Entity(type));
    }

    step(){
        if (this.paused) return;
        this.agents.forEach(a=>a.step(this.agents));
        this.checkInsights();
    }

    checkInsights(){
        // crude novelty: if resonance avg crosses 0.7
        let avg = this.agents.filter(a=>a.type==='agent').reduce((s,a)=>s+a.resonance,0);
        avg /= this.agents.filter(a=>a.type==='agent').length || 1;
        if (avg>0.7 && !this.lastAvgHigh){
            this.log("Insight: Resonance Cascade detected across the Commons.");
            this.lastAvgHigh = true;
        }else if (avg<0.7){
            this.lastAvgHigh = false;
        }
    }

    log(msg){
        const j = document.getElementById('journal');
        j.textContent += `[${Date.now()%10000}] ${msg}\n`;
        j.scrollTop = j.scrollHeight;
    }
}

/* ===============================
   RENDERING
============================== */
class Renderer {
    constructor(sim){
        this.sim = sim;
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize',()=>this.resize());
    }
    resize(){
        this.canvas.width = innerWidth;
        this.canvas.height = innerHeight;
    }
    draw(){
        const ctx=this.ctx;
        ctx.clearRect(0,0,innerWidth,innerHeight);

        // draw resonance field (simple radial glow)
        ctx.globalCompositeOperation='screen';
        this.sim.agents.forEach(a=>{
            if (a.type==='structural_coupling') return;
            const g = ctx.createRadialGradient(a.x,a.y,0,a.x,a.y,a.radius*4);
            let hue = a.resonance>0 ? 120 : 0;
            let alpha = Math.abs(a.resonance)*0.4;
            g.addColorStop(0,`hsla(${hue},100%,60%,${alpha})`);
            g.addColorStop(1,`hsla(${hue},100%,60%,0)`);
            ctx.fillStyle=g;
            ctx.beginPath();ctx.arc(a.x,a.y,a.radius*4,0,Math.PI*2);ctx.fill();
        });
        ctx.globalCompositeOperation='source-over';

        // draw agents
        this.sim.agents.forEach(a=>{
            if (a.type==='structural_coupling') return;
            ctx.beginPath();
            ctx.arc(a.x,a.y,a.radius,0,Math.PI*2);
            let hue = a.resonance>0 ? 120 : 0;
            ctx.fillStyle=`hsl(${hue},100%,${50+a.resonance*20}%)`;
            ctx.fill();
            ctx.strokeStyle='#fff';
            ctx.lineWidth=1;
            if (a.forced_flag>0) ctx.strokeStyle='red';
            ctx.stroke();

            // small trait label
            ctx.fillStyle='#fff';
            ctx.font='10px monospace';
            ctx.fillText([...a.traits].slice(-1),a.x+15,a.y+3);
        });

        // draw links
        ctx.strokeStyle='rgba(255,255,255,0.1)';
        ctx.lineWidth=0.5;
        this.sim.agents.forEach(a=>{
            this.sim.agents.forEach(b=>{
                if (a===b || a.type==='structural_coupling' || b.type==='structural_coupling') return;
                let d = dist(a,b);
                if (d<PROXIMITY_D0 && a.resonance>0 && b.resonance>0){
                    ctx.globalAlpha = (a.resonance+b.resonance)/2;
                    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
                }
            });
        });
        ctx.globalAlpha=1;
    }
}

/* ===============================
   BOOTSTRAP
============================== */
const sim = new Simulation();
const renderer = new Renderer(sim);

function loop(){
    sim.step();
    renderer.draw();
    if (sim.running) requestAnimationFrame(loop);
}
loop();

/* UI */
document.getElementById('addAgent').onclick = ()=>sim.add('agent');
document.getElementById('addMediator').onclick = ()=>sim.add('mediator');
document.getElementById('addAlien').onclick = ()=>sim.add('alienation');
document.getElementById('pause').onchange = e=>sim.paused=e.target.checked;
document.getElementById('step').onclick = ()=>{sim.paused=true; sim.step(); renderer.draw();};
</script>
</body>
</html>
