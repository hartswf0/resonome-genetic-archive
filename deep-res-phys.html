<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dream-Resonance Physics Engine</title>
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#111119;
    --cyan:#00ffff;
    --pink:#ff00ff;
    --gold:#ffd700;
    --text:#e0e0e0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--text);overflow:hidden}
  #app{display:grid;grid-template-columns:1fr 300px;grid-template-rows:60px 1fr;height:100vh}
  header{grid-column:1/-1;display:flex;align-items:center;padding:0 1rem;background:var(--panel)}
  header h1{font-size:1.1rem;margin:0;flex:1}
  header button{margin-left:.5rem;padding:.4rem .7rem;border:none;border-radius:4px;background:var(--cyan);color:#000;font-weight:600;cursor:pointer;transition:.2s}
  header button:hover{background:var(--pink)}
  #scene{position:relative}
  #canvas{width:100%;height:100%;display:block}
  #sidebar{background:var(--panel);padding:1rem;font-size:.85rem;overflow-y:auto}
  .control{margin-bottom:1rem}
  .control label{display:block;margin-bottom:.2rem;color:#888}
  .control input{width:100%}
  #log{background:#000;height:100px;padding:.5rem;border-radius:4px;font-family:monospace;font-size:.7rem;overflow-y:auto;margin-top:1rem}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Dream-Resonance Physics Engine</h1>
    <button id="playBtn">Play</button>
    <button id="pauseBtn">Pause</button>
    <button id="saveBtn">Save Stone</button>
  </header>

  <div id="scene"><canvas id="canvas"></canvas></div>

  <div id="sidebar">
    <div class="control">
      <label>Natural Frequency ω₀ (rad/s) <span id="w0val">6.28</span></label>
      <input type="range" id="w0" min="1" max="20" value="6.28" step=".1">
    </div>
    <div class="control">
      <label>Damping Ratio ζ <span id="zval">0.05</span></label>
      <input type="range" id="z" min="0.01" max="1" value="0.05" step=".01">
    </div>
    <div class="control">
      <label>Drive Frequency ω (rad/s) <span id="wval">7.5</span></label>
      <input type="range" id="w" min="1" max="20" value="7.5" step=".1">
    </div>
    <div class="control">
      <label>Drive Amplitude F₀ <span id="fval">1</span></label>
      <input type="range" id="f" min="0.1" max="5" value="1" step=".1">
    </div>
    <div id="log">System ready…</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {

/* ---------- DOM elements ---------- */
const w0 = document.getElementById('w0'), z = document.getElementById('z'), w = document.getElementById('w'), f = document.getElementById('f');
const w0val = document.getElementById('w0val'), zval = document.getElementById('zval'), wval = document.getElementById('wval'), fval = document.getElementById('fval');
const playBtn = document.getElementById('playBtn'), pauseBtn = document.getElementById('pauseBtn'), saveBtn = document.getElementById('saveBtn');
const canvas = document.getElementById('canvas');

/* ---------- physics ---------- */
let state={
  m:1, k:40, c:0.5, F0:1, w:7.5,
  x:0, v:0, t:0, playing:false
};
function updateParams(){
  state.k = (+w0.value)**2;
  state.c = 2*state.m*w0.value*z.value;
  state.w = +w.value;
  state.F0 = +f.value;
  w0val.textContent=w0.value;
  zval.textContent=z.value;
  wval.textContent=w.value;
  fval.textContent=f.value;
}
[w0,z,w,f].forEach(el => { el.addEventListener('input',updateParams); });

/* ---------- three ---------- */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,0,5);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:true});
renderer.setSize(window.innerWidth-300,window.innerHeight-60);

const light=new THREE.DirectionalLight(0xffffff,.8);
light.position.set(1,1,2);
scene.add(light,new THREE.AmbientLight(0x404040));

/* oscillator */
const massGeo=new THREE.SphereGeometry(.15,32,32);
const massMat=new THREE.MeshPhongMaterial({color:0x00ffff});
const mass=new THREE.Mesh(massGeo,massMat);
scene.add(mass);

/* spring */
const springGeo=new THREE.CylinderGeometry(.02,.02,1,8,1,true);
const springMat=new THREE.MeshPhongMaterial({color:0x666666});
const spring=new THREE.Mesh(springGeo,springMat);
spring.position.y=-.5;
scene.add(spring);

/* wall */
const wallGeo=new THREE.BoxGeometry(.1,2,.1);
const wallMat=new THREE.MeshPhongMaterial({color:0x333333});
const wall=new THREE.Mesh(wallGeo,wallMat);
wall.position.set(-2.5,0,0);
scene.add(wall);

/* ---------- RK4 integrator ---------- */
function rk4(dt){
  const {m,k,c,F0,w}=state;
  const f=(t,x,v)=>(F0*Math.cos(w*t)-c*v-k*x)/m;
  let k1x,k1v,k2x,k2v,k3x,k3v,k4x,k4v;
  k1x = state.v;
  k1v = f(state.t,state.x,state.v);
  k2x = state.v + .5*dt*k1v;
  k2v = f(state.t + .5*dt, state.x + .5*dt*k1x, state.v + .5*dt*k1v);
  k3x = state.v + .5*dt*k2v;
  k3v = f(state.t + .5*dt, state.x + .5*dt*k2x, state.v + .5*dt*k2v);
  k4x = state.v + dt*k3v;
  k4v = f(state.t + dt, state.x + dt*k3x, state.v + dt*k3v);

  state.x += dt*(k1x + 2*k2x + 2*k3x + k4x)/6;
  state.v += dt*(k1v + 2*k2v + 2*k3v + k4v)/6;
  state.t += dt;
}

/* ---------- animation ---------- */
function animate(){
  if(!state.playing) return;
  rk4(0.016);
  /* visual update */
  mass.position.x = state.x;
  const L = 2.5 + state.x;
  spring.scale.y = L;
  spring.position.x = -2.5 + L/2;

  /* log resonance moment */
  const amp = Math.abs(state.x);
  if(amp>2.5 && !mass.userData.peak){
    log(`Resonance moment! Amplitude=${amp.toFixed(2)}`);
    mass.userData.peak=true;
  }else if(amp<1){
    mass.userData.peak=false;
  }

  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}

function log(msg){
  const div=document.createElement('div');
  div.textContent=msg;
  document.getElementById('log').appendChild(div);
}

/* ---------- controls ---------- */
document.getElementById('playBtn').onclick=()=>{state.playing=true;animate();};
document.getElementById('pauseBtn').onclick=()=>state.playing=false;
document.getElementById('saveBtn').onclick=()=>{
  const stone={...state};
  log('Vibe stone saved: '+JSON.stringify(stone));
};

updateParams();
renderer.render(scene,camera);

});
</script>
</body>
</html>
