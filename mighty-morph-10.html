<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Morphic Resonance Deck</title>
    <style>
        /* General Reset and Body Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Prevent text selection by default */
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        }
        
        body {
            background: #000;
            overflow: hidden; /* Prevent body scroll */
            cursor: none; /* Hide default cursor to emphasize custom interaction */
            touch-action: none; /* Prevent browser gestures like pull-to-refresh, zoom */
            font-family: 'Courier New', monospace; /* Classic monospace font */
            color: #E0FFFF; /* Light cyan text color */
        }

        /* Main Canvas (single canvas for both decks) */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: opacity 0.5s ease; /* For fading when UI is shown */
        }
        
        /* Loading Indicator */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(224, 255, 255, 0.5); /* Semi-transparent cyan */
            font-size: 1.2em;
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Unified Master Control Panel */
        #master-control-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Spacing between control groups */
            z-index: 50;
            opacity: 1; /* Initially visible */
            transition: opacity 0.4s ease, transform 0.4s ease; /* Smooth show/hide and scale */
            backdrop-filter: blur(5px);
            background: rgba(0, 0, 0, 0.4);
            padding: min(5vw, 25px); /* Responsive padding: 5vw or max 25px */
            border-radius: 15px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            pointer-events: auto; /* Active when visible */
            
            /* Mobile Responsiveness for Panel */
            max-width: 95vw; /* Limit width on small screens */
            max-height: 95vh; /* Limit height on small screens */
            overflow-y: auto; /* Allow scrolling if content overflows vertically */
            -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */

            /* Morphic Glow */
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.2);
            animation: panel-glow 3s infinite alternate ease-in-out;
        }

        #master-control-panel.hidden {
            opacity: 0;
            pointer-events: none; /* Make non-interactive when hidden */
            transform: translate(-50%, -50%) scale(0.95); /* Slight scale down on hide */
        }

        @keyframes panel-glow {
            from { box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.2); }
            to { box-shadow: 0 0 25px rgba(0, 255, 255, 0.8), inset 0 0 15px rgba(0, 255, 255, 0.4); }
        }
        
        /* Control Group Layout */
        .control-group {
            display: flex;
            flex-direction: column; /* Stack label and control */
            align-items: center;
            gap: 8px;
            width: 100%; /* Take full width of panel */
        }

        .control-group label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(224, 255, 255, 0.8);
        }

        /* BPM Display and Buttons - Make them cell-like */
        .bpm-display-panel { /* Specific for the panel BPM display */
            font-size: 2.2em; /* Large BPM number */
            font-weight: bold;
            color: #00FFFF;
            padding: 10px 15px; /* More padding */
            min-width: 80px; /* Ensure consistent width */
            text-align: center;
            background: rgba(224, 255, 255, 0.1); /* Cell background */
            border: 2px solid rgba(0, 255, 255, 0.3); /* Themed border */
            border-radius: 8px; /* Consistent border radius */
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6); /* Inner shadow for depth */
        }
        
        .bpm-btns {
            display: flex;
            gap: 12px; /* Spacing between BPM buttons */
        }

        .bpm-btn {
            width: clamp(45px, 12vw, 55px); /* Responsive sizing, matches step cells */
            height: clamp(45px, 12vw, 55px); /* Responsive sizing, matches step cells */
            background: rgba(224, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.3); /* Themed border */
            color: #E0FFFF;
            font-size: 2.5em; /* Larger symbols */
            line-height: 1; /* Center symbol */
            cursor: pointer;
            border-radius: 8px; /* Consistent with cells */
            transition: background 0.1s ease, border-color 0.1s ease, box-shadow 0.1s ease;
            display: flex; /* For centering unicode symbols */
            align-items: center;
            justify-content: center;
        }
        .bpm-btn:hover {
            background: rgba(224, 255, 255, 0.2);
            border-color: #E0FFFF;
        }
        .bpm-btn:active {
            background: #E0FFFF;
            color: #000;
            box-shadow: 0 0 10px #E0FFFF;
            transform: scale(0.98); /* Slight press effect */
        }

        /* Slider Styles (Chunkier, Dot Grid Matrix-like) */
        input[type="range"] {
            -webkit-appearance: none;
            width: 200px; /* Wider slider */
            max-width: 100%; /* Ensure it fits within parent on smaller screens */
            height: 24px; /* Much thicker slider track */
            background: rgba(0, 255, 255, 0.15); /* Themed background */
            border-radius: 8px; /* Consistent with cells */
            outline: none;
            cursor: grab;
            margin: 0;
            padding: 0;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6); /* Inner shadow for depth */
            border: 2px solid rgba(0, 255, 255, 0.3); /* Themed border for track */
            transition: background 0.1s ease, border-color 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px; /* Cell-like thumb */
            height: 28px; /* Cell-like thumb */
            border-radius: 4px; /* Slightly rounded square for pixel-art feel */
            background: #00FFFF; /* Cyan thumb */
            cursor: grab;
            box-shadow: 0 0 10px #00FFFF; /* Strong glow */
            border: 2px solid #00FFFF; /* Matching border */
            transition: background 0.1s ease, box-shadow 0.1s ease, transform 0.1s ease;
            margin-top: -6px; /* Adjust to center vertically on thicker track */
        }

        input[type="range"]:active::-webkit-slider-thumb {
            cursor: grabbing;
            background: #E0FFFF; /* White on active grab */
            box-shadow: 0 0 15px #E0FFFF, 0 0 30px rgba(224,255,255,0.5);
            transform: scale(1.1); /* Slight pulse on grab */
        }

        /* Firefox specific slider styles */
        input[type="range"]::-moz-range-track { 
            height: 24px;
            background: rgba(0, 255, 255, 0.15);
            border-radius: 8px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6);
        }

        input[type="range"]::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 4px; /* Slightly rounded square */
            background: #00FFFF;
            cursor: grab;
            box-shadow: 0 0 10px #00FFFF;
            border: 2px solid #00FFFF;
            transition: background 0.1s ease, box-shadow 0.1s ease, transform 0.1s ease;
        }
        input[type="range"]:active::-moz-range-thumb {
            cursor: grabbing;
            background: #E0FFFF;
            box-shadow: 0 0 15px #E0FFFF, 0 0 30px rgba(224,255,255,0.5);
            transform: scale(1.1);
        }
        
        /* Sampler Buttons */
        .sampler-btns {
            display: flex;
            gap: 10px;
        }
        .sampler-btn {
            width: clamp(45px, 12vw, 55px); /* Responsive sizing */
            height: clamp(45px, 12vw, 55px); /* Responsive sizing */
            background: rgba(224, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.3); /* Themed border */
            color: #E0FFFF;
            font-size: 2.5em; /* Larger symbols */
            line-height: 1; /* Center symbol */
            cursor: pointer;
            border-radius: 8px; /* Consistent with cells */
            transition: background 0.1s ease, border-color 0.1s ease, box-shadow 0.1s ease;
            display: flex; /* For centering unicode symbols */
            align-items: center;
            justify-content: center;
        }
        .sampler-btn:hover { background: rgba(224, 255, 255, 0.2); border-color: #E0FFFF; }
        .sampler-btn:active { background: #E0FFFF; color: #000; box-shadow: 0 0 10px #E0FFFF; transform: scale(0.98); }
        .sampler-btn.active { background: #FF0096; border-color: #FF0096; color: #000; box-shadow: 0 0 10px #FF0096; } /* Active (recording/playing) color: Magenta */
        .sampler-btn[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(100%);
        }


        /* Crossfader (bottom center) - Always Visible */
        #crossfader-container {
            position: fixed;
            bottom: min(3vh, 30px); /* Responsive position */
            left: 50%;
            transform: translateX(-50%);
            z-index: 60; /* Above canvases, below main panel */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px 15px;
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
        }

        #crossfader-slider {
            width: min(70vw, 400px); /* Responsive width */
        }
        #crossfader-labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.75em;
            color: rgba(224, 255, 255, 0.7);
            user-select: text; /* Allow selection for labels */
        }

        /* Vertical Sliders (Side controls) - Always Visible */
        .vertical-slider-container {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 60px; /* Wider container for better touch */
            height: min(80vh, 300px); /* Responsive height */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 60;
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px 0;
        }

        #fuzz-slider-container { left: min(2vw, 20px); } /* Responsive position */
        #influence-slider-container { right: min(2vw, 20px); } /* Responsive position */

        .vertical-slider {
            -webkit-appearance: none;
            appearance: none;
            width: min(70vh, 250px); /* Responsive length */
            height: 24px; /* Chunkier track */
            background: rgba(0, 255, 255, 0.15);
            border-radius: 8px;
            outline: none;
            transform: rotate(-90deg); /* Vertical orientation */
            transform-origin: center; /* Rotate around center */
            cursor: grab;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6);
            border: 2px solid rgba(0, 255, 255, 0.3);
            transition: background 0.1s ease, border-color 0.1s ease;
        }
        /* Thumb styles for vertical sliders, consistent with horizontal */
        .vertical-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 28px; height: 28px; border-radius: 4px;
            background: #00FFFF; cursor: grab;
            box-shadow: 0 0 10px #00FFFF; border: 2px solid #00FFFF;
            transition: background 0.1s ease, box-shadow 0.1s ease, transform 0.1s ease;
        }
        .vertical-slider:active::-webkit-slider-thumb {
            cursor: grabbing; background: #E0FFFF;
            box-shadow: 0 0 15px #E0FFFF, 0 0 30px rgba(224,255,255,0.5); transform: scale(1.1);
        }
        .vertical-slider::-moz-range-thumb {
            width: 28px; height: 28px; border-radius: 4px;
            background: #00FFFF; cursor: grab;
            box-shadow: 0 0 10px #00FFFF; border: 2px solid #00FFFF;
            transition: background 0.1s ease, box-shadow 0.1s ease, transform 0.1s ease;
        }
        .vertical-slider:active::-moz-range-thumb {
            cursor: grabbing; background: #E0FFFF;
            box-shadow: 0 0 15px #E0FFFF, 0 0 30px rgba(224,255,255,0.5); transform: scale(1.1);
        }

        .vertical-label {
            color: #E0FFFF;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: absolute;
            bottom: -20px; 
            white-space: nowrap; /* Prevent wrapping */
            user-select: text; /* Allow selection for labels */
        }
        #fuzz-label { color: #FF00FF; } /* Magenta for Fuzz */
        #influence-label { color: #00FF00; } /* Green for Influence */

        /* Play/Pause Button */
        #play-pause-button {
            position: fixed;
            bottom: min(10vh, 100px); /* Position it above crossfader */
            left: 50%;
            transform: translateX(-50%);
            width: 55px; /* Consistent with other buttons */
            height: 55px; /* Consistent with other buttons */
            background: rgba(224, 255, 255, 0.1);
            color: #E0FFFF;
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px; /* Consistent with other buttons */
            cursor: pointer;
            transition: all 0.3s;
            z-index: 60; /* Above canvases, below main panel */
            font-size: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        #play-pause-button:hover { background: rgba(224, 255, 255, 0.2); border-color: #E0FFFF; }
        #play-pause-button:active { background: #E0FFFF; color: #000; box-shadow: 0 0 10px #E0FFFF; transform: scale(0.98); }
        #play-pause-button.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(20px);
        }


        /* Start Button (initial screen) */
        #start-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 200;
            font-family: 'Courier New', monospace;
        }

        #start-button:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        #start-button.hidden { 
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.9); /* Subtle scale down on hide */
        }

        /* Info Text */
        .info-text {
            font-size: 0.75em;
            text-align: center;
            color: rgba(224, 255, 255, 0.6);
            margin-top: 10px;
            line-height: 1.4;
            user-select: text; /* Allow selection for info text */
        }

        /* --- NEW UI ELEMENTS for the single canvas concept --- */
        /* Hidden BPM Control (Circular) */
        #bpm-control {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(0,255,255,0.1) 0%, transparent 70%);
            border: 2px solid rgba(0,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(0,255,255,0.8);
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer;
            z-index: 5; /* Below main panel */
            user-select: none;
            backdrop-filter: blur(2px);
        }
        
        #bpm-control.visible {
            opacity: 1;
        }
        
        #bpm-control:hover {
            background: radial-gradient(circle, rgba(0,255,255,0.2) 0%, transparent 70%);
            border-color: rgba(0,255,255,0.6);
        }

        /* Hidden Layer Control Panel */
        #layer-control-panel {
            position: fixed;
            top: 50%;
            left: min(2vw, 20px); /* Position it near left vertical slider */
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            opacity: 0;
            pointer-events: none; /* Initially non-interactive */
            transition: opacity 0.3s ease;
            z-index: 10; /* Below main panel */
            backdrop-filter: blur(5px);
        }

        #layer-control-panel.visible {
            opacity: 1;
            pointer-events: auto; /* Interactive when visible */
        }

        .layer-icon {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.6);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .layer-icon:hover {
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-color: rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.8);
        }

        .layer-icon.active { /* Currently playing */
            background: radial-gradient(circle, rgba(0,255,255,0.2) 0%, transparent 70%);
            border-color: #0ff;
            box-shadow: 0 0 10px #0ff;
            color: #0ff;
        }

        .layer-icon.selected { /* Currently being edited */
            border-color: #fff;
            box-shadow: 0 0 15px #fff;
            transform: scale(1.1);
        }
        
    </style>
</head>
<body>
    <div id="portal-container">
        <!-- The single canvas for both visual decks -->
        <canvas id="canvas" class="morphic-canvas"></canvas>
    </div>

    <div class="loading" id="loading">Initializing Morphic Field...</div>
    
    <div id="master-control-panel" class="hidden">
        <div class="control-group">
            <label>BPM</label>
            <div class="bpm-display-panel" id="bpm-display-panel">120</div> <!-- Specific for the panel BPM display -->
            <div class="bpm-btns">
                <button class="bpm-btn" id="bpm-down-btn">𓃑</button>
                <button class="bpm-btn" id="bpm-up-btn">𓉗</button>
            </div>
        </div>

        <div class="control-group">
            <label>DRONE VOLUME</label>
            <input type="range" id="drone-volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>

        <div class="control-group">
            <label>SEQUENCER VOLUME</label>
            <input type="range" id="seq-volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>
        
        <div class="control-group">
            <label>MASTER OUTPUT VOLUME</label>
            <input type="range" id="master-output-volume-slider" min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="control-group">
            <label>SAMPLE</label>
            <div class="sampler-btns">
                <button class="sampler-btn" id="capture-sample-btn">𓈌</button>
                <button class="sampler-btn" id="play-sample-btn" disabled>𓈋</button>
            </div>
            <div class="info-text sampler-info">
                Capture: Records live drone audio (4s). Play: Loops captured sample.
            </div>
        </div>
        
        <div class="control-group">
            <label>SAMPLE VOLUME</label>
            <input type="range" id="sample-volume-slider" min="0" max="1" step="0.01" value="0">
        </div>

        <div class="info-text">
            Left side: Drone (Mouse X/Y sculpts).<br>
            Right side: Sequencer (Click grid to toggle notes).<br><br>
            SHIFT+CLICK / 2-Finger Tap: Toggle UI.
        </div>
    </div>

    <!-- Always visible performance controls -->
    <div id="crossfader-container">
        <div id="crossfader-labels">
            <span>DRONE</span>
            <span>SAMPLE</span> <!-- Label changed to reflect new crossfader role -->
        </div>
        <input type="range" id="crossfader-slider" min="0" max="1" step="0.01" value="0.5">
    </div>

    <div id="fuzz-slider-container" class="vertical-slider-container">
        <input type="range" id="fuzz-slider" class="vertical-slider" min="0" max="1" step="0.01" value="0">
        <span id="fuzz-label" class="vertical-label">GLOBAL FUZZ</span>
    </div>
    <div id="influence-slider-container" class="vertical-slider-container">
        <input type="range" id="influence-slider" class="vertical-slider" min="0" max="1" step="0.01" value="1.0">
        <span id="influence-label" class="vertical-label">INFLUENCE</span>
    </div>

    <!-- Play/Pause for Sequencer (global) -->
    <button id="play-pause-button">❚❚</button> <!-- Starts playing by default -->

    <!-- Global BPM control (circular) -->
    <div id="bpm-control">
        <div id="bpm-display">120</div>
    </div>

    <!-- Layer control panel -->
    <div id="layer-control-panel"></div>

    <!-- Start button, disappears after first interaction -->
    <button id="start-button">Enter Morphic Field</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Global portal application object
        const portalApp = {};
        window.portalApp = portalApp; // Make accessible globally for colorPalette, etc.

        // Utility function to convert HSV to RGB for JS
        function hsvToRgb(h, s, v, a = 1.0) {
            let r, g, b;
            const i = Math.floor(h * 6);
            const f = h * 6 - i;
            const p = v * (1 - s);
            const q = v * (1 - f * s);
            const t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v, g = t, b = p; break;
                case 1: r = q, g = v, b = p; break;
                case 2: r = p, g = v, b = t; break;
                case 3: r = p, g = q, b = v; break;
                case 4: r = t, g = p, b = v; break;
                case 5: r = v, g = p, b = q; break;
            }
            return `rgba(${Math.round(r * 255)}, ${Math.round(g * 255)}, ${Math.round(b * 255)}, ${a})`;
        }
        portalApp.hsvToRgb = hsvToRgb; // Expose for UI updates

        // Utility for distortion curve
        function makeDistortionCurve(amount) {
            const k = typeof amount === 'number' ? amount : 50; 
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;
            for (let i = 0; i < n_samples; i++) {
                const x = i * 2 / n_samples - 1;
                curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        // --- GLOBAL APP STATE ---
        // (Previously part of portalApp, now explicitly defined)
        portalApp.audioContext = null;
        portalApp.masterGain = null;
        portalApp.globalAnalyser = null;
        portalApp.globalFrequencyData = null;
        portalApp.globalAudioLevel = 0;

        portalApp.globalFuzzNode = null;
        portalApp.globalFuzzWetGain = null;
        portalApp.globalFuzzDryGain = null;
        portalApp.globalFuzzAmount = 0.0;

        portalApp.droneOutputGain = null; // Output of drone section
        portalApp.samplerOutputGain = null; // Output of sampler section

        portalApp.samplerBuffer = null;
        portalApp.samplerSource = null;
        portalApp.isSampling = false;
        portalApp.isSamplerPlaying = false;
        portalApp.recorder = null;
        portalApp.recordedChunks = [];
        portalApp.captureDestination = null;
        portalApp.captureDuration = 4; // seconds

        // Shared scene for a single canvas
        portalApp.scene = null;
        portalApp.camera = null;
        portalApp.renderer = null;

        // Individual modules (conceptually "decks") that operate on the shared scene
        portalApp.droneModule = null; // Handles drone audio and visuals on left half
        portalApp.sequencerModule = null; // Handles sequencer audio and visuals on right half

        portalApp.uiVisible = true; // Overall UI visibility (for main panel)
        portalApp.crossfaderValue = 0.5; // Blends drone vs sample
        portalApp.masterOutputVolume = 0.5;

        // UI Hide timers
        portalApp.hideBpmTimer = null;
        portalApp.hideLayerControlTimer = null;

        // --- MODULE CLASSES ---

        // Manages the Drone (visuals on left half, audio source)
        class DroneModule {
            constructor() {
                this.mesh = null;
                this.particles = null;
                this.time = 0;
                this.mouse = new THREE.Vector2(0.25, 0.5); // Initial position for drone on left half
                this.audioLevel = 0;

                // Drone-specific visual parameters
                this.visualIntensity = 0.5;
                this.visualFlow = 0.6;
                this.visualBloom = 0.8;

                // Drone-specific audio parameters
                this.droneAudioFrequency = 220;
                this.droneAudioResonance = 0.7;
                this.droneOscillators = [];
                this.droneFilters = [];
                this.outputGain = null; // Will connect to portalApp.droneOutputGain
            }

            init(scene, camera, renderer, audioContext, globalAnalyser) {
                this.scene = scene;
                this.camera = camera;
                this.renderer = renderer;
                this.audioContext = audioContext;
                this.globalAnalyser = globalAnalyser;

                this.outputGain = this.audioContext.createGain();
                this.outputGain.gain.value = 1.0; // Base gain, crossfader handles mix with sampler
                this.outputGain.connect(portalApp.droneOutputGain);

                this.createVisuals();
                this.createAudio();
            }

            createVisuals() {
                const geometry = new THREE.PlaneGeometry(10, 20, 128, 128); // Left half of a 20x20 plane
                const vertexShader = `
                    uniform float time;
                    uniform float intensity;
                    uniform float flow;
                    uniform vec2 mouse;
                    varying vec2 vUv;
                    varying vec3 vPosition;
                    varying float vDistortion;
                    
                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        
                        // Scale UV to fit 0-1 on the LEFT half of the screen for interaction
                        vec2 scaledMouse = mouse * vec2(0.5, 1.0); 
                        float dist = distance(vUv, scaledMouse);
                        float wave = sin(dist * 15.0 - time * 2.0) * 0.1;
                        float ripple = sin(length(pos.xy) * 8.0 - time * 3.0) * 0.05;
                        
                        float morphic = sin(pos.x * 4.0 + time * flow) * 
                                       cos(pos.y * 3.0 + time * flow * 0.7) * intensity * 0.3;
                        
                        pos.z += wave + ripple + morphic;
                        vDistortion = abs(wave + ripple + morphic);
                        vPosition = pos;
                        
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `;
                const fragmentShader = `
                    uniform float time;
                    uniform float bloom;
                    uniform float harmonic;
                    uniform vec2 mouse;
                    uniform float audioLevel;
                    varying vec2 vUv;
                    varying vec3 vPosition;
                    varying float vDistortion;
                    
                    vec3 hsv2rgb(vec3 c) {
                        vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                        vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                        return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
                    }
                    
                    void main() {
                        vec2 center = vUv - 0.5;
                        float dist = length(center);
                        
                        float hue = time * 0.1 + dist * 2.0 + vDistortion * 5.0 + audioLevel * 0.5;
                        float sat = 0.7 + sin(time * 0.5 + dist * 10.0) * 0.3;
                        float brightness = bloom * (0.3 + vDistortion * 2.0 + audioLevel * 0.4); 
                        brightness = max(0.1, brightness);
                        
                        vec3 color = hsv2rgb(vec3(hue, sat, brightness));
                        
                        // Add visual cursor glow (only for left half of the screen)
                        vec2 screenMouse = mouse * vec2(1.0, 1.0); // Full screen mouse for visual cue
                        float cursorDist = distance(vUv.x, screenMouse.x);
                        if (vUv.x < 0.5) { // Only show glow on left half
                             cursorDist = distance(vUv, screenMouse);
                        } else {
                            cursorDist = 100.0; // Effectively turn off glow on right
                        }
                       
                        float cursorGlow = smoothstep(0.1, 0.0, cursorDist) * (0.5 + audioLevel * 1.0); 
                        color += vec3(0.1, 0.2, 0.3) * cursorGlow; 
                        
                        float alpha = 0.8 - dist * 0.5 + vDistortion + audioLevel * 0.2;
                        alpha *= smoothstep(1.5, 0.0, dist);
                        alpha += cursorGlow * 0.5;
                        
                        gl_FragColor = vec4(color, alpha);
                    }
                `;
                
                const material = new THREE.ShaderMaterial({
                    vertexShader, fragmentShader,
                    uniforms: {
                        time: { value: 0 },
                        intensity: { value: this.visualIntensity },
                        flow: { value: this.visualFlow },
                        bloom: { value: this.visualBloom },
                        harmonic: { value: 0.4 },
                        mouse: { value: this.mouse },
                        audioLevel: { value: 0 }
                    },
                    transparent: true, blending: THREE.AdditiveBlending
                });

                // Position this mesh on the left side of the overall scene (total width 20 units, so -10 to 0)
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.x = -5; // Half of plane width + half of total scene width
                this.scene.add(this.mesh);
            }

            createAudio() {
                const baseFreqs = [55, 73.42, 98]; // Fewer voices for drone to conserve resources
                baseFreqs.forEach((freq, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    const filter = this.audioContext.createBiquadFilter();
                    
                    osc.type = ['sine', 'sawtooth', 'triangle'][i % 3];
                    osc.frequency.value = freq;
                    gain.gain.value = 0.1 / baseFreqs.length;
                    
                    filter.type = 'lowpass';
                    filter.frequency.value = 1000 + i * 500;
                    filter.Q.value = 5;
                    
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.outputGain);
                    osc.start();
                    this.droneOscillators.push(osc);
                    this.droneFilters.push(filter);
                });
            }

            updateAudioParameters() {
                if (!this.audioContext || this.droneOscillators.length === 0) return;
                
                const baseFreq = this.droneAudioFrequency;
                const frequencies = [baseFreq, baseFreq * 1.5, baseFreq * 2];
                
                this.droneOscillators.forEach((osc, i) => {
                    osc.frequency.setTargetAtTime(frequencies[i], this.audioContext.currentTime, 0.1);
                });
                
                this.droneFilters.forEach(filter => {
                    filter.frequency.setTargetAtTime(
                        200 + this.visualIntensity * 1500, 
                        this.audioContext.currentTime,
                        0.1
                    );
                    filter.Q.setTargetAtTime(
                        this.droneAudioResonance * 15 + 1,
                        this.audioContext.currentTime,
                        0.1
                    );
                });
            }

            update(globalTime, globalAudioLevel) {
                this.time = globalTime;
                this.audioLevel = globalAudioLevel;

                if (!this.mesh || !this.mesh.material || !this.mesh.material.uniforms) return;

                this.mesh.material.uniforms.time.value = this.time;
                this.mesh.material.uniforms.intensity.value = this.visualIntensity;
                this.mesh.material.uniforms.flow.value = this.visualFlow;
                this.mesh.material.uniforms.bloom.value = this.visualBloom;
                this.mesh.material.uniforms.mouse.value.copy(this.mouse);
                this.mesh.material.uniforms.audioLevel.value = this.audioLevel;

                this.updateAudioParameters();
            }

            setMousePosition(x, y) {
                this.mouse.set(x, y);
            }
        }

        // Manages the Sequencer (visuals on right half, audio voices)
        class SequencerModule {
            constructor() {
                this.mesh = null; // Main visual field part
                this.time = 0;
                this.audioLevel = 0;
                this.beatPulse = 0; // Visual pulse from notes

                // Sequencer-specific visual parameters
                this.visualIntensity = 0.7;
                this.visualFlow = 0.8;

                // Sequencer properties
                this.bpm = 120;
                this.secondsPerStep = (60 / this.bpm) / 4; // 16th notes
                this.currentStep = 0;
                this.nextStepTime = 0;
                this.schedulerInterval = null;
                this.lookahead = 0.1;
                this.isPlaying = true; // Sequencer starts playing by default

                // Layer Management
                this.numLayers = 4; // Using 4 layers for clarity on the 8x4 grid
                this.layers = []; // Array of layer objects: { nodeStates: [], colorIndex: 0, isActive: boolean }
                this.activeLayerIndex = 0; // Layer currently selected for editing (corresponds to row 0-3)
                this.layerColors = [ // Specific colors for layers
                    [0.0, 0.8, 1.0], // Red-Orange
                    [0.2, 0.8, 1.0], // Yellow-Green
                    [0.6, 0.8, 1.0], // Blue-Purple
                    [0.8, 0.8, 1.0]  // Pink-Magenta
                ];

                // Audio voices for sequencer notes
                this.sequencerVoices = [];
                this.outputGain = null; // Will connect to portalApp.sequencerOutputGain

                // Three.js meshes for the grid cells
                this.sequencerVisualNodes = [];
            }

            init(scene, camera, renderer, audioContext, globalAnalyser) {
                this.scene = scene;
                this.camera = camera;
                this.renderer = renderer;
                this.audioContext = audioContext;
                this.globalAnalyser = globalAnalyser;

                this.outputGain = this.audioContext.createGain();
                this.outputGain.gain.value = 1.0;
                this.outputGain.connect(portalApp.sequencerOutputGain);

                this.createVisuals();
                this.createAudio();
                this.initializeLayers();
                this.createSequencerVisualNodes(); // Create 3D meshes for grid
                this.startSequencerScheduler();
            }

            createVisuals() {
                const geometry = new THREE.PlaneGeometry(10, 20, 128, 128); // Right half of a 20x20 plane
                const vertexShader = `
                    uniform float time;
                    uniform float intensity;
                    uniform float flow;
                    uniform float beatPulse; 
                    varying vec2 vUv;
                    varying vec3 vPosition;
                    varying float vDistortion;
                    
                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        
                        float morphic = sin(pos.x * 2.0 + time * flow * 0.2) * 
                                        cos(pos.y * 2.0 - time * flow * 0.1) * intensity * 0.5;
                        
                        pos.z += morphic + beatPulse * 0.5;
                        vDistortion = abs(morphic + beatPulse * 0.5);
                        vPosition = pos;
                        
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `;
                const fragmentShader = `
                    uniform float time;
                    uniform float audioLevel;
                    uniform float beatPulse;
                    varying vec2 vUv;
                    varying vec3 vPosition;
                    varying float vDistortion;
                    
                    vec3 hsv2rgb(vec3 c) {
                        vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                        vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                        return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
                    }
                    
                    void main() {
                        vec2 center = vUv - 0.5;
                        float dist = length(center);
                        
                        float hue = 0.55 + time * 0.02 + vDistortion * 2.0 + audioLevel * 0.3;
                        float sat = 0.7 + vDistortion * 0.3;
                        float brightness = 0.15 + vDistortion * 1.5 + audioLevel * 0.8 + beatPulse * 0.5;

                        // Pulsating grid lines
                        vec2 grid = fract(vUv * 8.0); 
                        float gridLineX = (1.0 - step(0.02, grid.x)); 
                        float gridLineY = (1.0 - step(0.02, grid.y)); 
                        float gridIntensity = max(gridLineX, gridLineY) * (0.1 + beatPulse * 0.2); 
                        brightness += gridIntensity;

                        vec3 color = hsv2rgb(vec3(hue, sat, brightness));
                        
                        float alpha = 0.9 - length(center) * 0.5 + vDistortion + audioLevel * 0.1;
                        alpha = clamp(alpha, 0.0, 1.0); 
                        
                        gl_FragColor = vec4(color, alpha);
                    }
                `;
                
                const material = new THREE.ShaderMaterial({
                    vertexShader, fragmentShader,
                    uniforms: {
                        time: { value: 0 },
                        intensity: { value: this.visualIntensity },
                        flow: { value: this.visualFlow },
                        audioLevel: { value: 0 },
                        beatPulse: { value: this.beatPulse }
                    },
                    transparent: true, blending: THREE.AdditiveBlending
                });

                // Position this mesh on the right side of the overall scene (total width 20 units, so 0 to 10)
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.x = 5; // Half of plane width + half of total scene width
                this.scene.add(this.mesh);
            }

            createAudio() {
                const baseFreqs = [55, 73.42, 98, 130.81, 174.61, 233.08, 311.13, 415.30];
                this.sequencerVoices = baseFreqs.map((freq, i) => {
                    const voice = {
                        osc: this.audioContext.createOscillator(),
                        gain: this.audioContext.createGain(),
                        filter: this.audioContext.createBiquadFilter()
                    };
                    voice.osc.type = 'triangle';
                    voice.osc.frequency.value = freq;
                    voice.gain.gain.value = 0; // Starts silent
                    voice.filter.type = 'lowpass';
                    voice.filter.frequency.value = 2000;
                    voice.filter.Q.value = 5;

                    voice.osc.connect(voice.filter);
                    voice.filter.connect(voice.gain);
                    voice.gain.connect(this.outputGain);
                    voice.osc.start();
                    return voice;
                });
            }

            initializeLayers() {
                for (let i = 0; i < this.numLayers; i++) {
                    this.layers.push({
                        id: i,
                        nodeStates: Array(8).fill(false), // All nodes off by default
                        colorIndex: i % this.layerColors.length, // Assign a color to each layer
                        isActive: false // Layer is not active for playback by default
                    });
                }
                // Set a default pattern for the first layer for immediate sound/visuals on load
                this.layers[0].nodeStates = [true, false, true, false, true, false, true, false];
                this.layers[0].isActive = true; // First layer is active for playback by default
            }

            createSequencerVisualNodes() {
                this.sequencerVisualNodes = [];
                const nodeSize = 1.8; // Size of each visual node in Three.js units

                // The sequencer grid occupies roughly 80% of Deck B's width and height, centered.
                // Deck B is positioned from x=0 to x=10 in world units relative to camera.
                const gridWidthWorld = 10 * 0.8; 
                const gridHeightWorld = 20 * 0.8; 
                const startXWorld = 0 + (10 * 0.1); // Left edge of Deck B (0) + 10% padding
                const startYWorld = 10 - (20 * 0.1); // Top edge of Deck B (10) - 10% padding (from top of its 20 unit height)

                for (let y = 0; y < 4; y++) {
                    for (let x = 0; x < 8; x++) {
                        const posX = startXWorld + (x + 0.5) * (gridWidthWorld / 8); 
                        const posY = startYWorld - (y + 0.5) * (gridHeightWorld / 4); 
                        
                        const geometry = new THREE.PlaneGeometry(nodeSize, nodeSize);
                        const material = new THREE.MeshBasicMaterial({ 
                            color: 0xcccccc, 
                            transparent: true, 
                            opacity: 0.5, 
                            depthTest: false, 
                            blending: THREE.AdditiveBlending 
                        });
                        const nodeMesh = new THREE.Mesh(geometry, material);
                        nodeMesh.position.set(posX, posY, 0.1); 
                        this.scene.add(nodeMesh);
                        this.sequencerVisualNodes.push(nodeMesh);
                    }
                }
                this.updateSequencerVisualNodes(); // Set initial colors/states
            }

            updateSequencerVisualNodes() {
                if (!this.sequencerVisualNodes || this.sequencerVisualNodes.length === 0) return;

                let nodeIndex = 0;
                for (let y = 0; y < 4; y++) {
                    for (let x = 0; x < 8; x++) {
                        const mesh = this.sequencerVisualNodes[nodeIndex];
                        if (!mesh) { nodeIndex++; continue; }

                        const layerState = this.layers[y]; // Get state for this specific layer/row
                        const nodeIsActive = layerState.nodeStates[x];
                        const isPlayingStep = (this.currentStep === x && this.isPlaying);
                        
                        // Use the color of the *current selected layer* for all nodes on display
                        const hsvColor = this.layerColors[this.activeLayerIndex] || this.layerColors[0]; 
                        const baseColor = new THREE.Color().setHSL(hsvColor[0], hsvColor[1], hsvColor[2]);

                        if (nodeIsActive) {
                            // If node is active, use selected layer's color
                            mesh.material.color.copy(baseColor);
                            mesh.material.opacity = 1.0;
                        } else {
                            // Inactive nodes are dim grey
                            mesh.material.color.setHex(0x444444); 
                            mesh.material.opacity = 0.2;
                        }

                        if (isPlayingStep) {
                            // Current playing step, glow white
                            mesh.material.color.setHex(0xFFFFFF); 
                            mesh.material.opacity = 1.0;
                            mesh.scale.set(1.15 * (1 + this.beatPulse * 0.1), 1.15 * (1 + this.beatPulse * 0.1), 1.15); // Pulse effect
                        } else {
                            mesh.scale.set(1.0, 1.0, 1.0); // Reset scale
                        }
                        nodeIndex++;
                    }
                }
            }

            startSequencerScheduler() {
                if (this.schedulerInterval) clearInterval(this.schedulerInterval);
                this.nextStepTime = this.audioContext.currentTime;
                this.schedulerInterval = setInterval(() => this.scheduler(), this.lookahead * 1000 * 0.5);
                console.log('Sequencer started/restarted with BPM:', this.bpm);
            }

            scheduler() {
                if (!this.isPlaying || !this.audioContext || this.audioContext.state !== 'running') {
                    // Update visual current step even if paused, but don't schedule audio
                    if (this.isPlaying === false && this.schedulerInterval) {
                         // Only update visuals if scheduler is running, but paused
                         this.currentStep = (this.currentStep + 1) % 8;
                         this.updateSequencerVisualNodes();
                    }
                    return;
                }

                while (this.nextStepTime < this.audioContext.currentTime + this.lookahead) {
                    this.scheduleStep(this.currentStep, this.nextStepTime);
                    this.nextStepTime += this.secondsPerStep;
                    this.currentStep = (this.currentStep + 1) % 8;
                }
            }

            scheduleStep(step, time) {
                this.beatPulse = 1.0; // Trigger visual pulse

                // Update current step for visual nodes
                this.updateSequencerVisualNodes();

                // Play notes only from layers that are both 'active' and have the current 'step' enabled
                this.layers.forEach(layer => {
                    if (layer.isActive && layer.nodeStates[step]) {
                        const voice = this.sequencerVoices[step];
                        if (voice) {
                            voice.gain.gain.cancelScheduledValues(time);
                            voice.gain.gain.setValueAtTime(0, time);
                            voice.gain.gain.linearRampToValueAtTime(0.5 * this.influence, time + 0.01);
                            voice.gain.gain.exponentialRampToValueAtTime(0.001, time + this.secondsPerStep * 0.8);

                            // Apply some modulation based on layer parameters or mouse interaction
                            voice.filter.frequency.setTargetAtTime(1000 + layer.id * 500, time, 0.05);
                            voice.filter.Q.setTargetAtTime(3 + layer.id, time, 0.05);
                        }
                    }
                });
            }

            // Handles clicks on the sequencer canvas area (right half)
            handleCanvasClick(e) {
                const rect = this.canvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
                const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

                // Map clientX/Y to 3D world coordinates on the sequencer plane (this.mesh)
                // This is simpler than raycasting if the plane is flat.
                // Assuming the plane is at Z=0, and goes from x=0 to x=10 (in world coords of Deck B)
                // and y=-10 to y=10 (in world coords of Deck B)

                // Normalize clientX to the sequencer's world X range (0 to 10)
                const totalCanvasWidth = window.innerWidth;
                const sequencerCanvasWidth = totalCanvasWidth / 2; // Right half
                const clickX_relativeToSequencerCanvas = clientX - sequencerCanvasWidth; // Click relative to its own canvas start

                const worldX = (clickX_relativeToSequencerCanvas / sequencerCanvasWidth) * 10; // Map 0-sequencerCanvasWidth to 0-10 worldX
                const worldY = 10 - (clientY / window.innerHeight) * 20; // Map 0-windowHeight to 10 to -10 worldY

                // Now convert worldX, worldY to grid cell indices
                // Grid starts at startXWorld, startYWorld from createSequencerVisualNodes
                const gridWidthWorld = 10 * 0.8;
                const gridHeightWorld = 20 * 0.8;
                const startXWorld = 10 * 0.1; // This is the padding
                const startYWorld = 10 - (20 * 0.1); // This is the top Y edge of the grid

                const clickX_relativeToGrid = worldX - startXWorld;
                const clickY_relativeToGrid = startYWorld - worldY; // Invert Y as grid rows go down

                const step = Math.floor(clickX_relativeToGrid / (gridWidthWorld / 8)); // Column 0-7
                const layer = Math.floor(clickY_relativeToGrid / (gridHeightWorld / 4)); // Row 0-3

                if (step >= 0 && step < 8 && layer >= 0 && layer < this.numLayers) {
                    const currentLayerState = this.layers[layer];
                    currentLayerState.nodeStates[step] = !currentLayerState.nodeStates[step];
                    this.activeLayerIndex = layer; // Automatically select the layer being edited
                    portalApp.updateLayerControlUI(); // Update layer icons
                    this.updateSequencerVisualNodes(); // Update 3D nodes
                    portalApp.updateStateInURL();
                }
            }

            update(globalTime, globalAudioLevel) {
                this.time = globalTime;
                this.audioLevel = globalAudioLevel;

                if (!this.mesh || !this.mesh.material || !this.mesh.material.uniforms) return;

                this.mesh.material.uniforms.time.value = this.time;
                this.mesh.material.uniforms.intensity.value = this.visualIntensity;
                this.mesh.material.uniforms.flow.value = this.visualFlow;
                this.mesh.material.uniforms.audioLevel.value = this.audioLevel;
                this.mesh.material.uniforms.beatPulse.value = this.beatPulse;

                if (this.beatPulse > 0.001) {
                    this.beatPulse *= 0.9;
                } else {
                    this.beatPulse = 0;
                }
            }

            setBPM(bpm) {
                this.bpm = bpm;
                this.secondsPerStep = (60 / this.bpm) / 4;
                if (this.audioContext && this.audioContext.state === 'running') {
                    this.startSequencerScheduler(); // Restart scheduler for new tempo
                }
            }

            setInfluence(val) {
                this.influence = val;
            }

            togglePlayPause() {
                this.isPlaying = !this.isPlaying;
                if (this.isPlaying && this.audioContext && this.audioContext.state !== 'running') {
                    this.audioContext.resume();
                }
            }
        }

        // --- GLOBAL APP INITIALIZATION & UI MANAGEMENT ---
        
        portalApp.initApplication = async () => {
            if (portalApp.audioContext) return; // Already initialized

            try {
                portalApp.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                await portalApp.audioContext.resume();

                // Setup global audio chain
                portalApp.masterGain = portalApp.audioContext.createGain();
                portalApp.masterGain.connect(portalApp.audioContext.destination);

                portalApp.globalAnalyser = portalApp.audioContext.createAnalyser();
                portalApp.globalAnalyser.fftSize = 256;
                portalApp.globalAnalyser.connect(portalApp.masterGain);
                portalApp.globalFrequencyData = new Uint8Array(portalApp.globalAnalyser.frequencyBinCount);

                portalApp.globalFuzzNode = portalApp.audioContext.createWaveShaper();
                portalApp.globalFuzzNode.curve = makeDistortionCurve(portalApp.globalFuzzAmount * 100);
                portalApp.globalFuzzNode.oversample = '4x';
                portalApp.globalFuzzWetGain = portalApp.audioContext.createGain();
                portalApp.globalFuzzDryGain = portalApp.audioContext.createGain();
                portalApp.globalFuzzWetGain.gain.value = portalApp.globalFuzzAmount;
                portalApp.globalFuzzDryGain.gain.value = 1 - portalApp.globalFuzzAmount;
                
                portalApp.globalFuzzDryGain.connect(portalApp.masterGain);
                portalApp.globalFuzzWetGain.connect(portalApp.globalFuzzNode);
                portalApp.globalFuzzNode.connect(portalApp.masterGain); // Fuzz output also goes to master

                // Setup crossfader (Drone vs Sample)
                portalApp.droneOutputGain = portalApp.audioContext.createGain();
                portalApp.samplerOutputGain = portalApp.audioContext.createGain();
                portalApp.droneOutputGain.connect(portalApp.globalAnalyser);
                portalApp.samplerOutputGain.connect(portalApp.globalAnalyser);


                // Setup Three.js (single canvas)
                const canvas = document.getElementById('canvas');
                portalApp.scene = new THREE.Scene();
                portalApp.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                portalApp.renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
                portalApp.renderer.setSize(window.innerWidth, window.innerHeight);
                portalApp.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                portalApp.camera.position.z = 5; // Adjust camera to see entire 20x20 plane (drone is -10 to 0, seq is 0 to 10)


                // Initialize Modules
                portalApp.droneModule = new DroneModule();
                portalApp.droneModule.init(portalApp.scene, portalApp.camera, portalApp.renderer, portalApp.audioContext, portalApp.globalAnalyser);

                portalApp.sequencerModule = new SequencerModule();
                portalApp.sequencerModule.init(portalApp.scene, portalApp.camera, portalApp.renderer, portalApp.audioContext, portalApp.globalAnalyser);

                // Sampler Setup
                portalApp.captureDestination = portalApp.audioContext.createMediaStreamDestination();
                portalApp.droneModule.outputGain.connect(portalApp.captureDestination); // Capture only the drone output


                // Apply loaded state
                portalApp.applyDeferredState();

                // Setup UI Listeners
                portalApp.setupUILeseners();

                // Hide start button
                document.getElementById('start-button').classList.add('hidden');
                
                // Set initial UI visibility (main panel will be hidden/shown, others always visible)
                portalApp.toggleUI(portalApp.uiVisible); 

                // Ensure initial values are applied
                portalApp.updateCrossfader(portalApp.crossfaderValue);
                portalApp.updateGlobalFuzz(portalApp.globalFuzzAmount);
                portalApp.updateMasterVolume(portalApp.masterOutputVolume);
                portalApp.updateSampleVolume(document.getElementById('sample-volume-slider').value); // Ensure sample volume is set from loaded value

                portalApp.animate();
                window.dispatchEvent(new Event('resize')); // Trigger initial resize

                console.log("Morphic Resonance Deck Initialized.");

            } catch (error) {
                console.error('Failed to initialize AudioContext:', error);
                alert('Audio cannot be started. Please ensure your browser allows autoplay or try refreshing. Error: ' + error.message);
            }
        };

        portalApp.animate = () => {
            requestAnimationFrame(portalApp.animate);

            // Update global audio level for visualizers
            if (portalApp.globalAnalyser && portalApp.globalFrequencyData) {
                let sum = 0;
                portalApp.globalAnalyser.getByteFrequencyData(portalApp.globalFrequencyData);
                for (let i = 0; i < portalApp.globalFrequencyData.length; i++) {
                    sum += portalApp.globalFrequencyData[i];
                }
                portalApp.globalAudioLevel = (sum / portalApp.globalFrequencyData.length) / 255;
            }

            // Update modules
            if (portalApp.droneModule) portalApp.droneModule.update(performance.now() / 1000, portalApp.globalAudioLevel);
            if (portalApp.sequencerModule) portalApp.sequencerModule.update(performance.now() / 1000, portalApp.globalAudioLevel);
            
            // Render the combined scene
            if (portalApp.renderer && portalApp.scene && portalApp.camera) {
                portalApp.renderer.render(portalApp.scene, portalApp.camera);
            }
        };

        // --- UI CONTROL FUNCTIONS ---

        portalApp.setupUILeseners = () => {
            // Main Panel BPM Controls
            document.getElementById('bpm-up-btn').onclick = () => portalApp.changeBPM(5);
            document.getElementById('bpm-down-btn').onclick = () => portalApp.changeBPM(-5);

            // Main Panel Volume Sliders
            document.getElementById('drone-volume-slider').oninput = (e) => {
                if (portalApp.droneModule && portalApp.droneModule.outputGain) portalApp.droneModule.outputGain.gain.value = parseFloat(e.target.value);
                portalApp.updateStateInURL();
            };
            document.getElementById('seq-volume-slider').oninput = (e) => {
                if (portalApp.sequencerModule && portalApp.sequencerModule.outputGain) portalApp.sequencerModule.outputGain.gain.value = parseFloat(e.target.value);
                portalApp.updateStateInURL();
            };
            document.getElementById('master-output-volume-slider').oninput = (e) => {
                portalApp.updateMasterVolume(parseFloat(e.target.value));

            // Sampler Controls
            document.getElementById('capture-sample-btn').onclick = () => portalApp.captureSample();
            document.getElementById('play-sample-btn').onclick = () => portalApp.playSample();

                else { currentValue = Math.max(0.0, currentValue - step); }
                influenceSlider.value = currentValue;
                portalApp.sequencerModule.setInfluence(currentValue);

            // Global Play/Pause Button

            // Canvas Interaction (Unified Logic)
            const canvas = document.getElementById('canvas');
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX_norm = e.clientX / window.innerWidth;
                const mouseY_norm = 1.0 - e.clientY / window.innerHeight; // Invert Y

                if (e.clientX < window.innerWidth / 2) { // Left half (Drone interaction)
                    if (!portalApp.uiVisible && portalApp.droneModule) { 
                        portalApp.droneModule.setMousePosition(mouseX_norm, mouseY_norm);

                        portalApp.droneModule.droneAudioResonance = Math.sin(portalApp.droneModule.time * 0.01 + mouseX_norm * Math.PI) * 0.5 + 0.5;
                        portalApp.droneModule.visualBloom = 0.3 + mouseY_norm * 0.7;

                        portalApp.droneModule.updateAudioParameters();
                        portalApp.updateStateInURL();

                portalApp.droneModule.mesh.material.uniforms.mouse.value.set(mouseX_norm, mouseY_norm);
                portalApp.sequencerModule.mesh.material.uniforms.mouse.value.set(mouseX_norm, mouseY_norm);
            });

            canvas.addEventListener('touchmove', (e) => {

                    const mouseX_norm = e.touches[0].clientX / window.innerWidth;
                    const mouseY_norm = 1.0 - e.touches[0].clientY / window.innerHeight;

                    if (e.touches[0].clientX < window.innerWidth / 2) { // Left half (Drone interaction)
                        if (!portalApp.uiVisible && portalApp.droneModule) { 
                            portalApp.droneModule.setMousePosition(mouseX_norm, mouseY_norm);
                            portalApp.droneModule.droneAudioFrequency = 100 + mouseX_norm * 400; 
                            portalApp.droneModule.droneAudioResonance = Math.sin(portalApp.droneModule.time * 0.01 + mouseX_norm * Math.PI) * 0.5 + 0.5;
                            portalApp.droneModule.visualBloom = 0.3 + mouseY_norm * 0.7;
                            portalApp.droneModule.visualFlow = mouseX_norm * 2;
                            portalApp.droneModule.visualIntensity = 0.5 + mouseY_norm * 0.5;
                            portalApp.droneModule.updateAudioParameters();
                            portalApp.updateStateInURL(); 
                        }
                    }
                    portalApp.droneModule.mesh.material.uniforms.mouse.value.set(mouseX_norm, mouseY_norm);
                    portalApp.sequencerModule.mesh.material.uniforms.mouse.value.set(mouseX_norm, mouseY_norm);
                }
            }, { passive: false });

            // UI Toggle (Shift+Click / 2-Finger Tap)
            document.addEventListener('mousedown', (e) => {
                if (e.shiftKey) {
                    portalApp.toggleUI();
                    e.preventDefault();

            document.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) { // 2-finger tap for UI
                    portalApp.toggleUI();
                    e.preventDefault();

            // BPM Control click handler (for the circular button)
            document.getElementById('bpm-control').addEventListener('click', (e) => {

            document.addEventListener('click', (e) => {

                if (portalApp.layerControlVisible && !e.target.closest('#layer-control-panel')) {

                }

            // Prevent immediate hide on hover (desktop only)
            document.getElementById('bpm-control').addEventListener('mouseenter', () => clearTimeout(portalApp.hideBpmTimer));
            document.getElementById('bpm-control').addEventListener('mouseleave', () => portalApp.scheduleHideBPMControl());
            document.getElementById('layer-control-panel').addEventListener('mouseenter', () => clearTimeout(portalApp.hideLayerControlTimer));
            document.getElementById('layer-control-panel').addEventListener('mouseleave', () => portalApp.scheduleHideLayerControl());

            // Window Resize Listener
            window.addEventListener('resize', () => {
                if (portalApp.renderer && portalApp.camera) {
                    portalApp.camera.aspect = window.innerWidth / window.innerHeight;
                    portalApp.camera.updateProjectionMatrix();
                    portalApp.renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });
        };

        // --- GLOBAL STATE UPDATE FUNCTIONS ---

        // Schedule hide for BPM control
        portalApp.scheduleHideBPMControl = () => {
            clearTimeout(portalApp.hideBpmTimer);
            portalApp.hideBpmTimer = setTimeout(() => {
                document.getElementById('bpm-control').classList.remove('visible');
                portalApp.bpmControlVisible = false;
            }, 3000);
        };

        // Schedule hide for Layer control
        portalApp.scheduleHideLayerControl = () => {
            clearTimeout(portalApp.hideLayerControlTimer);
            portalApp.hideLayerControlTimer = setTimeout(() => {
                document.getElementById('layer-control-panel').classList.remove('visible');
                portalApp.layerControlVisible = false;
            }, 3000);
        };

        portalApp.updateControlsUI = () => {
            // Update values on DOM elements for the main control panel
            if (portalApp.sequencerModule) {
                document.getElementById('bpm-display-panel').textContent = portalApp.sequencerModule.bpm;
                document.getElementById('seq-volume-slider').value = portalApp.sequencerModule.outputGain.gain.value;
                document.getElementById('influence-slider').value = portalApp.sequencerModule.influence;
                document.getElementById('bpm-display').textContent = portalApp.sequencerModule.bpm; // For the circular BPM display
            }
