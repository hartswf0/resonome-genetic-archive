<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphic Resonance Portal</title>
    <style>
        /* General Reset and Body Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Prevent text selection */
        }
        
        body {
            background: #000;
            overflow: hidden;
            cursor: none; /* Hide default cursor */
            touch-action: none; /* Prevent browser gestures like pull-to-refresh */
            font-family: 'Courier New', monospace; /* Classic monospace font */
            color: #E0FFFF; /* Light cyan text color */
        }
        
        /* Canvas for Three.js */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: opacity 0.5s ease; /* For fading when UI is shown */
        }
        
        /* Loading Indicator */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(224, 255, 255, 0.5); /* Semi-transparent cyan */
            font-size: 1.2em;
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
        }
        
        /* Sequencer Grid Styles (Chunkier, TM-like) */
        #seq {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(8, 50px); /* Bigger columns */
            grid-gap: 8px; /* More spacing */
            z-index: 50;
            opacity: 1; /* Initially visible */
            transition: opacity 0.4s ease;
            backdrop-filter: blur(5px); /* Blurred background */
            background: rgba(0, 0, 0, 0.4); /* Dark translucent background */
            padding: 12px;
            border-radius: 12px;
            border: 2px solid rgba(0, 255, 255, 0.3); /* Cyan border */
        }
        
        .step {
            width: 50px; 
            height: 50px;
            border-radius: 6px; /* Slightly rounded corners */
            cursor: pointer;
            transition: all 0.15s ease;
            border: 2px solid rgba(224, 255, 255, 0.2); /* Light cyan border */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2em; /* Larger symbols */
            line-height: 1; /* Adjust line height */
            color: rgba(224, 255, 255, 0.5); /* Default symbol color */
        }
        
        /* Row-specific colors (subtle background for visual grouping) */
        .step[data-y="0"] { background: rgba(255, 0, 150, 0.05); } /* Magenta */
        .step[data-y="1"] { background: rgba(0, 255, 255, 0.05); } /* Cyan */
        .step[data-y="2"] { background: rgba(255, 255, 0, 0.05); } /* Yellow */
        .step[data-y="3"] { background: rgba(150, 255, 0, 0.05); } /* Lime Green */
        
        /* Active (toggled on) state */
        .step.active {
            background: #00FFFF; /* Bright Cyan */
            color: #000; /* Black text on active */
            border-color: #00FFFF;
            box-shadow: 0 0 10px #00FFFF, inset 0 0 5px rgba(255,255,255,0.5);
            transform: scale(1.02); /* Slight scale on active */
        }
        /* Row-specific active colors (more vibrant) */
        .step.active[data-y="0"] { background: #FF0096; color: #000; border-color: #FF0096; }
        .step.active[data-y="1"] { background: #00FFFF; color: #000; border-color: #00FFFF; }
        .step.active[data-y="2"] { background: #FFFF00; color: #000; border-color: #FFFF00; }
        .step.active[data-y="3"] { background: #96FF00; color: #000; border-color: #96FF00; }
        
        /* Playing (current step) indicator */
        .step.playing { 
            box-shadow: 0 0 20px #E0FFFF, 0 0 30px rgba(224, 255, 255, 0.5); /* Strong white glow */
            transform: scale(1.15); /* Stronger pulse */
            border-color: #E0FFFF; /* White border */
            z-index: 1; /* Bring to front for pulse effect */
        }
        
        /* Control Panel Styles (BPM & Fuzz) */
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            color: #E0FFFF;
            font-size: 1em;
            backdrop-filter: blur(5px);
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 12px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: opacity 0.4s ease;
        }
        
        .control-group {
            display: flex;
            flex-direction: column; /* Stack label and control */
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(224, 255, 255, 0.8);
        }

        .bpm-display {
            font-size: 2em; /* Large BPM number */
            font-weight: bold;
            color: #00FFFF;
            padding: 5px 0;
            width: 80px; /* Fixed width to prevent wobble */
            text-align: center;
        }
        
        .bpm-btns {
            display: flex;
            gap: 10px;
        }

        .bpm-btn {
            width: 40px; /* Larger buttons */
            height: 40px;
            background: rgba(224, 255, 255, 0.1);
            border: 2px solid rgba(224, 255, 255, 0.3);
            color: #E0FFFF;
            font-size: 2em; /* Larger symbols */
            line-height: 1; /* Center symbol */
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.1s ease, border-color 0.1s ease, box-shadow 0.1s ease;
        }
        .bpm-btn:hover {
            background: rgba(224, 255, 255, 0.2);
            border-color: #E0FFFF;
        }
        .bpm-btn:active {
            background: #E0FFFF;
            color: #000;
            box-shadow: 0 0 10px #E0FFFF;
        }

        /* Slider Styles (Chunkier) */
        input[type="range"] {
            -webkit-appearance: none;
            width: 150px; /* Fixed width */
            height: 12px; /* Thicker slider track */
            background: rgba(224, 255, 255, 0.15);
            border-radius: 6px;
            outline: none;
            cursor: grab;
            margin: 0;
            padding: 0;
            box-shadow: inset 0 0 3px rgba(0,0,0,0.5);
            transition: background 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px; /* Larger thumb */
            height: 28px;
            border-radius: 50%;
            background: #00FFFF; /* Cyan thumb */
            cursor: grab;
            box-shadow: 0 0 8px #00FFFF;
            border: 2px solid #00FFFF; /* Matching border */
            transition: background 0.1s ease, box-shadow 0.1s ease, transform 0.1s ease;
        }

        input[type="range"]:active::-webkit-slider-thumb {
            cursor: grabbing;
            background: #E0FFFF; /* White on active grab */
            box-shadow: 0 0 15px #E0FFFF, 0 0 30px rgba(224,255,255,0.5);
            transform: scale(1.1); /* Slight pulse on grab */
        }

        /* Firefox specific slider styles */
        input[type="range"]::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #00FFFF;
            cursor: grab;
            box-shadow: 0 0 8px #00FFFF;
            border: 2px solid #00FFFF;
            transition: background 0.1s ease, box-shadow 0.1s ease, transform 0.1s ease;
        }
        input[type="range"]:active::-moz-range-thumb {
            cursor: grabbing;
            background: #E0FFFF;
            box-shadow: 0 0 15px #E0FFFF, 0 0 30px rgba(224,255,255,0.5);
            transform: scale(1.1);
        }

        /* Hide UI */
        #seq.hidden, #controls.hidden {
            opacity: 0;
            pointer-events: none; /* Make non-interactive when hidden */
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="loading" id="loading">Initializing Morphic Field...</div>
    
    <div id="seq"></div>
    
    <div id="controls">
        <div class="control-group">
            <label>BPM</label>
            <div class="bpm-display" id="bpm-display">120</div>
            <div class="bpm-btns">
                <button class="bpm-btn" onclick="portal.changeBPM(-5)">𓃑</button>
                <button class="bpm-btn" onclick="portal.changeBPM(5)">𓉗</button>
            </div>
        </div>

        <div class="control-group">
            <label>FUZZ MIX</label>
            <input type="range" id="fuzz-mix-slider" min="0" max="1" step="0.01" value="0">
        </div>
        
        <div style="font-size: 0.8em; text-align: center; color: rgba(224, 255, 255, 0.6);">
            SHIFT+CLICK / 2-Finger Tap: Toggle UI
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        class MorphicFieldPortal {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.audioContext = null;
                this.masterGain = null;
                this.reverb = null;
                this.oscillators = [];
                this.filters = [];
                this.analyser = null;
                this.frequencyData = null;
                
                // New: Audio routing for drone and fuzz
                this.droneMasterGain = null; // Master gain for the core drone sound
                this.fuzzNode = null;        // Web Audio WaveShaper for distortion
                this.fuzzWetGain = null;     // Wet signal path for fuzz
                this.fuzzDryGain = null;     // Dry signal path for fuzz
                
                this.mouse = { x: 0, y: 0, down: false };
                this.morphicState = {
                    masterVolume: 0.5, // Controlled by mouse Y, overall synth volume
                    frequency: 220,    // Controlled by mouse X, base drone frequency
                    resonance: 0.7,    // Controlled by mouse X+time, filter Q
                    bloom: 0.8,        // Controlled by mouse Y, visual glow amount
                    flow: 0.6,         // Controlled by mouse X, visual flow speed
                    harmonic: 0.4,     // Controlled by mouse Y+time, harmonic spread
                    fuzzAmount: 0.0,   // Controlled by fuzz-mix-slider, 0.0 (dry) to 1.0 (wet)
                };
                
                this.fieldMesh = null;
                this.particles = null; // Ensure particles are handled
                this.time = 0;
                
                // Sequencer properties
                // 8 columns (steps), 4 rows (triggers/effects)
                this.steps = Array(8).fill().map(() => Array(4).fill(false)); 
                this.currentStep = 0;
                this.bpm = 120; // Default BPM
                this.secondsPerStep = (60 / this.bpm) / 4; // Each step is a 16th note
                this.nextStepTime = 0;
                this.sequencerInterval = null;
                this.uiVisible = true; // Overall UI visibility (sequencer grid + controls)
                
                this.init();
            }
            
            init() {
                this.setupThreeJS();
                // Audio context setup and startSequencer moved to be triggered by user interaction
                this.createMorphicField();
                this.setupSequencerUI(); // Setup the DOM elements for sequencer
                this.setupControlsUI();  // Setup the DOM elements for BPM and Fuzz
                
                this.loadStateFromURL(); // Load state (including steps, BPM, morphicState)
                this.updateSequencerUI(); // Update UI based on loaded state
                this.updateControlsUI();   // Update controls UI based on loaded state
                
                this.setupInteraction(); // Set up event listeners
                this.animate();
                
                document.getElementById('loading').style.display = 'none';
                this.toggleUI(this.uiVisible); // Set initial UI visibility
            }
            
            setupThreeJS() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ 
                    canvas: document.getElementById('canvas'),
                    antialias: true,
                    alpha: true
                });
                
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                
                this.camera.position.z = 5;
                
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }
            
            async setupAudio() {
                // Only create AudioContext if it doesn't exist or is closed
                if (!this.audioContext || this.audioContext.state === 'closed') {
                    try {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        
                        // Master gain (overall output volume)
                        this.masterGain = this.audioContext.createGain();
                        this.masterGain.gain.value = this.morphicState.masterVolume;
                        this.masterGain.connect(this.audioContext.destination);
                        
                        // Analyser for visual feedback
                        this.analyser = this.audioContext.createAnalyser();
                        this.analyser.fftSize = 256;
                        // Analyser connects BEFORE masterGain for full signal analysis
                        this.analyser.connect(this.masterGain); 
                        this.frequencyData = new Uint8Array(this.analyser.frequencyBinCount);
                        
                        // Drone master gain (for oscillators)
                        this.droneMasterGain = this.audioContext.createGain();
                        this.droneMasterGain.gain.value = 1; // Base volume, modulated by fader
                        
                        // Fuzz/Distortion setup
                        this.fuzzNode = this.audioContext.createWaveShaper();
                        // Create a non-linear curve for distortion
                        this.fuzzNode.curve = this.makeDistortionCurve(0); // Initialize with no distortion
                        this.fuzzNode.oversample = '4x'; // Higher quality distortion

                        this.fuzzWetGain = this.audioContext.createGain();
                        this.fuzzDryGain = this.audioContext.createGain();
                        this.fuzzWetGain.gain.value = this.morphicState.fuzzAmount;
                        this.fuzzDryGain.gain.value = 1 - this.morphicState.fuzzAmount;

                        // Route drone through dry/wet fuzz mix
                        this.droneMasterGain.connect(this.fuzzDryGain);
                        this.droneMasterGain.connect(this.fuzzWetGain);
                        this.fuzzWetGain.connect(this.fuzzNode);
                        this.fuzzNode.connect(this.analyser); // Fuzz output also goes to analyser
                        this.fuzzDryGain.connect(this.analyser); // Dry drone output also to analyser

                        // Create reverb
                        await this.createReverb();
                        
                        // Create oscillator bank (connected to droneMasterGain initially)
                        this.createOscillatorBank();
                        
                        console.log("AudioContext initialized.");
                    } catch (error) {
                        console.warn('Audio context initialization failed:', error);
                        alert('Audio cannot be started. Please ensure your browser allows autoplay or try refreshing.');
                        return false; // Indicate failure
                    }
                }
                
                // Resume if suspended
                if (this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                    console.log("AudioContext resumed.");
                }

                // Start sequencer if not already running
                if (!this.sequencerInterval) {
                    this.startSequencer();
                }
                return true; // Indicate success
            }

            makeDistortionCurve(amount) {
                const k = typeof amount === 'number' ? amount : 50; // K determines amount of distortion
                const n_samples = 44100;
                const curve = new Float32Array(n_samples);
                const deg = Math.PI / 180;
                for (let i = 0; i < n_samples; i++) {
                    const x = i * 2 / n_samples - 1;
                    curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
                }
                return curve;
            }
            
            async createReverb() {
                const reverbBuffer = this.audioContext.createBuffer(2, this.audioContext.sampleRate * 3, this.audioContext.sampleRate);
                
                for (let channel = 0; channel < reverbBuffer.numberOfChannels; channel++) {
                    const channelData = reverbBuffer.getChannelData(channel);
                    for (let i = 0; i < channelData.length; i++) {
                        channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / channelData.length, 2);
                    }
                }
                
                this.reverb = this.audioContext.createConvolver();
                this.reverb.buffer = reverbBuffer;
                
                const reverbGain = this.audioContext.createGain();
                reverbGain.gain.value = 0.3;
                this.reverb.connect(reverbGain);
                this.reverb.connect(this.analyser); // Reverb output to analyser
            }
            
            createOscillatorBank() {
                const baseFreq = this.morphicState.frequency;
                // Using 5 oscillators for a richer drone
                const frequencies = [baseFreq, baseFreq * 1.5, baseFreq * 2, baseFreq * 0.5, baseFreq * 3];
                
                this.oscillators = []; // Clear previous oscillators if rerunning
                this.filters = [];     // Clear previous filters

                frequencies.forEach((freq, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    const filter = this.audioContext.createBiquadFilter();
                    
                    osc.type = i === 0 ? 'sine' : ['sawtooth', 'triangle', 'square'][i % 3];
                    osc.frequency.value = freq;
                    
                    gain.gain.value = 0.1 / frequencies.length; // Balance initial gain
                    
                    filter.type = 'lowpass';
                    filter.frequency.value = 800 + i * 400;
                    filter.Q.value = this.morphicState.resonance * 10;
                    
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.droneMasterGain); // Connect to drone's master gain
                    
                    osc.start();
                    
                    this.oscillators.push(osc);
                    this.filters.push(filter);
                });
            }
            
            createMorphicField() {
                const geometry = new THREE.PlaneGeometry(20, 20, 128, 128);
                
                const vertexShader = `
                    uniform float time;
                    uniform float intensity;
                    uniform float flow;
                    uniform vec2 mouse;
                    varying vec2 vUv;
                    varying vec3 vPosition;
                    varying float vDistortion;
                    
                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        
                        float dist = distance(uv, mouse);
                        float wave = sin(dist * 15.0 - time * 2.0) * 0.1;
                        float ripple = sin(length(pos.xy) * 8.0 - time * 3.0) * 0.05;
                        
                        float morphic = sin(pos.x * 4.0 + time * flow) * 
                                       cos(pos.y * 3.0 + time * flow * 0.7) * intensity * 0.3;
                        
                        pos.z += wave + ripple + morphic;
                        vDistortion = abs(wave + ripple + morphic);
                        vPosition = pos;
                        
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `;
                
                const fragmentShader = `
                    uniform float time;
                    uniform float bloom;
                    uniform float harmonic;
                    uniform vec2 mouse; // Added mouse uniform for visual feedback
                    uniform float audioLevel;
                    varying vec2 vUv;
                    varying vec3 vPosition;
                    varying float vDistortion;
                    
                    vec3 hsv2rgb(vec3 c) {
                        vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                        vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                        return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
                    }
                    
                    void main() {
                        vec2 center = vUv - 0.5;
                        float dist = length(center);
                        
                        float hue = time * 0.1 + dist * 2.0 + vDistortion * 5.0 + audioLevel * 0.5;
                        float sat = 0.7 + sin(time * 0.5 + dist * 10.0) * 0.3;
                        // Ensure a baseline brightness for visibility
                        float brightness = bloom * (0.3 + vDistortion * 2.0 + audioLevel * 0.4); 
                        brightness = max(0.1, brightness); // Ensure minimum brightness
                        
                        vec3 color = hsv2rgb(vec3(hue, sat, brightness));
                        
                        // Add visual cursor glow
                        float cursorDist = distance(vUv, mouse);
                        float cursorGlow = smoothstep(0.1, 0.0, cursorDist) * (0.5 + audioLevel * 1.0); // Glow where mouse is
                        color += vec3(0.1, 0.2, 0.3) * cursorGlow; // Add a subtle blueish glow
                        
                        float alpha = 0.8 - dist * 0.5 + vDistortion + audioLevel * 0.2;
                        alpha *= smoothstep(1.5, 0.0, dist);
                        alpha += cursorGlow * 0.5; // Make the cursor area more opaque
                        
                        gl_FragColor = vec4(color, alpha);
                    }
                `;
                
                const material = new THREE.ShaderMaterial({
                    vertexShader,
                    fragmentShader,
                    uniforms: {
                        time: { value: 0 },
                        intensity: { value: this.morphicState.intensity },
                        flow: { value: this.morphicState.flow },
                        bloom: { value: this.morphicState.bloom },
                        harmonic: { value: this.morphicState.harmonic },
                        mouse: { value: new THREE.Vector2(0.5, 0.5) }, // Initialize mouse uniform
                        audioLevel: { value: 0 }
                    },
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });
                
                this.fieldMesh = new THREE.Mesh(geometry, material);
                this.scene.add(this.fieldMesh);
                
                // Add particle system
                this.createParticleField();
            }
            
            createParticleField() {
                const particleCount = 1000;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);
                
                for (let i = 0; i < particleCount * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 20;
                    positions[i + 1] = (Math.random() - 0.5) * 20;
                    positions[i + 2] = (Math.random() - 0.5) * 10;
                    
                    colors[i] = 0.1 + Math.random() * 0.2;
                    colors[i + 1] = 0.5 + Math.random() * 0.5;
                    colors[i + 2] = 0.8 + Math.random() * 0.2;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                
                const material = new THREE.PointsMaterial({
                    size: 0.05,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending
                });
                
                this.particles = new THREE.Points(geometry, material);
                this.scene.add(this.particles);
            }
            
            // ==================== Sequencer UI & Logic ====================
            setupSequencerUI() {
                const seq = document.getElementById('seq');
                seq.innerHTML = ''; // Clear any existing elements
                for (let x = 0; x < 8; x++) {
                    for (let y = 0; y < 4; y++) {
                        const div = document.createElement('div');
                        div.classList.add('step');
                        div.dataset.x = x;
                        div.dataset.y = y;
                        // Use provided chunkier symbols
                        div.textContent = '░'; // Default inactive symbol
                        div.onclick = (event) => {
                            // Only toggle if UI is visible and not part of a multi-touch gesture
                            if (this.uiVisible && (!event.touches || event.touches.length === 1)) {
                                this.steps[x][y] = !this.steps[x][y];
                                div.classList.toggle('active', this.steps[x][y]);
                                div.textContent = this.steps[x][y] ? '▓' : '░'; // Active symbol
                                this.updateStateInURL(); // Save state on click
                            }
                        };
                        seq.appendChild(div);
                    }
                }
            }

            // Updates the visual state of the sequencer UI elements based on this.steps array
            updateSequencerUI() {
                for (let x = 0; x < 8; x++) {
                    for (let y = 0; y < 4; y++) {
                        const div = document.querySelector(`#seq .step[data-x="${x}"][data-y="${y}"]`);
                        if (div) {
                            div.classList.toggle('active', this.steps[x][y]);
                            div.textContent = this.steps[x][y] ? '▓' : '░'; // Active symbol
                        }
                    }
                }
            }
            
            setupControlsUI() {
                const fuzzSlider = document.getElementById('fuzz-mix-slider');
                fuzzSlider.addEventListener('input', (e) => {
                    this.morphicState.fuzzAmount = parseFloat(e.target.value);
                    if (this.fuzzNode) {
                        // Update fuzz distortion curve and dry/wet gains
                        this.fuzzNode.curve = this.makeDistortionCurve(this.morphicState.fuzzAmount * 100);
                        this.fuzzDryGain.gain.value = 1 - this.morphicState.fuzzAmount;
                        this.fuzzWetGain.gain.value = this.morphicState.fuzzAmount;
                    }
                    this.updateStateInURL();
                });
            }

            updateControlsUI() {
                document.getElementById('bpm-display').textContent = this.bpm;
                document.getElementById('fuzz-mix-slider').value = this.morphicState.fuzzAmount;
            }

            startSequencer() {
                if (this.sequencerInterval) {
                    clearInterval(this.sequencerInterval); // Clear any existing interval
                }
                
                this.nextStepTime = this.audioContext.currentTime;
                
                // Use setInterval for scheduling, requestAnimationFrame for visuals
                this.sequencerInterval = setInterval(() => {
                    // Look ahead to schedule events
                    const now = this.audioContext.currentTime;
                    if (now + 0.1 > this.nextStepTime) { // Schedule if next step is within 100ms
                        this.playStep(this.currentStep);
                        this.nextStepTime += this.secondsPerStep;
                        this.currentStep = (this.currentStep + 1) % 8;
                    }
                }, 25); // Check every 25ms (for 100ms lookahead)
            }
            
            playStep(step) {
                // Remove 'playing' class from all steps, then add to current column
                document.querySelectorAll('.step.playing').forEach(el => el.classList.remove('playing'));
                
                for (let y = 0; y < 4; y++) {
                    const el = document.querySelector(`#seq .step[data-x="${step}"][data-y="${y}"]`);
                    if (el) {
                        el.classList.add('playing');
                        
                        if (this.steps[step][y]) {
                            // Trigger actions for each active row/effect type
                            switch(y) {
                                case 0: this.triggerPulse(); break;
                                case 1: this.bumpIntensity(); break;
                                case 2: this.shiftBloom(); break;
                                case 3: this.grainGlitch(); break;
                            }
                        }
                    }
                }
            }
            
            triggerPulse() {
                // Visual feedback: brief intensity surge
                const oldIntensity = this.morphicState.intensity;
                this.morphicState.intensity = 1; 
                setTimeout(() => { this.morphicState.intensity = oldIntensity; }, 100);

                // Audio feedback: brief frequency shift or volume bump on drone
                if (this.oscillators.length > 0 && this.audioContext) {
                    const now = this.audioContext.currentTime;
                    // Briefly shift base frequency
                    this.oscillators[0].frequency.setTargetAtTime(this.morphicState.frequency * 1.05, now, 0.01);
                    this.oscillators[0].frequency.setTargetAtTime(this.morphicState.frequency, now + 0.05, 0.05);
                }
            }
            
            bumpIntensity() {
                // Visual feedback: permanent intensity increase
                this.morphicState.intensity = Math.min(1, this.morphicState.intensity + 0.2);
                
                // Audio feedback: drone filter sweep
                if (this.filters.length > 0 && this.audioContext) {
                    const now = this.audioContext.currentTime;
                    this.filters.forEach(filter => {
                        const originalFreq = filter.frequency.value;
                        filter.frequency.setTargetAtTime(originalFreq * 1.5, now, 0.01); // Bump filter cutoff up
                        filter.frequency.setTargetAtTime(originalFreq, now + 0.2, 0.05); // Return to original
                    });
                }
            }
            
            shiftBloom() {
                // Visual feedback: randomize bloom amount
                this.morphicState.bloom = 0.3 + Math.random() * 0.7; 
            }
            
            grainGlitch() {
                // Visual feedback: brief distortion on canvas (e.g. increase shader intensity)
                const oldFlow = this.morphicState.flow;
                this.morphicState.flow = oldFlow * 2; // Make flow jump
                setTimeout(() => { this.morphicState.flow = oldFlow; }, 100);

                // Audio feedback: burst of fuzz/distortion
                if (this.fuzzWetGain && this.audioContext) {
                    const now = this.audioContext.currentTime;
                    const currentFuzzAmount = this.morphicState.fuzzAmount;

                    // Briefly ramp fuzz to max and back
                    this.fuzzWetGain.gain.cancelScheduledValues(now);
                    this.fuzzWetGain.gain.setValueAtTime(currentFuzzAmount, now);
                    this.fuzzWetGain.gain.linearRampToValueAtTime(1.0, now + 0.005); // Quick spike
                    this.fuzzWetGain.gain.linearRampToValueAtTime(currentFuzzAmount, now + 0.15); // Return to normal
                }
            }
            
            changeBPM(delta) {
                this.bpm = Math.max(60, Math.min(240, this.bpm + delta)); // Wider BPM range
                this.secondsPerStep = (60/this.bpm)/4; // Keep as 16th notes
                document.getElementById('bpm-display').textContent = this.bpm;
                this.updateStateInURL(); // Save new BPM
            }
            
            // ==================== UI Visibility & Interaction ====================
            toggleUI(forceVisibility = null) {
                this.uiVisible = (forceVisibility !== null) ? forceVisibility : !this.uiVisible;
                const seq = document.getElementById('seq');
                const controls = document.getElementById('controls');
                const canvas = document.getElementById('canvas');

                if (this.uiVisible) {
                    seq.classList.remove('hidden');
                    controls.classList.remove('hidden');
                    canvas.style.opacity = '0.7'; /* Dim canvas slightly */
                } else {
                    seq.classList.add('hidden');
                    controls.classList.add('hidden');
                    canvas.style.opacity = '1.0'; /* Full opacity for canvas */
                }
            }
            
            setupInteraction() {
                const canvas = document.getElementById('canvas');
                
                const handleStart = async (e) => { // Made async to await setupAudio
                    const audioReady = await this.setupAudio(); // Ensure audio is ready
                    if (!audioReady) return; // If audio failed, stop interaction

                    // Check for shift+click (desktop) or two-finger tap (mobile) to toggle UI
                    // Prevent default behavior for these specific gestures
                    if (e.shiftKey || (e.touches && e.touches.length === 2)) {
                        this.toggleUI();
                        return;
                    }
                    
                    this.mouse.down = true;
                    this.updateMouse(e); // Update mouse position and shader uniform
                };
                
                const handleMove = (e) => {
                    this.updateMouse(e); // Always update mouse position for cursor glow
                    if (this.mouse.down) {
                        this.updateMorphicState(e);
                    }
                };
                
                const handleEnd = () => {
                    this.mouse.down = false;
                };
                
                // Mouse events
                canvas.addEventListener('mousedown', handleStart);
                canvas.addEventListener('mousemove', handleMove);
                canvas.addEventListener('mouseup', handleEnd);
                canvas.addEventListener('mouseleave', handleEnd); // Treat leaving canvas as mouseup
                
                // Touch events
                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault(); // Prevent default browser gestures (scrolling, zooming)
                    handleStart(e); // Pass full event to handleStart for touch count and shift key
                }, { passive: false }); // `passive: false` allows `preventDefault`

                canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (e.touches.length > 0) { // Ensure there's a touch object
                        handleMove(e.touches[0]); 
                    }
                }, { passive: false });

                canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    handleEnd();
                }, { passive: false });

                // Add event listener for the fuzz mix slider directly as a DOM element,
                // as its setup is in setupControlsUI
                const fuzzMixSlider = document.getElementById('fuzz-mix-slider');
                if (fuzzMixSlider) {
                    fuzzMixSlider.addEventListener('input', (e) => {
                        this.morphicState.fuzzAmount = parseFloat(e.target.value);
                        if (this.fuzzNode) {
                            this.fuzzNode.curve = this.makeDistortionCurve(this.morphicState.fuzzAmount * 100);
                            this.fuzzDryGain.gain.value = 1 - this.morphicState.fuzzAmount;
                            this.fuzzWetGain.gain.value = this.morphicState.fuzzAmount;
                        }
                        this.updateStateInURL();
                    });
                }
            }
            
            updateMouse(e) {
                const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
                const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

                this.mouse.x = clientX / window.innerWidth;
                this.mouse.y = 1 - clientY / window.innerHeight; // Invert Y for UV coordinates

                // Update the shader uniform for mouse position (cursor glow)
                if (this.fieldMesh) {
                    this.fieldMesh.material.uniforms.mouse.value.set(this.mouse.x, this.mouse.y);
                }
            }
            
            updateMorphicState(e) {
                const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
                const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

                const x = clientX / window.innerWidth;
                const y = 1 - clientY / window.innerHeight;
                
                this.morphicState.masterVolume = y; // Y controls overall volume
                this.morphicState.frequency = 100 + x * 400; // X controls base drone frequency
                this.morphicState.resonance = Math.sin(this.time * 0.01 + x * Math.PI) * 0.5 + 0.5; // X influences resonance
                this.morphicState.bloom = 0.3 + y * 0.7; // Y influences visual bloom
                this.morphicState.flow = x * 2; // X influences visual flow
                this.morphicState.harmonic = Math.cos(this.time * 0.005 + y * Math.PI) * 0.5 + 0.5; // Y influences harmonic content
                
                this.updateAudio();
                this.updateStateInURL();
            }
            
            updateAudio() {
                if (!this.audioContext || this.oscillators.length === 0) return;
                
                // Update master volume
                this.masterGain.gain.setTargetAtTime(this.morphicState.masterVolume, this.audioContext.currentTime, 0.1);

                const baseFreq = this.morphicState.frequency;
                const frequencies = [baseFreq, baseFreq * 1.5, baseFreq * 2, baseFreq * 0.5, baseFreq * 3];
                
                this.oscillators.forEach((osc, i) => {
                    osc.frequency.setTargetAtTime(frequencies[i], this.audioContext.currentTime, 0.1);
                });
                
                this.filters.forEach(filter => {
                    filter.frequency.setTargetAtTime(
                        200 + this.morphicState.intensity * 1000, /* Note: This intensity is from sequencer pulses, not masterVolume */
                        this.audioContext.currentTime,
                        0.1
                    );
                    filter.Q.setTargetAtTime(
                        this.morphicState.resonance * 15 + 1,
                        this.audioContext.currentTime,
                        0.1
                    );
                });
            }
            
            animate() {
                requestAnimationFrame(() => this.animate());
                
                this.time += 0.016; // Time for animations

                // Update audio analysis (for visual feedback)
                let audioLevel = 0;
                if (this.analyser && this.frequencyData) {
                    this.analyser.getByteFrequencyData(this.frequencyData);
                    audioLevel = this.frequencyData.reduce((sum, value) => sum + value, 0) / (this.frequencyData.length * 255);
                }
                
                // Update field mesh uniforms
                if (this.fieldMesh) {
                    const uniforms = this.fieldMesh.material.uniforms;
                    uniforms.time.value = this.time;
                    uniforms.intensity.value = this.morphicState.intensity;
                    uniforms.flow.value = this.morphicState.flow;
                    uniforms.bloom.value = this.morphicState.bloom;
                    uniforms.harmonic.value = this.morphicState.harmonic;
                    // uniforms.mouse.value is updated in updateMouse()
                    uniforms.audioLevel.value = audioLevel;
                    
                    this.fieldMesh.rotation.z = this.time * 0.01;
                }
                
                // Update particles
                if (this.particles) {
                    const positions = this.particles.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i + 2] += Math.sin(this.time * 0.01 + i) * 0.01;
                        positions[i] += Math.cos(this.time * 0.005 + i) * 0.005;
                    }
                    this.particles.geometry.attributes.position.needsUpdate = true;
                    this.particles.rotation.y = this.time * 0.005;
                }
                
                // Auto-evolve when not interacting to keep it dynamic
                if (!this.mouse.down) {
                    this.morphicState.flow = 0.6 + Math.sin(this.time * 0.003) * 0.4;
                    this.morphicState.harmonic = 0.4 + Math.cos(this.time * 0.002) * 0.3;
                    this.updateAudio(); // Update audio parameters for auto-evolution
                }
                
                this.renderer.render(this.scene, this.camera);
            }
            
            // ==================== State Serialization ====================
            updateStateInURL() {
                const state = {
                    morphicState: this.morphicState,
                    steps: this.steps, // Save sequencer steps
                    bpm: this.bpm,     // Save BPM
                    uiVisible: this.uiVisible // Save UI visibility
                };
                try {
                    const encoded = btoa(JSON.stringify(state));
                    window.location.hash = encoded;
                } catch (error) {
                    console.warn('Failed to update URL state (likely too large or malformed):', error);
                }
            }
            
            loadStateFromURL() {
                try {
                    if (window.location.hash) {
                        const state = JSON.parse(atob(window.location.hash.slice(1)));
                        
                        // Load morphic state
                        if (state.morphicState) {
                            Object.assign(this.morphicState, state.morphicState);
                            this.updateAudio(); // Apply loaded audio parameters
                            
                            // Re-apply fuzz curve if fuzzNode exists
                            if (this.fuzzNode && this.morphicState.fuzzAmount !== undefined) {
                                this.fuzzNode.curve = this.makeDistortionCurve(this.morphicState.fuzzAmount * 100);
                                this.fuzzDryGain.gain.value = 1 - this.morphicState.fuzzAmount;
                                this.fuzzWetGain.gain.value = this.morphicState.fuzzAmount;
                            }
                        }
                        
                        // Load sequencer steps
                        if (state.steps && Array.isArray(state.steps) && state.steps.length === 8 && Array.isArray(state.steps[0]) && state.steps[0].length === 4) {
                            this.steps = state.steps;
                        } else {
                            console.warn('Invalid sequencer steps in URL hash, reverting to default.');
                            this.steps = Array(8).fill().map(() => Array(4).fill(false)); // Reset to default
                        }

                        // Load BPM
                        if (typeof state.bpm === 'number' && state.bpm >= 60 && state.bpm <= 240) {
                            this.bpm = state.bpm;
                            this.secondsPerStep = (60 / this.bpm) / 4;
                        } else {
                            console.warn('Invalid BPM in URL hash, reverting to default.');
                            this.bpm = 120;
                            this.secondsPerStep = (60 / this.bpm) / 4;
                        }

                        // Load UI visibility
                        if (typeof state.uiVisible === 'boolean') {
                            this.uiVisible = state.uiVisible;
                        }

                        this.updateSequencerUI(); // Update UI based on loaded steps
                        this.updateControlsUI();   // Update controls UI
                    }
                } catch (error) {
                    console.warn('Failed to load state from URL:', error);
                    // Reset to initial defaults if parsing fails
                    this.morphicState = {
                        masterVolume: 0.5, frequency: 220, resonance: 0.7,
                        bloom: 0.8, flow: 0.6, harmonic: 0.4, fuzzAmount: 0.0
                    };
                    this.steps = Array(8).fill().map(() => Array(4).fill(false));
                    this.bpm = 120;
                    this.secondsPerStep = (60 / this.bpm) / 4;
                    this.uiVisible = true;

                    this.updateAudio(); // Apply default audio parameters
                    this.updateSequencerUI();
                    this.updateControlsUI();
                }
            }
        }
        
        // Initialize the portal
        let portal; // Make it global so HTML buttons can access it
        window.addEventListener('load', () => {
            portal = new MorphicFieldPortal();
        });
    </script>
</body>
