<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RFT – Media for Thinking the Unthinkable</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#eee;font-family:"Inter",system-ui;overflow:hidden}
  #topBar{position:absolute;top:0;left:0;right:0;height:44px;background:#111;display:flex;align-items:center;padding:0 12px;gap:12px;z-index:10}
  #scaleLabel{font-size:12px;color:#0ff}
  #timeSlider{-webkit-appearance:none;height:4px;background:#222;border-radius:2px;width:120px}
  #timeSlider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#0ff;border-radius:50%}
  #mainCanvas{position:absolute;top:44px;left:0;right:0;bottom:0}
  #sidePanel{position:absolute;top:44px;right:0;width:320px;bottom:0;background:#111;border-left:1px solid #333;display:flex;flex-direction:column;font-size:11px}
  #sidePanel h3{margin:8px 0 4px;color:#0ff;font-size:12px}
  #sidePanel label{display:block;margin:3px 0}
  #sidePanel input[type=range]{width:100%}
  #sidePanel input[type=number]{width:60px;background:#222;border:none;color:#fff;padding:2px}
  #equationBox{font-family:"JetBrains Mono",monospace;background:#000;padding:6px;border:1px solid #333;border-radius:4px;margin-bottom:8px}
  #dashboard{position:absolute;top:44px;left:0;right:320px;bottom:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:#111}
  .dashPane{background:#000;display:flex;align-items:center;justify-content:center;position:relative;font-size:13px;color:#0ff}
  .dashPane canvas{width:100%;height:100%;display:block}
  .dashPane .label{position:absolute;top:2px;left:4px;font-size:10px;background:#000a;padding:2px 4px;border-radius:3px}
  #audioToggle{position:absolute;bottom:8px;right:330px;background:#222;color:#0ff;border:none;padding:4px 8px;border-radius:4px;font-size:11px;cursor:pointer}
  #exportBtn{position:absolute;bottom:8px;right:390px;background:#222;color:#0ff;border:none;padding:4px 8px;border-radius:4px;font-size:11px;cursor:pointer}
</style>
</head>
<body>

<div id="topBar">
  <span id="scaleLabel">Scale: Quantum</span>
  <input id="timeSlider" type="range" min="0" max="100" value="50">
  <button id="recordBtn">Record</button>
  <button id="ghostBtn">Ghost</button>
  <button id="resetBtn">Reset</button>
</div>

<div id="dashboard">
  <div class="dashPane" id="quantumPane">
    <span class="label">Quantum</span>
    <canvas id="quantumCanvas"></canvas>
  </div>
  <div class="dashPane" id="gravityPane">
    <span class="label">Gravity</span>
    <canvas id="gravityCanvas"></canvas>
  </div>
  <div class="dashPane" id="cosmicPane">
    <span class="label">Cosmic</span>
    <canvas id="cosmicCanvas"></canvas>
  </div>
  <div class="dashPane" id="cognitionPane">
    <span class="label">Cognition</span>
    <canvas id="cognitionCanvas"></canvas>
  </div>
</div>

<div id="sidePanel">
  <div style="padding:8px;overflow-y:auto;flex:1">
    <h3>Field Controls</h3>
    <label>Energy (E): <span id="eVal">1.0</span>
      <input id="eSlider" type="range" min="0" max="10" step="0.05" value="1">
    </label>
    <label>Chiral Factor (X): <span id="xVal">1.0</span>
      <input id="xSlider" type="range" min="-2" max="2" step="0.01" value="1">
    </label>

    <h3>Mass & Gravity</h3>
    <label>Mass Threshold: <input id="massThr" type="number" value="0.75" step="0.05"></label>

    <h3>Equations (live)</h3>
    <div id="equationBox">
      M = E·X² = <span id="massOut">1.00</span><br>
      g = ∇φ(X)<br>
      Ψ̇ = (H + Xₓ)Ψ
    </div>

    <h3>Resonance Templates</h3>
    <button onclick="loadTemplate('electron')">Electron</button>
    <button onclick="loadTemplate('muon')">Muon</button>
    <button onclick="loadTemplate('neutrino')">Neutrino</button>

    <h3>Prime Gap Navigator</h3>
    <button onclick="jumpPrimeGap()">Jump</button>

    <h3>Scenario</h3>
    <button onclick="exportState()">Export JSON</button>
    <input type="file" accept=".json" onchange="importState(event)">
  </div>
</div>

<button id="audioToggle">🔊 Audio Off</button>
<button id="exportBtn">📸 Screenshot</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

/* ---------- AUDIO sensory mapping ---------- */
let audioCtx, osc, gain;
function toggleAudio(){
  const btn = document.getElementById('audioToggle');
  if(!audioCtx){audioCtx=new(window.AudioContext||webkitAudioContext)();}
  if(!osc){
    osc = audioCtx.createOscillator();
    gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type='sine'; gain.gain.value=0.05; osc.start();
  }
  if(btn.textContent.includes('Off')){
    gain.connect(audioCtx.destination);
    btn.textContent='🔊 Audio On';
  }else{
    gain.disconnect();
    btn.textContent='🔊 Audio Off';
  }
}
document.getElementById('audioToggle').onclick=toggleAudio;

/* ---------- GLOBAL ---------- */
const params = {E:1, X:1, massThr:0.75, scale:1, time:0};
const record = {snapshots:[], ghost:false};
const templates = {electron:{E:1,X:1}, muon:{E:2.2,X:1}, neutrino:{E:0.2,X:0.5}};
let canvases={}, scenes={}, cameras={}, renderers={};

/* ---------- INIT DASHBOARD CANVASES ---------- */
['quantum','gravity','cosmic','cognition'].forEach(key=>{
  const cv = document.getElementById(key+'Canvas');
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(45,1,0.1,100);
  cam.position.set(0,0,4);
  const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true});
  renderer.setSize(cv.clientWidth,cv.clientHeight);
  scenes[key]=scene; cameras[key]=cam; renderers[key]=renderer;
});
/* add simple content to each pane */
const geo = new THREE.SphereGeometry(1,32,16);
['quantum','gravity','cosmic','cognition'].forEach((k,i)=>{
  const mat = new THREE.MeshBasicMaterial({color:[0xff00ff,0x00ffff,0xffff00,0x00ff00][i],wireframe:true});
  scenes[k].add(new THREE.Mesh(geo,mat));
});

/* ---------- MAIN 3D FIELD ---------- */
const mainCV = document.createElement('canvas');
mainCV.id='mainCanvas';
document.body.appendChild(mainCV);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, mainCV.clientWidth/mainCV.clientHeight, 0.1, 1000);
camera.position.set(0,3,6);
const renderer = new THREE.WebGLRenderer({canvas:mainCV, antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
const controls = new OrbitControls(camera, mainCV);
controls.enableDamping = true;

/* --- CHIRAL FIELD MESH --- */
const SIZE = 128;
const field = new Float32Array(SIZE*SIZE*4);
const dataTex = new THREE.DataTexture(field, SIZE, SIZE, THREE.RGBAFormat, THREE.FloatType);
const planeGeo = new THREE.PlaneGeometry(10,10,SIZE-1,SIZE-1);
const planeMat = new THREE.ShaderMaterial({
  uniforms:{u_field:{value:dataTex},u_time:{value:0}},
  vertexShader:`
    varying vec2 v_uv;
    void main(){v_uv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D u_field; uniform float u_time;
    varying vec2 v_uv;
    void main(){
      vec4 d=texture2D(u_field,v_uv);
      vec3 c=0.5+0.5*cos(d.x+vec3(0,2,4));
      gl_FragColor=vec4(c*d.y,1.0);
    }`
});
const plane = new THREE.Mesh(planeGeo, planeMat);
plane.rotation.x=-Math.PI/2;
scene.add(plane);

/* --- PARTICLES --- */
const particleGeo = new THREE.SphereGeometry(0.15,16,16);
const particleMat = new THREE.MeshBasicMaterial({color:0x00ffff});
const particles = [];
function spawnParticle(x,z){
  const m=new THREE.Mesh(particleGeo,particleMat);
  m.position.set(x,0,z);
  scene.add(m); particles.push(m);
}

/* --- FIELD UPDATE --- */
function updateField(dt){
  let idx=0;
  for(let i=0;i<SIZE;i++){
    for(let j=0;j<SIZE;j++){
      const x=(i/SIZE-0.5)*10, z=(j/SIZE-0.5)*10;
      const r=Math.sqrt(x*x+z*z);
      const phase = r*3 - params.time*params.E*params.X;
      const amp = Math.exp(-r*0.3)*params.E;
      field[idx++]=phase;
      field[idx++]=Math.min(amp,1);
      field[idx++]=0;
      field[idx++]=1;
      if(amp>params.massThr && Math.random()<0.001 && particles.length<30){
        spawnParticle(x,z);
      }
    }
  }
  dataTex.needsUpdate=true;
  if(osc) osc.frequency.value = 220 + 440*Math.abs(params.X);
}

/* --- UI BINDINGS --- */
['eSlider','xSlider','massThr'].forEach(id=>{
  const el=document.getElementById(id);
  const key=id.replace('Slider','').replace('mass','massThr');
  el.oninput=e=>{
    params[key]=parseFloat(e.target.value);
    document.getElementById(key.replace('mass','mass')+'Val').textContent=params[key].toFixed(2);
    document.getElementById('massOut').textContent=(params.E*params.X*params.X).toFixed(2);
  };
});

/* --- MULTI-SCALE NAV --- */
let scale=1;
mainCV.addEventListener('wheel',e=>{
  scale *= e.deltaY>0?1.2:0.8;
  camera.position.multiplyScalar(scale<0.05?1:scale>500?1:1/scale);
  const labels=["Planck","Quantum","Atomic","Molecular","Human","Planetary","Stellar","Galactic","Cosmic"];
  const idx=Math.floor(Math.log2(scale)*2+4);
  document.getElementById('scaleLabel').textContent="Scale: "+labels[Math.min(Math.max(idx,0),labels.length-1)];
});

/* --- TEMPLATES / PRIME GAPS --- */
function loadTemplate(name){
  const t=templates[name];
  document.getElementById('eSlider').value=t.E;
  document.getElementById('xSlider').value=t.X;
  params.E=t.E; params.X=t.X;
  document.getElementById('eVal').textContent=t.E.toFixed(2);
  document.getElementById('xVal').textContent=t.X.toFixed(2);
  document.getElementById('massOut').textContent=(t.E*t.X*t.X).toFixed(2);
}
const primes=[2,3,5,7,11,13,17,19,23];
let primeIdx=0;
function jumpPrimeGap(){
  primeIdx=(primeIdx+1)%primes.length;
  const x=primes[primeIdx]*0.1;
  document.getElementById('xSlider').value=x;
  params.X=x;
  document.getElementById('xVal').textContent=x.toFixed(2);
  document.getElementById('massOut').textContent=(params.E*x*x).toFixed(2);
}

/* --- RECORD / GHOST / RESET --- */
document.getElementById('recordBtn').onclick=()=>{
  record.snapshots.push(JSON.stringify({params,particles:particles.map(p=>p.position.toArray())}));
  console.log('recorded');
};
document.getElementById('ghostBtn').onclick=()=>{
  record.ghost=!record.ghost;
  const ghostMat=new THREE.MeshBasicMaterial({color:0xff00ff,transparent:true,opacity:0.3,wireframe:true});
  if(record.ghost && record.snapshots.length){
    const snap=JSON.parse(record.snapshots[0]);
    snap.particles.forEach(pos=>{
      const m=new THREE.Mesh(particleGeo,ghostMat);
      m.position.fromArray(pos);
      scene.add(m);
    });
  }
};
document.getElementById('resetBtn').onclick=()=>{params.E=1;params.X=1;particles.forEach(p=>scene.remove(p));particles.length=0;};

/* --- EXPORT JSON / SCREENSHOT --- */
function exportState(){
  const blob=new Blob([JSON.stringify(params)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='rft_state.json';
  a.click();
}
function importState(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{Object.assign(params,JSON.parse(ev.target.result));};
  reader.readAsText(file);
}
document.getElementById('exportBtn').onclick=()=>{
  renderer.render(scene,camera);
  mainCV.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='rft_snapshot.png';
    a.click();
  });
};

/* --- RENDER LOOP --- */
let last=0;
function animate(now){
  requestAnimationFrame(animate);
  const dt=(now-last)*0.001; last=now;
  params.time+=dt;
  controls.update();
  updateField(dt);
  renderer.setSize(mainCV.clientWidth,mainCV.clientHeight);
  camera.aspect=mainCV.clientWidth/mainCV.clientHeight;
  camera.updateProjectionMatrix();
  renderer.render(scene,camera);
  /* dashboard mini-panes */
  ['quantum','gravity','cosmic','cognition'].forEach((k,i)=>{
    const cam=cameras[k], rend=renderers[k];
    rend.setSize(rend.domElement.clientWidth,rend.domElement.clientHeight);
    cam.aspect=1; cam.updateProjectionMatrix();
    scenes[k].rotation.y=params.time*0.2*(i+1);
    rend.render(scenes[k],cam);
  });
}
animate(0);
window.addEventListener('resize',()=>{
  renderer.setSize(mainCV.clientWidth,mainCV.clientHeight);
});
</script>
</body>
</html>
