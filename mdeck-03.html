<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living Morphic Field Resonance Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            cursor: none; /* Hide default cursor */
            touch-action: none; /* Prevent browser gestures like pull-to-refresh */
            font-family: 'Courier New', monospace;
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.3);
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
        }
        
        #seq {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(8, 30px);
            grid-gap: 4px;
            z-index: 5;
            opacity: 0.9;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(2px); /* Added for better visibility */
            background: rgba(0,0,0,0.2); /* Subtle background */
            padding: 8px;
            border-radius: 8px;
        }
        
        .step {
            width: 30px; 
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            user-select: none;
        }
        
        /* Base colors for rows based on data-y */
        .step[data-y="0"] { background: rgba(255, 0, 150, 0.1); } /* Magenta */
        .step[data-y="1"] { background: rgba(0, 255, 255, 0.1); } /* Cyan */
        .step[data-y="2"] { background: rgba(255, 255, 0, 0.1); } /* Yellow */
        .step[data-y="3"] { background: rgba(150, 255, 0, 0.1); } /* Lime Green */
        
        /* Active colors for rows */
        .step.active[data-y="0"] { background: rgba(255, 0, 150, 0.8); color: #fff; }
        .step.active[data-y="1"] { background: rgba(0, 255, 255, 0.8); color: #000; }
        .step.active[data-y="2"] { background: rgba(255, 255, 0, 0.8); color: #000; }
        .step.active[data-y="3"] { background: rgba(150, 255, 0, 0.8); color: #000; }
        
        /* Playing indicator */
        .step.playing { 
            box-shadow: 0 0 15px currentColor;
            transform: scale(1.1);
            border-color: #fff; /* White border on playing step */
        }
        
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 5;
            color: rgba(255,255,255,0.6);
            font-family: monospace;
            font-size: 12px;
            backdrop-filter: blur(2px); /* Added for better visibility */
            background: rgba(0,0,0,0.2); /* Subtle background */
            padding: 8px;
            border-radius: 8px;
        }
        
        .bpm-control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .bpm-btn {
            width: 20px;
            height: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 2px;
        }
        .bpm-btn:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="loading" id="loading">Initializing Morphic Field...</div>
    
    <div id="seq"></div>
    
    <div id="controls">
        <div class="bpm-control">
            <button class="bpm-btn" onclick="portal.changeBPM(-5)">-</button>
            <span id="bpm-display">120</span> <!-- Default BPM display -->
            <button class="bpm-btn" onclick="portal.changeBPM(5)">+</button>
            <span>BPM</span>
        </div>
        <div>SHIFT+CLICK / Two-finger tap: Toggle UI</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        class MorphicFieldPortal {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.audioContext = null;
                this.masterGain = null;
                this.reverb = null;
                this.oscillators = [];
                this.filters = [];
                this.analyser = null;
                this.frequencyData = null;
                
                this.mouse = { x: 0, y: 0, down: false };
                this.morphicState = {
                    intensity: 0.5,
                    frequency: 220,
                    resonance: 0.7,
                    bloom: 0.8,
                    flow: 0.6,
                    harmonic: 0.4
                };
                
                this.fieldMesh = null;
                this.time = 0;
                
                // Sequencer properties
                // 8 columns (steps), 4 rows (triggers/effects)
                this.steps = Array(8).fill().map(() => Array(4).fill(false)); 
                this.currentStep = 0;
                this.bpm = 120; // Default BPM
                this.secondsPerStep = (60 / this.bpm) / 4; // Each step is a 16th note
                this.nextStepTime = 0;
                this.sequencerInterval = null; // To hold interval ID for stopping/starting
                this.sequencerVisible = true; // Initial visibility of UI
                
                this.init();
            }
            
            init() {
                this.setupThreeJS();
                // Audio context setup and startSequencer moved to be triggered by user interaction
                this.createMorphicField();
                this.setupSequencerUI(); // Setup the DOM elements for sequencer
                this.loadStateFromURL(); // Load state (including steps and BPM)
                this.updateSequencerUI(); // Update UI based on loaded state
                
                this.setupInteraction(); // Set up event listeners
                // this.startSequencer(); // DON'T start here, audioContext might be suspended
                this.animate();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('bpm-display').textContent = this.bpm; // Update BPM display on load
            }
            
            setupThreeJS() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ 
                    canvas: document.getElementById('canvas'),
                    antialias: true,
                    alpha: true
                });
                
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                
                this.camera.position.z = 5;
                
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }
            
            async setupAudio() {
                // Only create AudioContext if it doesn't exist or is closed
                if (!this.audioContext || this.audioContext.state === 'closed') {
                    try {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        
                        // Master gain
                        this.masterGain = this.audioContext.createGain();
                        this.masterGain.gain.value = 0.3;
                        this.masterGain.connect(this.audioContext.destination);
                        
                        // Analyser for visual feedback
                        this.analyser = this.audioContext.createAnalyser();
                        this.analyser.fftSize = 256;
                        this.frequencyData = new Uint8Array(this.analyser.frequencyBinCount);
                        this.analyser.connect(this.masterGain);
                        
                        // Create reverb
                        await this.createReverb();
                        
                        // Create oscillator bank
                        this.createOscillatorBank();
                        
                        console.log("AudioContext initialized.");
                    } catch (error) {
                        console.warn('Audio context initialization failed:', error);
                        alert('Audio cannot be started. Please ensure your browser allows autoplay or try refreshing.');
                        return false; // Indicate failure
                    }
                }
                
                // Resume if suspended
                if (this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                    console.log("AudioContext resumed.");
                }

                // Start sequencer if not already running
                if (!this.sequencerInterval) {
                    this.startSequencer();
                }
                return true; // Indicate success
            }
            
            async createReverb() {
                const reverbBuffer = this.audioContext.createBuffer(2, this.audioContext.sampleRate * 3, this.audioContext.sampleRate);
                
                for (let channel = 0; channel < reverbBuffer.numberOfChannels; channel++) {
                    const channelData = reverbBuffer.getChannelData(channel);
                    for (let i = 0; i < channelData.length; i++) {
                        channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / channelData.length, 2);
                    }
                }
                
                this.reverb = this.audioContext.createConvolver();
                this.reverb.buffer = reverbBuffer;
                
                const reverbGain = this.audioContext.createGain();
                reverbGain.gain.value = 0.3;
                this.reverb.connect(reverbGain);
                reverbGain.connect(this.analyser);
            }
            
            createOscillatorBank() {
                const baseFreq = this.morphicState.frequency;
                // Using 5 oscillators for a richer drone
                const frequencies = [baseFreq, baseFreq * 1.5, baseFreq * 2, baseFreq * 0.5, baseFreq * 3];
                
                frequencies.forEach((freq, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    const filter = this.audioContext.createBiquadFilter();
                    
                    osc.type = i === 0 ? 'sine' : ['sawtooth', 'triangle', 'square'][i % 3];
                    osc.frequency.value = freq;
                    
                    gain.gain.value = 0.1 / frequencies.length; // Balance initial gain
                    
                    filter.type = 'lowpass';
                    filter.frequency.value = 800 + i * 400;
                    filter.Q.value = this.morphicState.resonance * 10;
                    
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.reverb);
                    gain.connect(this.analyser);
                    
                    osc.start();
                    
                    this.oscillators.push(osc);
                    this.filters.push(filter);
                });
            }
            
            createMorphicField() {
                const geometry = new THREE.PlaneGeometry(20, 20, 128, 128);
                
                const vertexShader = `
                    uniform float time;
                    uniform float intensity;
                    uniform float flow;
                    uniform vec2 mouse;
                    varying vec2 vUv;
                    varying vec3 vPosition;
                    varying float vDistortion;
                    
                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        
                        float dist = distance(uv, mouse);
                        float wave = sin(dist * 15.0 - time * 2.0) * 0.1;
                        float ripple = sin(length(pos.xy) * 8.0 - time * 3.0) * 0.05;
                        
                        float morphic = sin(pos.x * 4.0 + time * flow) * 
                                       cos(pos.y * 3.0 + time * flow * 0.7) * intensity * 0.3;
                        
                        pos.z += wave + ripple + morphic;
                        vDistortion = abs(wave + ripple + morphic);
                        vPosition = pos;
                        
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `;
                
                const fragmentShader = `
                    uniform float time;
                    uniform float bloom;
                    uniform float harmonic;
                    uniform vec2 mouse; // Added mouse uniform for visual feedback
                    uniform float audioLevel;
                    varying vec2 vUv;
                    varying vec3 vPosition;
                    varying float vDistortion;
                    
                    vec3 hsv2rgb(vec3 c) {
                        vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                        vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                        return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
                    }
                    
                    void main() {
                        vec2 center = vUv - 0.5;
                        float dist = length(center);
                        
                        float hue = time * 0.1 + dist * 2.0 + vDistortion * 5.0 + audioLevel * 0.5;
                        float sat = 0.7 + sin(time * 0.5 + dist * 10.0) * 0.3;
                        // Ensure a baseline brightness for visibility
                        float brightness = bloom * (0.3 + vDistortion * 2.0 + audioLevel * 0.4); 
                        brightness = max(0.1, brightness); // Ensure minimum brightness
                        
                        vec3 color = hsv2rgb(vec3(hue, sat, brightness));
                        
                        // Add visual cursor glow
                        float cursorDist = distance(vUv, mouse);
                        float cursorGlow = smoothstep(0.1, 0.0, cursorDist) * (0.5 + audioLevel * 1.0); // Glow where mouse is
                        color += vec3(0.1, 0.2, 0.3) * cursorGlow; // Add a subtle blueish glow
                        
                        float alpha = 0.8 - dist * 0.5 + vDistortion + audioLevel * 0.2;
                        alpha *= smoothstep(1.5, 0.0, dist);
                        alpha += cursorGlow * 0.5; // Make the cursor area more opaque
                        
                        gl_FragColor = vec4(color, alpha);
                    }
                `;
                
                const material = new THREE.ShaderMaterial({
                    vertexShader,
                    fragmentShader,
                    uniforms: {
                        time: { value: 0 },
                        intensity: { value: this.morphicState.intensity },
                        flow: { value: this.morphicState.flow },
                        bloom: { value: this.morphicState.bloom },
                        harmonic: { value: this.morphicState.harmonic },
                        mouse: { value: new THREE.Vector2(0.5, 0.5) }, // Initialize mouse uniform
                        audioLevel: { value: 0 }
                    },
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });
                
                this.fieldMesh = new THREE.Mesh(geometry, material);
                this.scene.add(this.fieldMesh);
                
                // Add particle system
                this.createParticleField();
            }
            
            createParticleField() {
                const particleCount = 1000;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);
                
                for (let i = 0; i < particleCount * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 20;
                    positions[i + 1] = (Math.random() - 0.5) * 20;
                    positions[i + 2] = (Math.random() - 0.5) * 10;
                    
                    colors[i] = Math.random();
                    colors[i + 1] = Math.random();
                    colors[i + 2] = Math.random();
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                
                const material = new THREE.PointsMaterial({
                    size: 0.05,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending
                });
                
                this.particles = new THREE.Points(geometry, material);
                this.scene.add(this.particles);
            }
            
            // ==================== Sequencer UI & Logic ====================
            setupSequencerUI() {
                const seq = document.getElementById('seq');
                seq.innerHTML = ''; // Clear any existing elements
                for (let x = 0; x < 8; x++) {
                    for (let y = 0; y < 4; y++) {
                        const div = document.createElement('div');
                        div.classList.add('step');
                        div.dataset.x = x;
                        div.dataset.y = y;
                        div.textContent = '•'; // Default text
                        div.onclick = () => {
                            this.steps[x][y] = !this.steps[x][y];
                            div.classList.toggle('active', this.steps[x][y]);
                            div.textContent = this.steps[x][y] ? '●' : '•';
                            this.updateStateInURL(); // Save state on click
                        };
                        seq.appendChild(div);
                    }
                }
            }

            // Updates the visual state of the sequencer UI elements based on this.steps array
            updateSequencerUI() {
                for (let x = 0; x < 8; x++) {
                    for (let y = 0; y < 4; y++) {
                        const div = document.querySelector(`#seq .step[data-x="${x}"][data-y="${y}"]`);
                        if (div) {
                            div.classList.toggle('active', this.steps[x][y]);
                            div.textContent = this.steps[x][y] ? '●' : '•';
                        }
                    }
                }
            }
            
            startSequencer() {
                if (this.sequencerInterval) {
                    clearInterval(this.sequencerInterval); // Clear any existing interval
                }
                
                this.nextStepTime = this.audioContext.currentTime;
                
                // Use setInterval for scheduling, requestAnimationFrame for visuals
                this.sequencerInterval = setInterval(() => {
                    // Look ahead to schedule events
                    const now = this.audioContext.currentTime;
                    if (now + 0.1 > this.nextStepTime) { // Schedule if next step is within 100ms
                        this.playStep(this.currentStep);
                        this.nextStepTime += this.secondsPerStep;
                        this.currentStep = (this.currentStep + 1) % 8;
                    }
                }, 25); // Check every 25ms (for 100ms lookahead)
            }
            
            playStep(step) {
                // Remove 'playing' class from all steps, then add to current column
                document.querySelectorAll('.step.playing').forEach(el => el.classList.remove('playing'));
                
                for (let y = 0; y < 4; y++) {
                    const el = document.querySelector(`#seq .step[data-x="${step}"][data-y="${y}"]`);
                    if (el) {
                        el.classList.add('playing');
                        
                        if (this.steps[step][y]) {
                            // Trigger actions for each active row/effect type
                            switch(y) {
                                case 0: this.triggerPulse(); break;
                                case 1: this.bumpIntensity(); break;
                                case 2: this.shiftBloom(); break;
                                case 3: this.grainGlitch(); break;
                            }
                        }
                    }
                }
            }
            
            triggerPulse() {
                const oldIntensity = this.morphicState.intensity;
                this.morphicState.intensity = 1; // Max intensity briefly
                this.updateAudio();
                setTimeout(() => {
                    this.morphicState.intensity = oldIntensity; // Revert
                    this.updateAudio();
                }, 100);
            }
            
            bumpIntensity() {
                this.morphicState.intensity = Math.min(1, this.morphicState.intensity + 0.2);
                this.updateAudio();
            }
            
            shiftBloom() {
                this.morphicState.bloom = 0.3 + Math.random() * 0.7; // Randomize bloom
            }
            
            grainGlitch() {
                if (!this.masterGain || !this.audioContext) return;
                const now = this.audioContext.currentTime;
                // Rapidly dip volume then quickly restore
                this.masterGain.gain.cancelScheduledValues(now);
                this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, now); // Set to current value to prevent clicks
                this.masterGain.gain.linearRampToValueAtTime(0.001, now + 0.005); // Dip to near zero
                this.masterGain.gain.linearRampToValueAtTime(0.3, now + 0.1); // Return to default volume (0.3)
            }
            
            changeBPM(delta) {
                this.bpm = Math.max(60, Math.min(180, this.bpm + delta));
                this.secondsPerStep = (60/this.bpm)/4; // Keep as 16th notes
                document.getElementById('bpm-display').textContent = this.bpm;
                this.updateStateInURL(); // Save new BPM
            }
            
            toggleSequencerUI() { // Renamed to avoid confusion with internal sequencer logic
                this.sequencerVisible = !this.sequencerVisible;
                const seq = document.getElementById('seq');
                const controls = document.getElementById('controls');
                seq.style.opacity = this.sequencerVisible ? '0.9' : '0';
                controls.style.opacity = this.sequencerVisible ? '1' : '0';
            }
            
            // ==================== Interaction Handling ====================
            setupInteraction() {
                const canvas = document.getElementById('canvas');
                
                const handleStart = async (e) => { // Made async to await setupAudio
                    const audioReady = await this.setupAudio(); // Ensure audio is ready
                    if (!audioReady) return; // If audio failed, stop interaction

                    // Check for shift+click (desktop) or two-finger tap (mobile) to toggle UI
                    if (e.shiftKey || (e.touches && e.touches.length === 2)) {
                        this.toggleSequencerUI();
                        return;
                    }
                    
                    this.mouse.down = true;
                    this.updateMouse(e); // Update mouse position and shader uniform
                };
                
                const handleMove = (e) => {
                    this.updateMouse(e); // Always update mouse position for cursor glow
                    if (this.mouse.down) {
                        this.updateMorphicState(e);
                    }
                };
                
                const handleEnd = () => {
                    this.mouse.down = false;
                };
                
                // Mouse events
                canvas.addEventListener('mousedown', handleStart);
                canvas.addEventListener('mousemove', handleMove);
                canvas.addEventListener('mouseup', handleEnd);
                canvas.addEventListener('mouseleave', handleEnd); // Treat leaving canvas as mouseup
                
                // Touch events
                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault(); // Prevent default browser gestures (scrolling, zooming)
                    handleStart(e); // Pass full event to handleStart for touchCount
                }, { passive: false }); // `passive: false` allows `preventDefault`

                canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    handleMove(e.touches[0]); // Pass first touch object
                }, { passive: false });

                canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    handleEnd();
                }, { passive: false });
            }
            
            updateMouse(e) {
                const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
                const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

                this.mouse.x = clientX / window.innerWidth;
                this.mouse.y = 1 - clientY / window.innerHeight; // Invert Y for UV coordinates

                // Update the shader uniform for mouse position (cursor glow)
                if (this.fieldMesh) {
                    this.fieldMesh.material.uniforms.mouse.value.set(this.mouse.x, this.mouse.y);
                }
            }
            
            updateMorphicState(e) {
                const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
                const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

                const x = clientX / window.innerWidth;
                const y = 1 - clientY / window.innerHeight;
                
                this.morphicState.intensity = y;
                this.morphicState.frequency = 100 + x * 400; // Map X to frequency
                this.morphicState.resonance = Math.sin(this.time * 0.01 + x * Math.PI) * 0.5 + 0.5; // X influences resonance
                this.morphicState.bloom = 0.3 + y * 0.7; // Y influences bloom
                this.morphicState.flow = x * 2; // X influences flow
                this.morphicState.harmonic = Math.cos(this.time * 0.005 + y * Math.PI) * 0.5 + 0.5; // Y influences harmonic content
                
                this.updateAudio();
                this.updateStateInURL();
            }
            
            updateAudio() {
                if (!this.audioContext || this.oscillators.length === 0) return;
                
                const baseFreq = this.morphicState.frequency;
                const frequencies = [baseFreq, baseFreq * 1.5, baseFreq * 2, baseFreq * 0.5, baseFreq * 3];
                
                this.oscillators.forEach((osc, i) => {
                    osc.frequency.setTargetAtTime(frequencies[i], this.audioContext.currentTime, 0.1);
                });
                
                this.filters.forEach(filter => {
                    filter.frequency.setTargetAtTime(
                        200 + this.morphicState.intensity * 1000,
                        this.audioContext.currentTime,
                        0.1
                    );
                    filter.Q.setTargetAtTime(
                        this.morphicState.resonance * 15 + 1,
                        this.audioContext.currentTime,
                        0.1
                    );
                });
            }
            
            animate() {
                requestAnimationFrame(() => this.animate());
                
                this.time += 0.016; // Time for animations

                // Update audio analysis (for visual feedback)
                let audioLevel = 0;
                if (this.analyser && this.frequencyData) {
                    this.analyser.getByteFrequencyData(this.frequencyData);
                    audioLevel = this.frequencyData.reduce((sum, value) => sum + value, 0) / (this.frequencyData.length * 255);
                }
                
                // Update field mesh uniforms
                if (this.fieldMesh) {
                    const uniforms = this.fieldMesh.material.uniforms;
                    uniforms.time.value = this.time;
                    uniforms.intensity.value = this.morphicState.intensity;
                    uniforms.flow.value = this.morphicState.flow;
                    uniforms.bloom.value = this.morphicState.bloom;
                    uniforms.harmonic.value = this.morphicState.harmonic;
                    // uniforms.mouse.value is updated in updateMouse()
                    uniforms.audioLevel.value = audioLevel;
                    
                    this.fieldMesh.rotation.z = this.time * 0.01;
                }
                
                // Update particles
                if (this.particles) {
                    const positions = this.particles.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i + 2] += Math.sin(this.time * 0.01 + i) * 0.01;
                        positions[i] += Math.cos(this.time * 0.005 + i) * 0.005;
                    }
                    this.particles.geometry.attributes.position.needsUpdate = true;
                    this.particles.rotation.y = this.time * 0.005;
                }
                
                // Auto-evolve when not interacting to keep it dynamic
                if (!this.mouse.down) {
                    this.morphicState.flow = 0.6 + Math.sin(this.time * 0.003) * 0.4;
                    this.morphicState.harmonic = 0.4 + Math.cos(this.time * 0.002) * 0.3;
                    this.updateAudio(); // Update audio parameters for auto-evolution
                }
                
                this.renderer.render(this.scene, this.camera);
            }
            
            // ==================== State Serialization ====================
            updateStateInURL() {
                const state = {
                    morphicState: this.morphicState,
                    steps: this.steps, // Save sequencer steps
                    bpm: this.bpm // Save BPM
                };
                try {
                    const encoded = btoa(JSON.stringify(state));
                    window.location.hash = encoded;
                } catch (error) {
                    console.warn('Failed to update URL state (likely too large or malformed):', error);
                }
            }
            
            loadStateFromURL() {
                try {
                    if (window.location.hash) {
                        const state = JSON.parse(atob(window.location.hash.slice(1)));
                        
                        // Load morphic state
                        if (state.morphicState) {
                            Object.assign(this.morphicState, state.morphicState);
                            this.updateAudio(); // Apply loaded audio parameters
                        }
                        
                        // Load sequencer steps
                        if (state.steps && Array.isArray(state.steps) && state.steps.length === 8 && state.steps[0].length === 4) {
                            this.steps = state.steps;
                        } else {
                            console.warn('Invalid sequencer steps in URL hash, reverting to default.');
                            this.steps = Array(8).fill().map(() => Array(4).fill(false)); // Reset to default
                        }

                        // Load BPM
                        if (typeof state.bpm === 'number' && state.bpm >= 60 && state.bpm <= 180) {
                            this.bpm = state.bpm;
                            this.secondsPerStep = (60 / this.bpm) / 4;
                        } else {
                            console.warn('Invalid BPM in URL hash, reverting to default.');
                            this.bpm = 120;
                            this.secondsPerStep = (60 / this.bpm) / 4;
                        }

                        this.updateSequencerUI(); // Update UI based on loaded steps
                        document.getElementById('bpm-display').textContent = this.bpm; // Update BPM display
                    }
                } catch (error) {
                    console.warn('Failed to load state from URL:', error);
                    // Reset to initial defaults if parsing fails
                    this.morphicState = {
                        intensity: 0.5, frequency: 220, resonance: 0.7,
                        bloom: 0.8, flow: 0.6, harmonic: 0.4
                    };
                    this.steps = Array(8).fill().map(() => Array(4).fill(false));
                    this.bpm = 120;
                    this.secondsPerStep = (60 / this.bpm) / 4;
                    this.updateAudio(); // Apply default audio parameters
                    this.updateSequencerUI();
                    document.getElementById('bpm-display').textContent = this.bpm;
                }
            }
        }
        
        // Initialize the portal
        let portal; // Make it global so HTML buttons can access it
        window.addEventListener('load', () => {
            portal = new MorphicFieldPortal();
        });
    </script>
</body>
</html>
