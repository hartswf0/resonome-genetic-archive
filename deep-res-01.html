<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deep Resonance Trance Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; cursor: none; }
        canvas { display: block; }
        #ui-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; color: #0ff; font-family: monospace; display: flex; align-items: center; gap: 10px; opacity: 1; transition: opacity 0.5s ease-in-out; }
        #ui-container.hidden { opacity: 0; pointer-events: none; }
        #resonance-slider { width: 300px; }
    </style>
</head>
<body>
    <div id="ui-container">
        <label for="resonance-slider">Resonance Depth</label>
        <input type="range" id="resonance-slider" min="0" max="1" step="0.001" value="0.5">
    </div>
    <canvas id="gl-canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- SHADER SETUP -->
    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        precision highp float;
        uniform float u_time;
        uniform float u_depth;
        uniform float u_fft;
        varying vec2 vUv;

        vec3 hsv2rgb(vec3 c) {
            vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
            vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
            return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        float noise(vec2 st) {
            vec2 i = floor(st);
            vec2 f = fract(st);
            float a = random(i);
            float b = random(i + vec2(1.0, 0.0));
            float c = random(i + vec2(0.0, 1.0));
            float d = random(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.y * u.x;
        }

        void main() {
            vec2 p = vUv * 2.0 - 1.0;
            float t = u_time * 0.1;

            float recursion_depth = 2.0 + u_depth * 8.0;
            float amplitude = 0.5 + u_depth * 1.5 + u_fft * 2.0;

            for(float i = 1.0; i < 9.0; i++) {
                if (i > recursion_depth) break;
                p.x += 0.5 / i * sin(i * 2.0 * p.y + t + cos(t * 0.5));
                p.y += 0.5 / i * cos(i * 3.0 * p.x + t + sin(t * 0.4));
            }

            float color_val = length(p);
            float hue = 0.6 + u_depth * 0.3 + t * 0.1;
            vec3 color = hsv2rgb(vec3(hue, 0.8, 0.9));

            float final_val = pow(sin(color_val * 3.0) * 0.5 + 0.5, 2.0);
            float bloom = smoothstep(0.8, 1.0, final_val) * (0.5 + u_depth * 1.5);

            gl_FragColor = vec4(color * final_val + bloom, 1.0);
        }
    </script>

    <script>
        // --- STATE & CONFIG ---
        const state = {
            depth: 0.5,
            lfoActive: false,
            mouseIsDown: false,
            lastActivity: Date.now()
        };

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 1.5;
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl-canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const clock = new THREE.Clock();
        const material = new THREE.ShaderMaterial({
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            uniforms: {
                u_time: { value: 0.0 },
                u_depth: { value: state.depth },
                u_fft: { value: 0.0 }
            }
        });
        const geometry = new THREE.PlaneGeometry(4, 4, 1, 1);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // --- AUDIO SETUP ---
        let audioCtx, masterGain, fmOsc, fmGain, lfo, filter, granularSource, reverb, analyser, fftData;
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            masterGain.connect(audioCtx.destination);

            // Reverb
            reverb = audioCtx.createConvolver();
            const reverbTime = 2.5;
            const reverbLen = audioCtx.sampleRate * reverbTime;
            const impulse = audioCtx.createBuffer(2, reverbLen, audioCtx.sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const channel = impulse.getChannelData(ch);
                for (let i = 0; i < reverbLen; i++) {
                    channel[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / reverbLen, 2.5);
                }
            }
            reverb.buffer = impulse;
            reverb.connect(masterGain);

            // Filter
            filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.connect(reverb);

            // FM Drone
            fmOsc = audioCtx.createOscillator();
            fmOsc.type = 'sine';
            const modulator = audioCtx.createOscillator();
            modulator.type = 'sine';
            fmGain = audioCtx.createGain();
            fmOsc.connect(filter);
            modulator.connect(fmGain);
            fmGain.connect(fmOsc.frequency);
            fmOsc.start();
            modulator.start();

            // Granular Texture
            const grainLen = audioCtx.sampleRate * 2;
            const grainBuffer = audioCtx.createBuffer(1, grainLen, audioCtx.sampleRate);
            const grainData = grainBuffer.getChannelData(0);
            for (let i = 0; i < grainLen; i++) {
                grainData[i] = Math.random() * 2 - 1;
            }
            granularSource = audioCtx.createBufferSource();
            granularSource.buffer = grainBuffer;
            granularSource.loop = true;
            granularSource.connect(filter);
            granularSource.start();

            // LFO for self-oscillation
            lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.start();

            // Analyser
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 128;
            fftData = new Uint8Array(analyser.frequencyBinCount);
            masterGain.connect(analyser);
        }

        // --- UI BINDING ---
        const slider = document.getElementById('resonance-slider');
        const uiContainer = document.getElementById('ui-container');
        let uiTimeout;

        function updateState(newDepth, fromSlider = true) {
            state.depth = Math.max(0, Math.min(1, newDepth));
            if (fromSlider) {
                slider.value = state.depth;
            }
            history.replaceState(null, '', '#' + state.depth.toFixed(3));
            state.lastActivity = Date.now();
            uiContainer.classList.remove('hidden');
            clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => uiContainer.classList.add('hidden'), 5000);
        }

        function applyState() {
            material.uniforms.u_depth.value = state.depth;
            if (audioCtx) {
                const depthSquared = state.depth * state.depth;
                fmOsc.frequency.setTargetAtTime(60 + depthSquared * 120, audioCtx.currentTime, 0.02);
                fmGain.gain.setTargetAtTime(depthSquared * 100, audioCtx.currentTime, 0.02);
                filter.frequency.setTargetAtTime(200 + (1 - depthSquared) * 4000, audioCtx.currentTime, 0.02);
                filter.Q.setTargetAtTime(1 + depthSquared * 15, audioCtx.currentTime, 0.02);
                lfo.frequency.setTargetAtTime(0.5 + state.depth * 5, audioCtx.currentTime, 0.02);
            }
        }

        slider.addEventListener('input', () => updateState(parseFloat(slider.value)));
        slider.addEventListener('mousedown', () => state.mouseIsDown = true);
        window.addEventListener('mouseup', () => {
            if (state.mouseIsDown && Date.now() - state.lastActivity > 200) { // Long press
                state.lfoActive = !state.lfoActive;
            }
            state.mouseIsDown = false;
        });

        // --- RENDER & AUDIO LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            if (state.lfoActive) {
                const lfoValue = (Math.sin(elapsedTime * lfo.frequency.value) + 1) / 2;
                updateState(lfoValue, true);
            }
            applyState();

            material.uniforms.u_time.value = elapsedTime;

            if (analyser) {
                analyser.getByteFrequencyData(fftData);
                let sum = fftData.reduce((a, b) => a + b, 0);
                let avg = sum / fftData.length;
                material.uniforms.u_fft.value = avg / 255;
            }

            renderer.render(scene, camera);
        }

        // --- INITIALIZATION ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.body.addEventListener('click', () => {
            if (!audioCtx) {
                initAudio();
                applyState();
            }
        }, { once: true });

        const initialHash = parseFloat(location.hash.slice(1));
        if (!isNaN(initialHash)) {
            updateState(initialHash);
        }

        animate();
    </script>
</body>
</html>
