<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCION RACK — two decks, one mixer, any param plays any param</title>
<style>
:root{--bg:#07090c;--pn:#0d1116;--pn2:#131920;--ln:#243040;--ink:#e2e9f1;--mut:#8a98a9;--a:#5fd4ff;--b:#ffb44a;--m:#d58cff;--ok:#6fe39a;--hot:#ff5d6c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:12px/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;cursor:pointer;padding:0 8px;min-height:44px;min-width:44px;touch-action:manipulation;user-select:none;-webkit-user-select:none;white-space:nowrap}
button:active{transform:translateY(1px)}
button.on{background:#1c2a36;border-color:var(--ok);color:var(--ok)}
button.hot.on{border-color:var(--hot);color:var(--hot);background:#2a1418}
button:disabled{opacity:.4;cursor:not-allowed}
select{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;min-height:44px;padding:0 6px;min-width:0;max-width:100%}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr) auto;overflow:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
/* ---------- header ---------- */
#top{grid-column:1/-1;display:flex;gap:8px;align-items:center;padding:5px 8px;min-height:54px;background:var(--pn);border-bottom:1px solid var(--ln);min-width:0}
#brand{font-weight:700;letter-spacing:.18em;color:var(--mut);white-space:nowrap}
.pick{display:flex;align-items:center;gap:5px;flex:1 1 0;min-width:0}
.pick b{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:#000;flex:none}
.pick select{flex:1 1 0;width:0}
.ka{background:var(--a)}.kb{background:var(--b)}
#view{display:flex;flex:none}
#view button{border-radius:0;min-width:44px;padding:0 4px}
#view button:first-child{border-radius:8px 0 0 8px}#view button:last-child{border-radius:0 8px 8px 0}
#urlbox{position:absolute;z-index:30;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 58px);max-width:640px;margin:0 auto;display:none;gap:6px;align-items:center;padding:8px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;box-shadow:0 12px 30px #000a}
#urlbox.show{display:flex}
#urlbox input{flex:1;min-width:0;min-height:44px;font-size:16px;background:#06080b;border:1px solid var(--ln);border-radius:8px;padding:0 8px}
#banner{position:absolute;z-index:25;left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);top:env(safe-area-inset-top,0px);height:54px;display:none;gap:8px;align-items:center;justify-content:center;padding:4px 8px;background:#1a1024;border-bottom:1px solid var(--m);color:#f0dcff;overflow:hidden}
#banTxt{min-width:0;font-size:11px;line-height:1.25;max-height:42px;overflow:hidden}
#banX{flex:none}
#banner.show{display:flex}
#banner.toast{background:#10201a;border-color:var(--ok);color:#d9ffe8}
/* ---------- decks ---------- */
#decks{grid-row:2;grid-column:1;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:2px;min-height:0;min-width:0;background:#000}
.deck{position:relative;display:grid;grid-template-rows:22px minmax(0,1fr);min-width:0;min-height:0;background:#000}
.dhead{display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--pn);font-size:11px;min-width:0;overflow:hidden}
.dhead .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;min-width:0}
.dhead .cnt{color:var(--mut);white-space:nowrap}
.dhead a{margin-left:auto;color:var(--mut);text-decoration:none;padding:0 6px}
.chip{flex:none;border:1px solid var(--ln);border-radius:99px;padding:0 6px;font-size:10px;line-height:15px;color:var(--mut);white-space:nowrap}
.chip.live{color:var(--ok);border-color:var(--ok)}.chip.direct{color:var(--b);border-color:var(--b)}.chip.err{color:var(--hot);border-color:var(--hot)}
#deckAbox .dhead{box-shadow:inset 0 -2px 0 var(--a)}#deckBbox .dhead{box-shadow:inset 0 -2px 0 var(--b)}
iframe{width:100%;height:100%;border:0;display:block;background:#000}
#decks.v-a,#decks.v-b{display:block}
#decks.v-a .deck,#decks.v-b .deck{position:absolute;inset:0}
#decks.v-a #deckBbox,#decks.v-b #deckAbox{visibility:hidden;pointer-events:none}
/* ---------- strip ---------- */
#strip{grid-row:3;grid-column:1/-1;z-index:6;display:grid;gap:6px 10px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--pn);border-top:1px solid var(--ln);
  grid-template-columns:250px 160px minmax(0,1fr) 160px 250px;grid-template-areas:"cha xy1 ctr xy2 chb";min-width:0}
#tabs{display:none}
.ch{display:grid;gap:4px;align-content:start;min-width:0}
#chA{grid-area:cha}#chB{grid-area:chb}#xy1{grid-area:xy1}#xy2{grid-area:xy2}#ctr{grid-area:ctr}
.ch .hd{display:flex;gap:6px;align-items:center;min-width:0;height:16px}
.ch .hd .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ch .kills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
.ch .kills button{padding:0;font-size:11px}
.ch.bypass .fader,.ch.bypass .kills,.ch.bypass .meter{opacity:.38}
.note{font-size:10px;color:var(--b);height:12px;overflow:hidden;white-space:nowrap}
.note.err{color:var(--hot)}
.fader{position:relative;height:44px;touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none;outline:none;min-width:0}
.fader .tr{position:absolute;left:0;right:0;top:17px;bottom:4px;border:1px solid var(--ln);border-radius:8px;background:#06080b;overflow:hidden}
.fader .fl{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--c,#3a4a5c);opacity:.5}
.fader .kn{position:absolute;top:3px;bottom:3px;width:4px;margin-left:-2px;border-radius:2px;background:var(--c,#cfd8e3);left:50%}
.fader .lb,.fader .vl{position:absolute;top:1px;line-height:14px;font-size:11px;pointer-events:none;white-space:nowrap}
.fader .lb{left:2px;color:var(--mut)}.fader .vl{right:2px;color:#fff;font-weight:700}
.fader:focus-visible .tr{border-color:#fff}
.meter{display:flex;align-items:center;gap:6px;height:12px;font-size:10px;color:var(--mut)}
.meter .bar{flex:1;height:8px;border-radius:4px;background:#06080b;border:1px solid var(--ln);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok) 0 70%,#f3d04a 85%,var(--hot))}
.meter span{width:56px;text-align:right;white-space:nowrap}
.xy{position:relative;border:1px solid var(--ln);border-radius:10px;background:#06080b;touch-action:none;cursor:crosshair;min-height:118px;overflow:hidden;outline:none;user-select:none;-webkit-user-select:none}
.xy .ar{position:absolute;left:10px;right:10px;top:26px;bottom:26px;pointer-events:none}
.xy .ar::before{content:"";position:absolute;inset:-9px;border-radius:6px;background:#0a0f15;background-image:linear-gradient(#18202a 1px,transparent 1px),linear-gradient(90deg,#18202a 1px,transparent 1px);background-size:25% 25%}
.xy .dot{position:absolute;width:18px;height:18px;margin:-9px;border-radius:50%;border:2px solid var(--m);background:#d58cff44;pointer-events:none}
.xy .hl,.xy .vl2{position:absolute;background:#d58cff55;pointer-events:none}
.xy .hl{left:-9px;right:-9px;height:1px}.xy .vl2{top:-9px;bottom:-9px;width:1px}
.xy .t{position:absolute;left:5px;right:5px;font-size:10px;line-height:12px;pointer-events:none;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.xy .ty{top:2px}.xy .tx{bottom:2px}
.xy .t b{color:var(--m)}
#ctr{display:grid;gap:5px;align-content:start;min-width:0}
#btns{display:grid;grid-template-columns:1.3fr 1.5fr 44px 44px 1.2fr 1fr;gap:5px}
#btns button{padding:0 2px;min-height:44px;overflow:hidden}
#bStart{border-color:var(--ok);color:var(--ok);font-weight:700}
#xrow{display:grid;grid-template-columns:62px minmax(0,1fr) 62px;gap:5px;align-items:center}
#xrow button{min-height:44px;padding:0}
#bCutA.on{border-color:var(--a);color:var(--a)}#bCutB.on{border-color:var(--b);color:var(--b)}
/* ---------- matrix sheet ---------- */
#sheet{grid-row:2;grid-column:2;width:0;overflow:hidden;background:var(--pn);border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0;z-index:4}
#app.sheet-open #sheet{width:430px}
#sheet .sh{display:flex;gap:5px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--ln);flex:none;flex-wrap:wrap}
#sheet .sh h2{font-size:12px;letter-spacing:.14em;margin:0 auto 0 0;color:var(--m)}
#sbody{flex:1;overflow:auto;padding:8px;-webkit-overflow-scrolling:touch;min-height:0}
#sbody h3{font-size:11px;letter-spacing:.14em;color:var(--mut);margin:12px 0 6px;font-weight:400}
#sbody h3:first-child{margin-top:0}
.asg{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr);gap:4px;align-items:center;padding:6px;border:1px solid var(--ln);border-radius:10px;margin-bottom:6px;background:#0a0e13}
.asg .rng{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 52px 44px;gap:4px;align-items:center}
.asg.cc{border-color:#4a3a1c}
.asg select{width:100%}
.empty{color:var(--mut);padding:6px 2px}
.empty.warn{color:var(--b)}.empty.bad{color:var(--hot)}
table.mx{border-collapse:collapse;width:100%}
table.mx th{font-weight:400;color:var(--mut);font-size:10px;padding:2px;position:sticky;top:-8px;background:var(--pn)}
table.mx td{padding:2px}
table.mx td.pn{max-width:0;width:99%;overflow:hidden}
table.mx td.pn div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.mx td.pn .pv{height:3px;border-radius:2px;background:#06080b;margin-top:2px}
table.mx td.pn .pv i{display:block;height:100%;width:0;background:var(--mut)}
table.mx tr.da td.pn .pv i{background:var(--a)}table.mx tr.db td.pn .pv i{background:var(--b)}
table.mx td.vv{color:var(--mut);font-size:10px;text-align:right;white-space:nowrap}
table.mx button{min-height:44px;width:44px;padding:0;color:var(--mut)}
table.mx button.on{border-color:var(--m);color:var(--m);background:#231530}
tr.grp td{color:var(--mut);font-size:10px;letter-spacing:.12em;padding-top:8px}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
/* ---------- compact (anything narrower than 1240px): MIX/PADS tabs, matrix is a slide-up sheet over the decks ---------- */
@media (max-width:1239px){
  #tabs{grid-area:tabs;display:flex;gap:5px;align-items:center;min-width:0}
  #chA,#xy1{grid-area:pa}#chB,#xy2{grid-area:pb}
  #strip.p-mix .xy,#strip.p-pads .ch,#strip.p-none .xy,#strip.p-none .ch{display:none}
  #sheet{grid-column:1;grid-row:2;justify-self:end;width:min(430px,100%)!important;border-left:1px solid var(--m);border-top:1px solid var(--m);transform:translateY(104%);transition:transform .22s ease;visibility:hidden}
  #app.sheet-open #sheet{transform:none;visibility:visible}
  #app.learning #sheet{transform:translateY(104%)}
}
/* row: tablets, small windows, phones in landscape. One line: [tabs][A][centre][B] */
@media (min-width:761px) and (max-width:1239px), (min-width:600px) and (max-width:760px) and (max-height:520px){
  #strip{grid-template-columns:44px minmax(0,1fr) minmax(340px,1.5fr) minmax(0,1fr);grid-template-areas:"tabs pa ctr pb";gap:6px}
  #strip.p-none{grid-template-columns:44px minmax(0,1fr);grid-template-areas:"tabs ctr"}
  #tabs{flex-direction:column;align-items:stretch;justify-content:flex-start}
  #tabs button{padding:0;font-size:11px}
  #tabs .sp{display:none}
  #btns{grid-template-columns:1.25fr 1.5fr 44px 44px 1.1fr 1.1fr}
  #btns button{font-size:11px}
}
@media (max-width:790px) and (max-height:520px){ .ch .kills{grid-template-columns:repeat(3,minmax(0,1fr))} .ch .kills [data-k=all]{display:none} }
@media (max-width:760px){
  #brand,#bLink{display:none}
  #top{gap:4px;padding:4px 6px}
  .pick{gap:3px}.pick b{width:15px;height:44px;border-radius:4px;font-size:11px}
  #sheet{justify-self:stretch;width:auto!important;border-left:0}
}
/* stacked: phones in portrait */
@media (max-width:599px), (max-width:760px) and (min-height:521px){
  #decks.v-ab{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  #strip{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"tabs tabs" "pa pb" "ctr ctr";gap:5px 8px}
  #tabs button{min-width:64px}
  #tabs .sp{flex:1;min-width:0;color:var(--mut);font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:right}
  #strip.p-none{grid-template-areas:"tabs tabs" "ctr ctr"}
  #btns{grid-template-columns:1.25fr 1.5fr 44px 44px 1.1fr 1fr;gap:4px}
  #btns button{font-size:11px}
}
@media (min-width:1240px){ #app.sheet-open #bMap{border-color:var(--m);color:var(--m)} }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span id="brand">SCION RACK</span>
    <label class="pick"><b class="ka">A</b><select id="selA" aria-label="Deck A instrument"></select></label>
    <div id="view" role="group" aria-label="Deck view">
      <button data-v="a" title="Show deck A only">A</button><button data-v="ab" title="Show both decks">A+B</button><button data-v="b" title="Show deck B only">B</button>
    </div>
    <label class="pick"><b class="kb">B</b><select id="selB" aria-label="Deck B instrument"></select></label>
    <button id="bLink" title="Copy a link to this exact rack setup">COPY LINK</button>
  </header>
  <div id="urlbox"><span id="urlLab">Deck A URL</span><input id="urlIn" type="url" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="../smith-deck/smith-968.html or https://…"><button id="urlGo">LOAD</button><button id="urlX" aria-label="Cancel">✕</button></div>
  <div id="banner"><span id="banTxt"></span><button id="banX">CANCEL</button></div>

  <main id="decks" class="v-ab">
    <section class="deck" id="deckAbox">
      <div class="dhead"><b style="color:var(--a)">A</b><span class="nm" id="nmA"></span><span class="chip" id="stA">idle</span><span class="cnt" id="cnA"></span><a id="opA" target="_blank" rel="noopener" title="Open deck A on its own">↗</a></div>
      <iframe id="deckA" allow="autoplay; microphone" allowfullscreen title="Deck A"></iframe>
    </section>
    <section class="deck" id="deckBbox">
      <div class="dhead"><b style="color:var(--b)">B</b><span class="nm" id="nmB"></span><span class="chip" id="stB">idle</span><span class="cnt" id="cnB"></span><a id="opB" target="_blank" rel="noopener" title="Open deck B on its own">↗</a></div>
      <iframe id="deckB" allow="autoplay; microphone" allowfullscreen title="Deck B"></iframe>
    </section>
  </main>

  <aside id="sheet" aria-label="Mapping matrix">
    <div class="sh">
      <h2>MAPPING MATRIX</h2>
      <button id="bLearn" title="Wiggle a control in a deck, then a macro (or a control in the other deck)">LEARN</button>
      <button id="bCC" title="Cross-couple: params of one deck drive params of the other">COUPLE ON</button>
      <button id="bLink2" title="Copy share link">LINK</button>
      <button id="bClose" aria-label="Close matrix">✕</button>
    </div>
    <div id="sbody"></div>
  </aside>

  <footer id="strip" class="p-pads">
    <div id="tabs"><button data-p="mix">MIX</button><button data-p="pads">PADS</button><span class="sp" id="tabInfo"></span></div>
    <div class="ch" id="chA">
      <div class="hd"><b style="color:var(--a)">A</b><span class="nm" id="cnmA"></span><span class="chip" id="cstA">idle</span></div>
      <div class="fader" id="fLvA" style="--c:var(--a)"></div>
      <div class="kills"><button data-k="lo" class="on">LO</button><button data-k="mid" class="on">MID</button><button data-k="hi" class="on">HI</button><button data-k="all" title="Kill / restore all three bands">KILL</button></div>
      <div class="meter"><div class="bar"><i id="mA"></i></div><span id="mAv">-∞ dB</span></div>
      <div class="note" id="ntA"></div>
    </div>
    <div class="xy" id="xy1" tabindex="0" aria-label="Macro pad 1: M1 horizontal, M2 vertical"></div>
    <div id="ctr">
      <div id="btns">
        <button id="bStart">▶ START</button>
        <button id="bTap" title="Tap tempo: sends set-bpm to both decks">TAP 120</button>
        <button id="bBm" aria-label="BPM down">−</button><button id="bBp" aria-label="BPM up">+</button>
        <button id="bRec" class="hot" title="Record the mix to a file">● REC</button>
        <button id="bMap" title="Open the mapping matrix">MAP</button>
      </div>
      <div id="xrow">
        <button id="bCutA" title="Cut deck A out of the mix">CUT A</button>
        <div class="fader" id="fX"></div>
        <button id="bCutB" title="Cut deck B out of the mix">CUT B</button>
      </div>
      <div class="meter"><div class="bar"><i id="mM"></i></div><span id="mMv" style="width:150px">MASTER -∞ dB</span></div>
    </div>
    <div class="xy" id="xy2" tabindex="0" aria-label="Macro pad 2: M3 horizontal, M4 vertical"></div>
    <div class="ch" id="chB">
      <div class="hd"><b style="color:var(--b)">B</b><span class="nm" id="cnmB"></span><span class="chip" id="cstB">idle</span></div>
      <div class="fader" id="fLvB" style="--c:var(--b)"></div>
      <div class="kills"><button data-k="lo" class="on">LO</button><button data-k="mid" class="on">MID</button><button data-k="hi" class="on">HI</button><button data-k="all" title="Kill / restore all three bands">KILL</button></div>
      <div class="meter"><div class="bar"><i id="mB"></i></div><span id="mBv">-∞ dB</span></div>
      <div class="note" id="ntB"></div>
    </div>
  </footer>
</div>

function setMonitor(d,on){const b=bridge(d);try{if(b&&b.setMonitor)b.setMonitor(on)}catch(e){}
  const w=sameOrigin(d);try{if(w&&typeof w.__mandallaSetMonitor==='function')w.__mandallaSetMonitor(on)}catch(e){}
  post(d,{type:'set-monitor',on:!!on})}
function startDeck(d){const b=bridge(d);if(b&&typeof b.start==='function'){try{b.start();return}catch(e){}}
  const w=sameOrigin(d);if(w&&typeof w.__mandallaResumeAudio==='function'){try{Promise.resolve(w.__mandallaResumeAudio()).then(()=>tryConnect(d,false)).catch(()=>{});return}catch(e){}}
  post(d,{type:'resume-audio'})}
function stopDeck(d){const b=bridge(d);if(b&&typeof b.stop==='function'){try{b.stop();return}catch(e){}}
  const w=sameOrigin(d);if(w&&typeof w.__mandallaSuspendAudio==='function'){try{Promise.resolve(w.__mandallaSuspendAudio()).catch(()=>{});return}catch(e){}}
  post(d,{type:'suspend-audio'})}
function burst(d){const gen=d.gen;[0,200,600,1200,2500].forEach(ms=>setTimeout(()=>{if(d.gen===gen&&!d.stream){tryConnect(d,true)}},ms))}
function setRunning(on,drive){
  state.running=on;const b=$('#bStart');b.textContent=on?'■ STOP':'▶ START';b.classList.toggle('on',on);
  if(on){state.userStopped=false;ensureAudio();ctx.resume().catch(()=>{});if(drive)for(const d of DL){if(d.loaded){startDeck(d);burst(d)}}}
  else if(drive){state.userStopped=true;for(const d of DL)d.touched=false;for(const d of DL)stopDeck(d);if(ctx)ctx.suspend().catch(()=>{})}
}
function activated(){return navigator.userActivation?navigator.userActivation.hasBeenActive:state.touched}
// A first touch anywhere (START, a macro, or inside a deck) must end up audible through the mixer:
// "The player touched inside a deck": same-origin decks get capture listeners on their window; others are detected by focus moving into the frame.
function deckTouched(d){
  state.touched=true;if(d.touched&&d.stream&&state.running)return;d.touched=true;
  if(state.userStopped){state.userStopped=false;if(ctx)ctx.resume().catch(()=>{})} // touching a deck after STOP must not be silent
  if(!d.stream){d.attempts=0;burst(d)}
  if(!state.running){setRunning(true,false);
    // bring the other protocol deck up too so the crossfader has two live sides
    for(const o of DL){if(o!==d&&o.loaded&&bridge(o)){startDeck(o);burst(o)}}}
}
function watchDeck(d){const w=sameOrigin(d);if(!w)return;const h=()=>deckTouched(d);
  for(const t of ['pointerdown','touchstart','mousedown','keydown']){try{w.addEventListener(t,h,{capture:true,passive:true})}catch(e){}}}
setInterval(()=>{ // keep chasing streams for decks that are live but not yet in the mixer (never just because a picker was opened)
  if(!activated()||!state.running)return;
  for(const d of DL){if(!d.stream&&d.loaded&&d.attempts<40)tryConnect(d,false)}
},300);
window.addEventListener('blur',()=>{setTimeout(()=>{for(const d of DL){if(document.activeElement===d.frame)deckTouched(d)}},60)});
window.addEventListener('pointerdown',()=>{state.touched=true},true);

window.addEventListener('message',e=>{
  const m=e.data;if(!m||typeof m!=='object')return;
  const d=DL.find(x=>{try{return e.source===x.frame.contentWindow}catch(_){return false}});if(!d)return;
  switch(m.type){
    case 'scion-manifest':setManifest(d,m.manifest);break;
    case 'scion-param':onDeckParam(d,String(m.id),clamp(+m.value||0));break;
    case 'audio-stream':if(m.stream&&m.stream.getAudioTracks)connect(d,m.stream,'post');break;
  }
});

/* ================= mapping engine ================= */
const pk=(d,id)=>d.key+'.'+id;
function splitKey(k){const i=k.indexOf('.');return {d:decks[k.slice(0,i)],id:k.slice(i+1)}}
const isMacro=k=>/^m[0-3]$/.test(k);
function labelOf(k){if(isMacro(k))return 'M'+(+k[1]+1);const {d,id}=splitKey(k);if(!d)return k;const p=d.params.get(id);return d.key+'·'+(p?p.label:id)}
function macroTargets(i){const t=state.maps.filter(m=>m.src==='m'+i).map(m=>labelOf(m.dst));return t.length?'→ '+t.join(', '):'unassigned'}
function shape(m,v){return clamp(m.lo+(m.hi-m.lo)*(m.inv?1-v:v))}
function setParam(d,id,v){
  if(!d)return;v=clamp(v);d.lastSet.set(id,{v,t:performance.now()});
  const p=d.params.get(id);if(p)p.value=v;dirtyVals=true;
  const b=bridge(d);if(b&&typeof b.set==='function'){try{b.set(id,v);return}catch(e){}}
  post(d,{type:'scion-set',id,value:v});
}
function applyFrom(src,v){
  const macro=isMacro(src);if(!macro&&!state.cc)return;
  for(const m of state.maps){if(m.src!==src)continue;const {d,id}=splitKey(m.dst);setParam(d,id,shape(m,v))}
}
function setMacro(i,v,user){
  const prev=state.mac[i];state.mac[i]=v;paintPads();
  if(user&&state.learn)learnMacro(i,v,prev);
  applyFrom('m'+i,v);
}
function onDeckParam(d,id,v){
  const ls=d.lastSet.get(id);
  if(ls&&performance.now()-ls.t<250&&Math.abs(ls.v-v)<.03)return; // echo of something the rack just set: never re-trigger (no feedback loops)
  let p=d.params.get(id);if(!p){p={id,label:id,group:'',value:v};d.params.set(id,p)}
  p.value=v;dirtyVals=true;
  if(state.learn)learnParam(d,id,v);
  applyFrom(pk(d,id),v);
}
function addMap(src,dst,o){
  if(src===dst)return null;
  let m=state.maps.find(x=>x.src===src&&x.dst===dst);
  if(!m){m=Object.assign({src,dst,lo:0,hi:1,inv:false},o||{});state.maps.push(m)}
  renderMatrix();paintPads();writeUrl();return m;
}
function delMap(m){const i=state.maps.indexOf(m);if(i>=0)state.maps.splice(i,1);renderMatrix();paintPads();writeUrl()}

/* ---- learn: wiggle a deck control, then a macro (macro -> control) or a control in the other deck (first drives second) ---- */
function startLearn(){
  state.learn={stage:1,rng:new Map(),first:null,mac0:state.mac.slice(),rng2:new Map()};
  app.classList.add('learning');$('#bLearn').classList.add('on');if(phone()&&state.panel!=='pads')setPanel('pads');
  const hasM=DL.some(d=>d.manifest);
  banner(hasM?'LEARN 1/2 — move a control inside a deck':'LEARN — no deck has announced params yet; move a control inside a SCION deck');
}
function endLearn(msg){state.learn=null;app.classList.remove('learning');$('#bLearn').classList.remove('on');if(msg)banner(msg,2200);else hideBanner()}
function track(map,key,v){let r=map.get(key);if(!r){r={lo:v,hi:v};map.set(key,r)}r.lo=Math.min(r.lo,v);r.hi=Math.max(r.hi,v);return r.hi-r.lo}
function best(map){let bk=null,bv=-1;map.forEach((r,k)=>{if(r.hi-r.lo>bv){bv=r.hi-r.lo;bk=k}});return bk}
function learnParam(d,id,v){
  const L=state.learn,key=pk(d,id);
  if(L.first&&splitKey(L.first).d!==d){ // a control in the OTHER deck: cross-couple first -> this
    if(track(L.rng2,key,v)>.04){const src=L.first,dst=best(L.rng2);state.cc=true;paintCC();addMap(src,dst);endLearn('COUPLED  '+labelOf(src)+' → '+labelOf(dst))}
    return;
  }
  const span=track(L.rng,key,v);
  if(span>.03||L.first){const f=best(L.rng);if(f!==L.first||L.stage===1){L.first=f;L.stage=2;L.mac0=state.mac.slice();
    banner('LEARN 2/2 — '+labelOf(f)+' picked. Now move a macro pad to bind it, or a control in deck '+(d.key==='A'?'B':'A')+' to couple them')}}
}
function learnMacro(i,v){
  const L=state.learn;if(L.stage!==2||!L.first)return;
  if(Math.abs(v-L.mac0[i])>.05){const dst=L.first;addMap('m'+i,dst);endLearn('BOUND  M'+(i+1)+' → '+labelOf(dst))}
}

/* ================= URL: decks in ?a=&b=, mappings in #map= ================= */
const encK=k=>isMacro(k)?k:k[0]+'.'+encodeURIComponent(k.slice(2));
const decK=k=>isMacro(k)?k:(/^[AB]\./.test(k)?k[0]+'.'+decodeURIComponent(k.slice(2)):null);
function serializeMaps(){return state.maps.map(m=>[encK(m.src),encK(m.dst),Math.round(m.lo*100),Math.round(m.hi*100),m.inv?1:0].join(',')).join(';')}
function parseMaps(s){const out=[];for(const e of s.split(';')){if(!e)continue;const p=e.split(',');let src,dst;try{src=decK(p[0]||'');dst=decK(p[1]||'')}catch(_){continue}
  if(!src||!dst||isMacro(dst)||src===dst)continue;const lo=clamp((+p[2]||0)/100),hi=p[3]===undefined||p[3]===''?1:clamp((+p[3]||0)/100);out.push({src,dst,lo,hi,inv:p[4]==='1'})}return out}
let urlT=0;
function shareUrl(){const u=new URL(location.href);u.searchParams.set('a',decks.A.spec||'test');u.searchParams.set('b',decks.B.spec||'test');
  u.hash='map='+serializeMaps()+'&cc='+(state.cc?1:0);return u.href}
function writeUrl(){clearTimeout(urlT);urlT=setTimeout(()=>{try{history.replaceState(null,'',shareUrl())}catch(e){}},150)}
function readUrl(){
  const u=new URL(location.href),h=new URLSearchParams(u.hash.replace(/^#/,''));
  const a=u.searchParams.get('a')||'test',b=u.searchParams.get('b')||'test';
  if(h.has('map'))state.maps=parseMaps(h.get('map'));
  else if(a==='test'&&b==='test')state.maps=parseMaps('m0,A.pitch,0,100,0;m1,A.cutoff,0,100,0;m2,B.pitch,0,100,0;m3,B.cutoff,0,100,0');
  if(h.has('cc'))state.cc=h.get('cc')!=='0';
  return {a,b};
}
function copyLink(){const url=shareUrl();try{history.replaceState(null,'',url)}catch(e){}
  const done=()=>banner('Link copied — it restores both decks and every mapping',2000);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,()=>banner('Link is in the address bar',2000));else banner('Link is in the address bar',2000)}

/* ---- matrix sheet ---- */
let dirtyVals=false;const rowFaders=[];
function paramOptions(sel,withMacros){
  let h='';if(withMacros)h+='<optgroup label="Macros">'+[0,1,2,3].map(i=>'<option value="m'+i+'">M'+(i+1)+(i%2?' ↕ pad '+(i>>1?2:1):' ↔ pad '+(i>>1?2:1))+'</option>').join('')+'</optgroup>';
  let found=isMacro(sel);
  for(const d of DL){if(!d.params.size)continue;h+='<optgroup label="Deck '+d.key+' · '+esc(d.name)+'">';
    d.params.forEach(p=>{const k=pk(d,p.id);if(k===sel)found=true;h+='<option value="'+esc(k)+'">'+d.key+'·'+esc(p.label)+(p.group?' ('+esc(p.group)+')':'')+'</option>'});h+='</optgroup>'}
  if(!found&&sel)h+='<option value="'+esc(sel)+'">'+esc(sel)+' (not loaded)</option>';

function renderMatrix(){

  const row=(m)=>{const i=state.maps.indexOf(m);return '<div class="asg'+(isMacro(m.src)?'':' cc')+'" data-i="'+i+'"><select class="s" aria-label="Source">'+paramOptions(m.src,true)+'</select><span>→</span><select class="d" aria-label="Target">'+paramOptions(m.dst,false)+'</select>'+
    '<div class="rng"><div class="fader lo"></div><div class="fader hi"></div><button class="inv'+(m.inv?' on':'')+'" title="Invert">INV</button><button class="del" aria-label="Delete assignment">✕</button></div></div>'};
  h+='<h3>QUICK MATRIX — tap to assign a macro</h3>';
  if(DL.some(d=>d.params.size)){
    h+='<table class="mx"><thead><tr><th style="text-align:left">param</th><th></th><th>M1↔</th><th>M2↕</th><th>M3↔</th><th>M4↕</th></tr></thead><tbody>';
    for(const d of DL){if(!d.params.size)continue;h+='<tr class="grp"><td colspan="6">DECK '+d.key+' · '+esc(d.name.toUpperCase())+'</td></tr>';
      d.params.forEach(p=>{const k=pk(d,p.id);h+='<tr class="d'+d.key.toLowerCase()+'" data-k="'+esc(k)+'"><td class="pn"><div>'+esc(p.label)+(p.group?' <span style="color:var(--mut)">'+esc(p.group)+'</span>':'')+'</div><div class="pv"><i></i></div></td><td class="vv"></td>'+
        [0,1,2,3].map(i=>'<td><button class="cell'+(state.maps.some(m=>m.src==='m'+i&&m.dst===k)?' on':'')+'" data-m="'+i+'" aria-label="M'+(i+1)+' to '+esc(p.label)+'">'+(state.maps.some(m=>m.src==='m'+i&&m.dst===k)?'●':'·')+'</button></td>').join('')+'</tr>'})}

  } else h+='<div class="empty">No deck has announced a manifest yet.</div>';
  h+='<h3>MACRO ASSIGNMENTS</h3>'+(mac.length?mac.map(row).join(''):'<div class="empty">None yet. Tap a cell in the grid above, or press LEARN.</div>');
  h+='<h3>CROSS-COUPLE '+(state.cc?'':'(off) ')+'— one deck plays the other</h3>'+(cc.length?cc.map(row).join(''):'<div class="empty">None yet. LEARN: wiggle a control in one deck, then one in the other.</div>');
  h+='<div class="addrow"><button id="addM">＋ MACRO → PARAM</button><button id="addAB">＋ A drives B</button><button id="addBA">＋ B drives A</button><button id="clr">CLEAR ALL</button></div>';
  body.innerHTML=h;
  body.querySelectorAll('.asg').forEach(el=>{const m=state.maps[+el.dataset.i];

    dd.onchange=()=>{if(dd.value!==m.src){m.dst=dd.value}renderMatrix();paintPads();writeUrl()};
    makeFader(el.querySelector('.lo'),{label:'at min',value:m.lo,set:v=>{m.lo=v;writeUrl();reapply(m)}});

    el.querySelector('.del').onclick=()=>delMap(m)});
  const first=(d)=>{const it=d.params.keys().next();return it.done?null:pk(d,it.value)};

  body.querySelector('#addM').onclick=()=>{for(let i=0;i<4;i++)for(const d of DL){const k=unused('m'+i,d);if(k&&!state.maps.some(m=>m.src==='m'+i)){addMap('m'+i,k);return}}

  body.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{const k=b.closest('tr').dataset.k,src='m'+b.dataset.m;const m=state.maps.find(x=>x.src===src&&x.dst===k);if(m)delMap(m);else addMap(src,k)});
  body.scrollTop=sc;dirtyVals=true;
}
function reapply(m){const v=isMacro(m.src)?state.mac[+m.src[1]]:(()=>{const {d,id}=splitKey(m.src);const p=d&&d.params.get(id);return p?p.value:null})();

  if(rec){try{rec.stop()}catch(e){}return}
  ensureAudio();ctx.resume().catch(()=>{});
  if(!window.MediaRecorder){banner('Recording is not supported in this browser',2500);return}
  let opt;for(const mt of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg']){if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(mt)){opt={mimeType:mt};break}}
  try{rec=new MediaRecorder(recDest.stream,opt)}catch(e){rec=null;banner('Recording failed to start',2500);return}
  recChunks=[];recT0=performance.now();
  rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)recChunks.push(ev.data)};
  rec.onstop=()=>{const type=rec.mimeType||'audio/webm',ext=/mp4/.test(type)?'m4a':/ogg/.test(type)?'ogg':'webm';const blob=new Blob(recChunks,{type});rec=null;b.classList.remove('on');b.textContent='● REC';
    state.lastRecording={size:blob.size,type};
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='scion-rack-'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+ext;a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);banner('Mix saved · '+(blob.size/1024).toFixed(0)+' kB'+(DL.some(d=>!d.stream)?' (direct decks are not in the file)':''),2600)};
  rec.start(250);b.classList.add('on');
};
// view, panels, sheet
function setView(v){state.view=v;$('#decks').className='v-'+v;document.querySelectorAll('#view button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
document.querySelectorAll('#view button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
function setPanel(p){state.panel=p;$('#strip').className='p-'+p;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===p))}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setPanel(state.panel===b.dataset.p?'none':b.dataset.p));
$('#bMap').onclick=()=>toggleSheet();$('#bClose').onclick=()=>toggleSheet(false);
$('#bLearn').onclick=()=>{state.learn?endLearn():startLearn()};$('#banX').onclick=()=>endLearn();
$('#bCC').onclick=()=>{state.cc=!state.cc;paintCC();renderMatrix();writeUrl()};
$('#bLink').onclick=copyLink;$('#bLink2').onclick=copyLink;

/* ================= meters ================= */
const buf=new Float32Array(2048);let fT=performance.now(),fN=0,fps=0;
function rmsOf(an){an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];return Math.sqrt(s/buf.length)}
function meter(bar,txt,r,pre){const db=r>1e-5?20*Math.log10(r):-Infinity;bar.style.width=clamp((db+60)/60)*100+'%';txt.textContent=(pre||'')+(db===-Infinity?'-∞':db.toFixed(0))+' dB'}
const mEl={A:[$('#mA'),$('#mAv')],B:[$('#mB'),$('#mBv')],M:[$('#mM'),$('#mMv')]};
function frame(){
  requestAnimationFrame(frame);
  fN++;const now=performance.now();if(now-fT>=1000){fps=fN*1000/(now-fT);fN=0;fT=now;for(const d of DL)paintDeck(d)}
  if(ctx){for(const d of DL){d.rms=rmsOf(d.nodes.an);meter(mEl[d.key][0],mEl[d.key][1],d.rms)}
    const r=rmsOf(anM);const gr=limiter.reduction;meter(mEl.M[0],mEl.M[1],r,'MASTER ');if(gr<-0.3)mEl.M[1].textContent+=' · LIM '+gr.toFixed(1)}
  if(rec){$('#bRec').textContent='■ '+((now-recT0)/1000).toFixed(0)+'s'}
  if(dirtyVals)paintVals();
}

/* ================= boot ================= */
const init=readUrl();
setView(phone()?'a':'ab');setPanel('pads');paintCC();paintPads();
loadDeck(decks.A,init.a);loadDeck(decks.B,init.b);
if(!phone())toggleSheet(true);
requestAnimationFrame(frame);

// for tests and for the curious
window.scionRack={version:1,state,decks,get ctx(){return ctx},get fps(){return fps},ensureAudio,setMacro:(i,v)=>setMacro(i,clamp(v),true),addMap,delMap,setParam,loadDeck:(k,s)=>loadDeck(decks[k],s),
  setCrossfade(v){state.xf=clamp(v);fX.set(state.xf);applyXf()},setBpm,shareUrl,toggleSheet,setView,get limiter(){return limiter},analyser:k=>k==='M'?anM:decks[k].nodes&&decks[k].nodes.an};
})();
</script>
