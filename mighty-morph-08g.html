            const regionLen = (s.end - s.start) * buf.duration;
            const pos01 = clamp01(x + (Math.random() - 0.5) * 0.03);
            const offset = Math.min(buf.duration - 0.02, s.start * buf.duration + pos01 * regionLen);
            const rate = Math.pow(2, (y - 0.5) * 2);
            const dur = 0.14;
            const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(GRAIN_LEVEL, t + dur * 0.35);
            g.gain.linearRampToValueAtTime(0, t + dur);
            src.connect(g); g.connect(deck.outputGain);
            src.start(t, Math.max(0, offset), dur * rate + 0.05);
            src.stop(t + dur + 0.02);
            s.grainPos = s.start + pos01 * (s.end - s.start); s.grainT = performance.now();
            portalApp._waveDirty = true;
        };

        portalApp.flashSlice = (step) => {
            portalApp.sampler.flash = step; portalApp.sampler.flashT = performance.now();
            portalApp._waveDirty = true;
        };

        portalApp.setSeqSource = (src, silent) => {
            portalApp.sampler.seqSource = (src === 'synth') ? 'synth' : 'sample';
            const b = document.getElementById('sample-source');
            const isS = portalApp.sampler.seqSource === 'sample';
            b.textContent = isS ? 'SEQ: SAMPLE' : 'SEQ: SYNTH';
            b.classList.toggle('on', isS);
            portalApp.updateReadouts();
            if (!silent) { portalApp.emitParam('seqSource', isS ? 1 : 0); portalApp.updateStateInURL(); }
        };

        // --- waveform drawing ---
        portalApp.drawWave = () => {
            const cv = document.getElementById('wave-canvas'), wrap = document.getElementById('wave-wrap');
            const r = wrap.getBoundingClientRect();
            if (r.width < 4 || r.height < 4) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
            if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; portalApp._wavePeaks = null; }
            const g = cv.getContext('2d'), s = portalApp.sampler;
            g.clearRect(0, 0, W, H);
            if (s.data && s.data.length) {
                if (!portalApp._wavePeaks) {
                    const pk = new Float32Array(W * 2), d = s.data, n = d.length;
                    const stride = Math.max(1, Math.floor(n / W / 400));
                    for (let x = 0; x < W; x++) {
                        let lo = 0, hi = 0;
                        const a = Math.floor(x * n / W), b = Math.max(a + 1, Math.floor((x + 1) * n / W));
                        for (let i = a; i < b; i += stride) { const v = d[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
                        pk[x * 2] = lo; pk[x * 2 + 1] = hi;
                    }
                    portalApp._wavePeaks = pk;
                }
                const pk = portalApp._wavePeaks, mid = H / 2, x0 = s.start * W, x1 = s.end * W;
                // region
                g.fillStyle = 'rgba(0,255,255,0.16)';
                g.fillRect(x0, 0, x1 - x0, H);
                // slice flash (sequencer) and grain position (field)
                const nowMs = performance.now();
                if (s.flash >= 0 && nowMs - s.flashT < 160) {
                    const sw = (x1 - x0) / 8;
                    g.fillStyle = 'rgba(255,255,255,' + (0.45 * (1 - (nowMs - s.flashT) / 160)).toFixed(3) + ')';
                    g.fillRect(x0 + s.flash * sw, 0, sw, H);
                    portalApp._waveDirty = true;
                }
                // waveform (rendered once into an offscreen layer; dim outside the region, bright inside)
                if (!portalApp._waveLayer || portalApp._waveLayer.width !== W || portalApp._waveLayer.height !== H || portalApp._waveLayerPk !== pk) {
                    const off = portalApp._waveLayer || document.createElement('canvas');
                    off.width = W; off.height = H;
                    const og = off.getContext('2d');
                    og.fillStyle = '#7dffff';
                    for (let x = 0; x < W; x++) {
                        const lo = pk[x * 2], hi = pk[x * 2 + 1];
                        const yTop = mid - hi * mid * 0.92, yBot = mid - lo * mid * 0.92;
                        og.fillRect(x, yTop, 1, Math.max(1, yBot - yTop));
                    }
                    portalApp._waveLayer = off; portalApp._waveLayerPk = pk;
                }
                g.globalAlpha = 0.35;
                g.drawImage(portalApp._waveLayer, 0, 0);
                g.globalAlpha = 1;
                g.drawImage(portalApp._waveLayer, x0, 0, Math.max(1, x1 - x0), H, x0, 0, Math.max(1, x1 - x0), H);
                // slice ticks
                g.fillStyle = 'rgba(0,255,255,0.5)';
                for (let i = 1; i < 8; i++) g.fillRect(x0 + (x1 - x0) * i / 8, H - 6 * dpr, 1, 6 * dpr);
                // region handles
                g.fillStyle = '#fff';
                g.fillRect(x0, 0, 2 * dpr, H); g.fillRect(x1 - 2 * dpr, 0, 2 * dpr, H);
                if (s.grainT && nowMs - s.grainT < 200) {
                    g.fillStyle = '#FF00FF';
                    g.fillRect(s.grainPos * W - dpr, 0, 2 * dpr, H);
                    portalApp._waveDirty = true;
                }
            }
            // text: what it is, how long, what is selected
            const dur = s.data ? s.data.length / s.sampleRate : 0;
            g.font = (10 * dpr) + 'px "Courier New", monospace';
            g.textBaseline = 'top';
            g.shadowColor = '#000'; g.shadowBlur = 3 * dpr;
            g.fillStyle = '#E0FFFF';
            const label = portalApp.sampleStatus || ('SAMPLE: ' + s.name + '  ' + dur.toFixed(2) + 's');
            g.textAlign = 'left';
            g.fillText(label.length > 44 ? label.slice(0, 43) + '…' : label, 5 * dpr, 4 * dpr);
            g.textAlign = 'right';
            g.fillStyle = '#7dffff';
            g.fillText('REGION ' + (s.start * dur).toFixed(2) + '–' + (s.end * dur).toFixed(2) + 's', W - 5 * dpr, 4 * dpr);
            g.textBaseline = 'bottom';
            g.fillStyle = 'rgba(224,255,255,0.6)';
            g.fillText('drag = choose region · tap = move it · drop a file', W - 5 * dpr, H - 7 * dpr);
            g.shadowBlur = 0;
        };

        // ---------------------------------------------------------
        // Custom faders (pointer events + pointer capture; horizontal and vertical)
        // ---------------------------------------------------------
        function makeFader(el, opt) {
            const track = el.querySelector('.f-track');
            const valEl = el.querySelector('.f-val');
            const vertical = el.classList.contains('v');
            const min = opt.min, max = opt.max, step = opt.step || 0;
            let p = 0;
            const toValue = (q) => { let v = min + q * (max - min); if (step) v = Math.round(v / step) * step; return v; };
            const render = () => {
                el.style.setProperty('--p', p.toFixed(4));
                const v = toValue(p);
                valEl.textContent = opt.fmt(v, p);
                el.setAttribute('aria-valuenow', String(Math.round(v * 100) / 100));
                el.setAttribute('aria-valuetext', valEl.textContent);
            };
            const api = {
                get: () => toValue(p),
                get01: () => p,
                // set from code (no echo to the host)
                set: (v) => { p = clamp01((v - min) / (max - min)); render(); },
                // set from the player or the host
                set01: (q, fromPlayer) => {
                    q = clamp01(q);
                    if (step) q = clamp01((toValue(q) - min) / (max - min));
                    p = q; render();
                    opt.onInput(toValue(p));
                    if (fromPlayer) { portalApp.emitParam(opt.id, p); portalApp.updateStateInURL(); }
                }
            };
            const fromPointer = (e) => {
                const r = track.getBoundingClientRect();
                const th = 22;
                return vertical ? clamp01(1 - (e.clientY - r.top - th / 2) / Math.max(1, r.height - th))
                                : clamp01((e.clientX - r.left - th / 2) / Math.max(1, r.width - th));
            };
            let active = null;
            el.addEventListener('pointerdown', (e) => {
                if (e.button > 0) return;
                active = e.pointerId;
                try { el.setPointerCapture(e.pointerId); } catch (err) {}
                el.classList.add('drag');
                api.set01(fromPointer(e), true);
                e.preventDefault();
            });
            el.addEventListener('pointermove', (e) => { if (active === e.pointerId) { api.set01(fromPointer(e), true); e.preventDefault(); } });
            const end = (e) => { if (active === e.pointerId) { active = null; el.classList.remove('drag'); } };
            el.addEventListener('pointerup', end);
            el.addEventListener('pointercancel', end);
            el.addEventListener('lostpointercapture', end);
            el.addEventListener('keydown', (e) => {
                const d = (e.key === 'ArrowUp' || e.key === 'ArrowRight') ? 1 : (e.key === 'ArrowDown' || e.key === 'ArrowLeft') ? -1 : 0;
                if (!d) return;
                const inc = step ? step / (max - min) : 0.02;
                api.set01(p + d * inc * (e.shiftKey ? 5 : 1), true);
                e.preventDefault();
            });
            el.setAttribute('role', 'slider');
            el.setAttribute('tabindex', '0');
            el.setAttribute('aria-orientation', vertical ? 'vertical' : 'horizontal');
            el.setAttribute('aria-label', opt.label);
            el.setAttribute('aria-valuemin', String(min));
            el.setAttribute('aria-valuemax', String(max));
            api.set(opt.value);
            return api;
        }

        const pct = (v) => Math.round(v * 100) + '%';

        portalApp.buildFaders = () => {
            const q = (id) => document.querySelector('[data-fader="' + id + '"]');
            const F = portalApp.faders;
            F.bpm = makeFader(q('bpm'), { id: 'bpm', label: 'Tempo', min: 60, max: 240, step: 1, value: portalApp.rightDeck.bpm,
                fmt: (v) => v + ' BPM', onInput: (v) => { portalApp.rightDeck.setBPM(v); } });
            F.droneVol = makeFader(q('droneVol'), { id: 'droneVol', label: 'Field volume', min: 0, max: 1, value: portalApp.leftDeck.deckVolume,
                fmt: pct, onInput: (v) => { portalApp.leftDeck.setDeckVolume(v); portalApp.updateCrossfader(portalApp.crossfaderValue); } });
            F.seqVol = makeFader(q('seqVol'), { id: 'seqVol', label: 'Sequencer volume', min: 0, max: 1, value: portalApp.rightDeck.deckVolume,
                fmt: pct, onInput: (v) => { portalApp.rightDeck.setDeckVolume(v); portalApp.updateCrossfader(portalApp.crossfaderValue); } });
            F.master = makeFader(q('master'), { id: 'master', label: 'Master volume', min: 0, max: 1, value: portalApp.masterOutputVolume,
                fmt: pct, onInput: (v) => portalApp.updateMasterVolume(v) });
            F.crossfade = makeFader(q('crossfade'), { id: 'crossfade', label: 'Crossfade field to sequencer', min: 0, max: 1, value: portalApp.crossfaderValue,
                fmt: (v) => 'XFADE ' + Math.round((1 - v) * 100) + ':' + Math.round(v * 100), onInput: (v) => portalApp.updateCrossfader(v) });
            F.fuzz = makeFader(q('fuzz'), { id: 'fuzz', label: 'Fuzz', min: 0, max: 1, value: portalApp.globalFuzzAmount,
                fmt: pct, onInput: (v) => portalApp.updateGlobalFuzz(v) });
            F.influence = makeFader(q('influence'), { id: 'influence', label: 'Influence', min: 0, max: 1, value: portalApp.rightDeck.influence,
                fmt: pct, onInput: (v) => portalApp.rightDeck.setInfluence(v) });
        };

        // ---------------------------------------------------------
        // Audio graph (built once, lazily; safe to build before a gesture - it just stays suspended)
        //   decks -> masterGain -> analyser -> dry / wet->fuzz -> fxOut -> limiter -> outBus -> monitorGain -> speakers
        //            masterGain -> delaySend -> delay(+feedback) -> fxOut                 outBus -> MediaStream (host)
        // ---------------------------------------------------------
        portalApp.ensureAudio = () => {
            if (portalApp.audioContext) return portalApp.audioContext;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            portalApp.audioContext = ctx;

            portalApp.masterGain = ctx.createGain();
            portalApp.masterGain.gain.value = portalApp.masterOutputVolume;

            portalApp.globalAnalyser = ctx.createAnalyser();
            portalApp.globalAnalyser.fftSize = 256;
            portalApp.globalFrequencyData = new Uint8Array(portalApp.globalAnalyser.frequencyBinCount);

            portalApp.globalFuzzNode = ctx.createWaveShaper();
            portalApp.globalFuzzNode.curve = makeDistortionCurve(portalApp.globalFuzzAmount * 100);
            portalApp.globalFuzzNode.oversample = '4x';
            portalApp.globalFuzzWetGain = ctx.createGain();
            portalApp.globalFuzzDryGain = ctx.createGain();
            portalApp.globalFuzzWetGain.gain.value = portalApp.globalFuzzAmount;
            portalApp.globalFuzzDryGain.gain.value = 1 - portalApp.globalFuzzAmount;

            const fxOut = ctx.createGain();
            const limiter = ctx.createDynamicsCompressor();
            limiter.threshold.value = -6; limiter.knee.value = 6; limiter.ratio.value = 12;
            limiter.attack.value = 0.003; limiter.release.value = 0.12;
            portalApp.outBus = ctx.createGain();
            portalApp.monitorGain = ctx.createGain();
            portalApp.monitorGain.gain.value = portalApp.monitorOn ? 1 : 0;

            portalApp.globalDelay = ctx.createDelay(1.0);
            portalApp.globalDelayFeedback = ctx.createGain();
            portalApp.globalDelayFeedback.gain.value = 0.0;
            portalApp.globalDelaySend = ctx.createGain();
            portalApp.globalDelaySend.gain.value = 0.0;

            portalApp.leftDeck.initAudio(ctx, portalApp.masterGain);
            portalApp.rightDeck.initAudio(ctx, portalApp.masterGain);

            portalApp.masterGain.connect(portalApp.globalAnalyser);
            portalApp.globalAnalyser.connect(portalApp.globalFuzzDryGain);
            portalApp.globalAnalyser.connect(portalApp.globalFuzzWetGain);
            portalApp.globalFuzzWetGain.connect(portalApp.globalFuzzNode);
            portalApp.globalFuzzNode.connect(fxOut);
            portalApp.globalFuzzDryGain.connect(fxOut);

            portalApp.masterGain.connect(portalApp.globalDelaySend);
            portalApp.globalDelaySend.connect(portalApp.globalDelay);
            portalApp.globalDelay.connect(portalApp.globalDelayFeedback);
            portalApp.globalDelayFeedback.connect(portalApp.globalDelay);
            portalApp.globalDelay.connect(fxOut);

            // The compressor alone let dense patterns overshoot full scale. A fixed soft-knee ceiling follows it:
            // exactly linear up to 0.7, then bending to an absolute ceiling below 1.0 for any input.
            const ceilIn = ctx.createGain(); ceilIn.gain.value = 0.25;          // shaper input range covers +-4.0
            const ceiling = ctx.createWaveShaper();
            const cN = 16385, cCurve = new Float32Array(cN), KNEE = 0.7, ROOM = 0.28;
            for (let i = 0; i < cN; i++) {
                const x = (i / (cN - 1) * 2 - 1) * 4, ax = Math.abs(x);
                const y = ax <= KNEE ? ax : KNEE + ROOM * Math.tanh((ax - KNEE) / ROOM);
                cCurve[i] = x < 0 ? -y : y;
            }
            ceiling.curve = cCurve; ceiling.oversample = 'none';
            fxOut.connect(limiter);
            limiter.connect(ceilIn);
            ceilIn.connect(ceiling);
            ceiling.connect(portalApp.outBus);
            portalApp.outBus.connect(portalApp.monitorGain);
            portalApp.monitorGain.connect(ctx.destination);

            portalApp.updateCrossfader(portalApp.crossfaderValue);
            ctx.onstatechange = () => portalApp.updateTransportUI();
            return ctx;
        };

        portalApp.getStream = () => {
            const ctx = portalApp.ensureAudio();
            if (!portalApp.streamDest) {
                portalApp.streamDest = ctx.createMediaStreamDestination();
                portalApp.outBus.connect(portalApp.streamDest);
            }
            return portalApp.streamDest.stream;
        };

        // make sure the context exists and runs (must be called from a gesture the first time)
        portalApp.ensureRunning = () => {
            const ctx = portalApp.ensureAudio();
            if (ctx.state !== 'running') { const pr = ctx.resume(); if (pr && pr.catch) pr.catch(() => {}); }
            portalApp.updateTransportUI();
            return ctx;
        };

        // The field drone follows the transport. Sample auditions (waveform tap, REGION, BUILT-IN, LOAD) wake the
        // context without opening this gate, so "START" on the button always means "nothing is droning".
        portalApp.syncDroneGate = () => {
            const d = portalApp.leftDeck, ctx = portalApp.audioContext;
            if (!ctx || !d || !d.droneGate) return;
            const g = d.droneGate.gain, t = ctx.currentTime;
            g.cancelScheduledValues(t);
            if (portalApp.rightDeck.isPlaying) g.setTargetAtTime(1, t, 0.015);
            else g.value = 0;
        };

        portalApp.start = () => {
            portalApp.ensureRunning();
            if (!portalApp.started) {
                portalApp.started = true;
                document.body.classList.add('started');
            }
            portalApp.rightDeck.setPlaying(true);
            portalApp.syncDroneGate();
            portalApp.updateTransportUI();
        };

        portalApp.stop = () => {
            if (portalApp.rightDeck) portalApp.rightDeck.setPlaying(false);
            portalApp.syncDroneGate();
            if (portalApp._audition) { try { portalApp._audition.stop(); } catch (e) {} portalApp._audition = null; }
            if (portalApp.audioContext && portalApp.audioContext.state === 'running') {
                const pr = portalApp.audioContext.suspend(); if (pr && pr.catch) pr.catch(() => {});
            }
            portalApp.updateTransportUI();
        };

        portalApp.isSounding = () => !!(portalApp.audioContext && portalApp.audioContext.state === 'running' && portalApp.rightDeck.isPlaying);

        portalApp.setMonitor = (on) => {
            portalApp.monitorOn = !!on;
            if (portalApp.monitorGain) {
                portalApp.monitorGain.gain.setTargetAtTime(portalApp.monitorOn ? 1 : 0, portalApp.audioContext.currentTime, 0.01);
            }
        };

        portalApp.updateTransportUI = () => {
            const b = document.getElementById('play-pause-button');
            const on = portalApp.isSounding();
            b.innerHTML = on ? '&#9632; STOP' : '&#9654; START';
            b.classList.toggle('running', on);
            portalApp.updateReadouts();
        };

        portalApp.updateReadouts = () => {
            const seq = portalApp.rightDeck, field = portalApp.leftDeck;
            if (!seq || !field) return;
            let n = 0;
            seq.layers.forEach(l => l.nodeStates.forEach(s => { if (s) n++; }));
            document.getElementById('seq-read').textContent =
                (portalApp.isSounding() ? (portalApp.sampler.seqSource === 'sample' ? 'SAMPLE' : 'SYNTH') : 'STOPPED') + ' · ' + n + ' ON';
            document.getElementById('field-read').textContent = Math.round(field.audioFrequency) + ' Hz';
        };

        portalApp.animate = () => {
            requestAnimationFrame(portalApp.animate);

            if (portalApp.globalAnalyser && portalApp.globalFrequencyData) {
                portalApp.globalAnalyser.getByteFrequencyData(portalApp.globalFrequencyData);
                let sum = 0;
                const d = portalApp.globalFrequencyData;
                for (let i = 0; i < d.length; i++) sum += d[i];
                portalApp.globalAudioLevel = sum / (d.length * 255);
            }

            portalApp.leftDeck.update(portalApp.globalAudioLevel);
            portalApp.rightDeck.update(portalApp.globalAudioLevel);
            if (portalApp._waveDirty) { portalApp._waveDirty = false; portalApp.drawWave(); }
        };

        // ---------------------------------------------------------
        // Field: x = drone pitch / flow / grain position, y = bloom / intensity / grain pitch
        // ---------------------------------------------------------
        portalApp.setField = (x, y, fromPlayer) => {
            const d = portalApp.leftDeck;
            x = clamp01(x); y = clamp01(y);
            portalApp.fieldX = x; portalApp.fieldY = y;
            d.setMousePosition(x, y);
            d.audioFrequency = 100 + x * 400;
            d.audioResonance = Math.sin(d.time * 0.01 + x * Math.PI) * 0.5 + 0.5;
            d.visualBloom = 0.3 + y * 0.7;
            d.visualFlow = x * 2;
            d.visualIntensity = 0.5 + y * 0.5;
            d.updateAudioParameters();
            document.getElementById('field-read').textContent = Math.round(d.audioFrequency) + ' Hz';
            if (fromPlayer) {
                portalApp.emitParam('fieldX', x); portalApp.emitParam('fieldY', y);
                portalApp.updateStateInURL();
            }
        };
        portalApp.fieldX = 0.3; portalApp.fieldY = 0.5;

        portalApp.setupSurfaces = () => {
            // ----- Field (deck A) -----
            const a = document.getElementById('deck-a-container');
            let fieldPointer = null, grainTimer = null;
            const fieldXY = (e) => {
                const rect = a.getBoundingClientRect();
                return [clamp01((e.clientX - rect.left) / rect.width), clamp01(1.0 - (e.clientY - rect.top) / rect.height)];
            };
            const stopGrains = () => { if (grainTimer) { clearInterval(grainTimer); grainTimer = null; } };
            const fieldDown = (e) => {
                if (e.button > 0) return;
                e.preventDefault();
                if (!portalApp.isSounding()) portalApp.start();
                fieldPointer = e.pointerId;
                try { a.setPointerCapture(e.pointerId); } catch (err) {}
                const [x, y] = fieldXY(e);
                portalApp.setField(x, y, true);
                portalApp.leftDeck.touchPulse = 1;
                portalApp.playGrain(x, y);
                stopGrains();
                grainTimer = setInterval(() => portalApp.playGrain(portalApp.fieldX, portalApp.fieldY), 55);
            };
            a.addEventListener('pointerdown', fieldDown);
            a.addEventListener('pointermove', (e) => {
                // mouse hover still steers the drone (parent behaviour); a held pointer also scrubs grains
                if (fieldPointer === e.pointerId || (e.pointerType === 'mouse' && fieldPointer === null && portalApp.started)) {
                    const [x, y] = fieldXY(e);
                    portalApp.setField(x, y, true);
                    if (fieldPointer === e.pointerId) portalApp.leftDeck.touchPulse = Math.max(portalApp.leftDeck.touchPulse, 0.5);
                }
            });
            const fieldEnd = (e) => { if (fieldPointer === e.pointerId) { fieldPointer = null; stopGrains(); } };
            a.addEventListener('pointerup', fieldEnd);
            a.addEventListener('pointercancel', fieldEnd);
            a.addEventListener('lostpointercapture', fieldEnd);

            // ----- Sequencer (deck B) -----
            const b = document.getElementById('deck-b-container');
            const seq = portalApp.rightDeck;
            let seqPointer = null, paintState = true, lastCell = -1;
            const seqDown = (e) => {
                if (e.button > 0) return;
                e.preventDefault();
                const c = seq.cellFromEvent(e);
                if (!portalApp.isSounding()) {
                    // first touch: start the transport and let the pattern speak; do not edit yet
                    portalApp.start();
                    seq.beatPulse = 1;
                    return;
                }
                if (!c) return;
                seqPointer = e.pointerId;
                try { b.setPointerCapture(e.pointerId); } catch (err) {}
                paintState = seq.toggleCell(c.layer, c.step);
                lastCell = c.layer * 8 + c.step;
                seq.hoverCell = e.pointerType === 'mouse' ? lastCell : -1;
            };
            b.addEventListener('pointerdown', seqDown);

            // ----- A touch whose centre is inside a surface always plays that surface -----
            // Browsers "touch-adjust" a fat finger to the nearest tappable element. The faders and buttons that sit
            // 6px from the surfaces were tappable and the surfaces were not, so edge cells were handed to FUZZ,
            // INFLUENCE, the crossfader or START/STOP. Two layers:
            //  1. the surfaces are click targets themselves (no-op click listener below), so they compete as
            //     adjustment candidates and a touch that starts on them stays on them;
            //  2. whatever the browser decides, a pointer that goes down inside a surface rectangle but was
            //     dispatched to something else is taken back here, before the other control sees it.
            const noop = () => {};
            a.addEventListener('click', noop); b.addEventListener('click', noop);
            const surfaceAt = (x, y) => {
                for (const el of [a, b]) {
                    const r = el.getBoundingClientRect();
                    if (x >= r.left && x < r.right && y >= r.top && y < r.bottom) return el;
                }
                return null;
            };
            let swallowClickUntil = 0;
            portalApp.retargetedTouches = 0;
            window.addEventListener('pointerdown', (e) => {
                const sEl = surfaceAt(e.clientX, e.clientY);
                if (!sEl || sEl.contains(e.target)) return;
                e.stopPropagation();
                portalApp.retargetedTouches++;
                swallowClickUntil = performance.now() + 700;
                (sEl === a ? fieldDown : seqDown)(e);
            }, true);
            window.addEventListener('click', (e) => {
                // the click that follows a taken-back touch would still land on the neighbouring button
                if (performance.now() < swallowClickUntil && !a.contains(e.target) && !b.contains(e.target)) {
                    e.stopPropagation(); e.preventDefault();
                }
                swallowClickUntil = 0;
            }, true);
            b.addEventListener('pointermove', (e) => {
                const c = seq.cellFromEvent(e);
                const idx = c ? c.layer * 8 + c.step : -1;
                if (seqPointer === e.pointerId) {
                    // drag paints the same on/off state across cells
                    if (c && idx !== lastCell) {
                        lastCell = idx;
                        const l = seq.layers[c.layer];
                        if (l.nodeStates[c.step] !== paintState || (paintState && l.colorIndex !== portalApp.activeColorIndex)) {
                            seq.setCell(c.layer, c.step, paintState);
                        }
                    }
                } else if (e.pointerType === 'mouse') {
                    seq.hoverCell = idx;
                }
            });
            const seqEnd = (e) => { if (seqPointer === e.pointerId) { seqPointer = null; lastCell = -1; } if (e.pointerType !== 'mouse') seq.hoverCell = -1; };
            b.addEventListener('pointerup', seqEnd);
            b.addEventListener('pointercancel', seqEnd);
            b.addEventListener('lostpointercapture', seqEnd);
            b.addEventListener('pointerleave', () => { seq.hoverCell = -1; });

            // Mouse wheel over the sequencer nudges INFLUENCE (parent feature, no longer hijacks the whole window)
            b.addEventListener('wheel', (e) => {
                e.preventDefault();
                portalApp.faders.influence.set01(portalApp.faders.influence.get01() + (e.deltaY < 0 ? 0.02 : -0.02), true);
            }, { passive: false });

            // keep both renderers matched to their boxes (dock open/close, rotation, iframe resize)
            const onResize = () => {
                portalApp.leftDeck.resize(); portalApp.rightDeck.resize();
                portalApp._waveDirty = true;
            };
            if (typeof ResizeObserver !== 'undefined') {
                const ro = new ResizeObserver(onResize);
                ro.observe(a); ro.observe(b); ro.observe(document.getElementById('wave-wrap'));
            }
            window.addEventListener('resize', onResize);
        };

        portalApp.setupSamplerUI = () => {
            const wrap = document.getElementById('wave-wrap');
            let wp = null, anchor = 0, moved = false;
            const x01 = (e) => { const r = wrap.getBoundingClientRect(); return clamp01((e.clientX - r.left) / r.width); };
            wrap.addEventListener('pointerdown', (e) => {
                if (e.button > 0) return;
                e.preventDefault();
                wp = e.pointerId; anchor = x01(e); moved = false;
                try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
            });
            wrap.addEventListener('pointermove', (e) => {
                if (wp !== e.pointerId) return;
                const x = x01(e);
                if (!moved && Math.abs(x - anchor) < 0.015) return;
                moved = true;
                portalApp.setRegion(anchor, x);
            });
            const wEnd = (e) => {
                if (wp !== e.pointerId) return;
                wp = null;
                if (!moved && e.type === 'pointerup') {
                    // tap: move the region (same length) so it is centred where you touched
                    const s = portalApp.sampler, len = s.end - s.start;
                    let lo = x01(e) - len / 2;
                    lo = Math.max(0, Math.min(1 - len, lo));
                    portalApp.setRegion(lo, lo + len);
                }
                if (e.type === 'pointerup') portalApp.auditionRegion();
            };
            wrap.addEventListener('pointerup', wEnd);
            wrap.addEventListener('pointercancel', wEnd);

            const fileInput = document.getElementById('file-input');
            document.getElementById('sample-load').onclick = () => fileInput.click();
            fileInput.addEventListener('change', () => {
                const f = fileInput.files && fileInput.files[0];
                if (f) portalApp.loadSampleFile(f);
                fileInput.value = '';
            });
            document.getElementById('sample-builtin').onclick = () => { portalApp.loadBuiltInSample(); portalApp.setSeqSource('sample'); portalApp.auditionRegion(); };
            document.getElementById('sample-grab').onclick = () => portalApp.grabOutput();
            document.getElementById('sample-audition').onclick = () => portalApp.auditionRegion();
            document.getElementById('sample-source').onclick = () => portalApp.setSeqSource(portalApp.sampler.seqSource === 'sample' ? 'synth' : 'sample');

            // drag & drop anywhere on the page
            let dragDepth = 0;
            const hasFiles = (e) => e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0;
            window.addEventListener('dragenter', (e) => { if (hasFiles(e)) { dragDepth++; document.body.classList.add('dropping'); e.preventDefault(); } });
            window.addEventListener('dragover', (e) => { if (hasFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
            window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dropping'); });
            window.addEventListener('drop', (e) => {
                dragDepth = 0; document.body.classList.remove('dropping');
                if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
                e.preventDefault();
                portalApp.setPanel('sample', true);
                portalApp.loadSampleFile(e.dataTransfer.files[0]);
            });
        };

        // --- Docked panels (collapsible; they take space from the stage instead of covering it) ---
        portalApp.panelOpen = { mix: false, sample: false };
        portalApp.isSmallScreen = () => window.innerHeight < 620 || window.innerWidth < 620;
        portalApp.setPanel = (name, open) => {
            portalApp.panelOpen[name] = !!open;
            if (open && portalApp.isSmallScreen()) {
                // one panel at a time on a phone, so the surfaces keep most of the screen
                const other = name === 'mix' ? 'sample' : 'mix';
                if (portalApp.panelOpen[other]) portalApp.setPanel(other, false);
            }
            document.getElementById('panel-' + name).classList.toggle('closed', !open);
            const t = document.getElementById(name + '-toggle');
            t.classList.toggle('on', !!open);
            t.setAttribute('aria-expanded', open ? 'true' : 'false');
            document.getElementById('panels').classList.toggle('empty', !portalApp.panelOpen.mix && !portalApp.panelOpen.sample);
            portalApp._waveDirty = true;
        };

        portalApp.setupChrome = () => {
            document.getElementById('play-pause-button').onclick = () => { portalApp.isSounding() ? portalApp.stop() : portalApp.start(); };
            document.getElementById('mix-toggle').onclick = () => portalApp.setPanel('mix', !portalApp.panelOpen.mix);
            document.getElementById('sample-toggle').onclick = () => portalApp.setPanel('sample', !portalApp.panelOpen.sample);
            const fs = document.getElementById('fullscreen-btn');
            const root = document.documentElement;
            if (!root.requestFullscreen) fs.style.display = 'none';
            fs.onclick = () => {
                try {
                    if (!document.fullscreenElement) { const p = root.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
                    else document.exitFullscreen();
                } catch (err) {}
            };
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && !(e.target && e.target.closest && e.target.closest('button'))) {
                    e.preventDefault();
                    portalApp.isSounding() ? portalApp.stop() : portalApp.start();
                }
            });
        };

        portalApp.updateMasterVolume = (value) => {
            portalApp.masterOutputVolume = value;
            if (portalApp.masterGain && portalApp.audioContext && !isNaN(value)) {
                portalApp.masterGain.gain.setTargetAtTime(value, portalApp.audioContext.currentTime, 0.05);
            }
        };

        portalApp.updateCrossfader = (value) => {
            portalApp.crossfaderValue = value;
            const L = portalApp.leftDeck, R = portalApp.rightDeck;
            if (!L || !R) return;
            const gainL = Math.cos(value * 0.5 * Math.PI);
            const gainR = Math.cos((1.0 - value) * 0.5 * Math.PI);
            if (portalApp.audioContext) {
                const t = portalApp.audioContext.currentTime;
                if (L.outputGain) L.outputGain.gain.setTargetAtTime(gainL * L.deckVolume, t, 0.01);
                if (R.outputGain) R.outputGain.gain.setTargetAtTime(gainR * R.deckVolume, t, 0.01);
            }
            // a faded-out deck dims but stays visible, so it can still be played
            L.setCanvasOpacity(0.3 + 0.7 * gainL);
            R.setCanvasOpacity(0.3 + 0.7 * gainR);
        };

        portalApp.updateGlobalFuzz = (value) => {
            portalApp.globalFuzzAmount = value;
            if (portalApp.globalFuzzNode && portalApp.audioContext && !isNaN(value)) {
                portalApp.globalFuzzNode.curve = makeDistortionCurve(value * 100);
                const t = portalApp.audioContext.currentTime;
                portalApp.globalFuzzDryGain.gain.cancelScheduledValues(t);
                portalApp.globalFuzzWetGain.gain.cancelScheduledValues(t);
                portalApp.globalFuzzDryGain.gain.setTargetAtTime(1 - value, t, 0.01);
                portalApp.globalFuzzWetGain.gain.setTargetAtTime(value, t, 0.01);
            }
        };

        portalApp.setActiveColor = (index, fromPlayer) => {
            index = Math.max(0, Math.min(portalApp.colorPalette.length - 1, Math.round(index)));
            portalApp.activeColorIndex = index;
            document.querySelectorAll('.color-swatch').forEach((s, i) => {
                s.classList.toggle('selected', i === index);
                s.setAttribute('aria-pressed', i === index ? 'true' : 'false');
            });
            document.getElementById('color-name').textContent = COLOR_NAMES[index];
            if (fromPlayer) { portalApp.emitParam('stepColor', index / 7); portalApp.updateStateInURL(); }
        };

        portalApp.setupColorPaletteUI = () => {
            const paletteDiv = document.getElementById('color-palette');
            paletteDiv.innerHTML = '';
            portalApp.colorPalette.forEach((hsvColor, index) => {
                const swatch = document.createElement('button');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = portalApp.hsvToRgb(hsvColor[0], hsvColor[1], hsvColor[2]);
                swatch.dataset.colorIndex = index;
                swatch.textContent = COLOR_NAMES[index];
                // pick the label colour from the swatch luminance (black on pure blue / red was unreadable)
                const m = /(\d+), (\d+), (\d+)/.exec(swatch.style.backgroundColor) || [0, 255, 255, 255];
                if (0.299 * m[1] + 0.587 * m[2] + 0.114 * m[3] < 140) swatch.classList.add('dark');
                swatch.setAttribute('aria-label', 'Row colour ' + COLOR_NAMES[index]);
                swatch.onclick = () => portalApp.setActiveColor(index, true);
                paletteDiv.appendChild(swatch);
            });
            portalApp.setActiveColor(portalApp.activeColorIndex, false);
        };

        // --- State Serialization (debounced; replaceState so playing does not flood the history) ---
        portalApp.getStateObject = () => ({
            leftDeck: portalApp.leftDeck ? portalApp.leftDeck.getState() : null,
            rightDeck: portalApp.rightDeck ? portalApp.rightDeck.getState() : null,
            crossfaderValue: portalApp.crossfaderValue,
            globalFuzzAmount: portalApp.globalFuzzAmount,
            masterOutputVolume: portalApp.masterOutputVolume,
            activeColorIndex: portalApp.activeColorIndex,
            field: [portalApp.fieldX, portalApp.fieldY],
            sampler: { start: portalApp.sampler.start, end: portalApp.sampler.end, seqSource: portalApp.sampler.seqSource }
        });

        portalApp.updateStateInURL = () => {
            if (!portalApp.ready || portalApp._stateTimer) return;
            portalApp._stateTimer = setTimeout(() => {
                portalApp._stateTimer = null;
                try {
                    const encoded = btoa(JSON.stringify(portalApp.getStateObject()));
                    history.replaceState(null, '', location.pathname + location.search + '#' + encoded);
                } catch (error) { /* state in the URL is a convenience only */ }
            }, 500);
        };

        portalApp.loadStateFromURL = () => {
            try {
                if (window.location.hash.length > 1) {
                    const state = JSON.parse(atob(window.location.hash.slice(1)));
                    const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
                    portalApp.crossfaderValue = clamp01(num(state.crossfaderValue, 0.5));
                    portalApp.globalFuzzAmount = clamp01(num(state.globalFuzzAmount, 0.0));
                    portalApp.masterOutputVolume = clamp01(num(state.masterOutputVolume, 0.5));
                    portalApp.activeColorIndex = Math.max(0, Math.min(7, Math.round(num(state.activeColorIndex, 0))));
                    if (state.leftDeck) portalApp.leftDeck.setState(state.leftDeck);
                    if (state.rightDeck) portalApp.rightDeck.setState(state.rightDeck);
                    if (Array.isArray(state.field)) { portalApp.fieldX = clamp01(num(state.field[0], 0.3)); portalApp.fieldY = clamp01(num(state.field[1], 0.5)); }
                    if (state.sampler) {
                        portalApp.sampler.seqSource = state.sampler.seqSource === 'synth' ? 'synth' : 'sample';
                        portalApp._savedRegion = [clamp01(num(state.sampler.start, 0)), clamp01(num(state.sampler.end, 1))];
                    }
                }
            } catch (error) {
                console.warn('Ignoring unreadable state in URL hash.');
            }
        };

        // ---------------------------------------------------------
        // SCION DECK PROTOCOL v1
        // ---------------------------------------------------------
        portalApp.params = {
            bpm:        { label: 'Tempo',           group: 'transport', get: () => portalApp.faders.bpm.get01(),       set: (v) => portalApp.faders.bpm.set01(v) },
            play:       { label: 'Play',            group: 'transport', get: () => portalApp.isSounding() ? 1 : 0,     set: (v) => { v >= 0.5 ? portalApp.start() : portalApp.stop(); } },
            crossfade:  { label: 'Crossfade',       group: 'mix',       get: () => portalApp.faders.crossfade.get01(), set: (v) => portalApp.faders.crossfade.set01(v) },
            master:     { label: 'Master volume',   group: 'mix',       get: () => portalApp.faders.master.get01(),    set: (v) => portalApp.faders.master.set01(v) },
            droneVol:   { label: 'Field volume',    group: 'mix',       get: () => portalApp.faders.droneVol.get01(),  set: (v) => portalApp.faders.droneVol.set01(v) },
            seqVol:     { label: 'Sequencer volume', group: 'mix',      get: () => portalApp.faders.seqVol.get01(),    set: (v) => portalApp.faders.seqVol.set01(v) },
            fuzz:       { label: 'Fuzz',            group: 'fx',        get: () => portalApp.faders.fuzz.get01(),      set: (v) => portalApp.faders.fuzz.set01(v) },
            influence:  { label: 'Influence',       group: 'fx',        get: () => portalApp.faders.influence.get01(), set: (v) => portalApp.faders.influence.set01(v) },
            fieldX:     { label: 'Field X (pitch)', group: 'field',     get: () => portalApp.fieldX,                   set: (v) => portalApp.setField(v, portalApp.fieldY, false) },
            fieldY:     { label: 'Field Y (bloom)', group: 'field',     get: () => portalApp.fieldY,                   set: (v) => portalApp.setField(portalApp.fieldX, v, false) },
            regionStart:{ label: 'Sample region start', group: 'sample', get: () => portalApp.sampler.start,           set: (v) => { const s = portalApp.sampler; const lo = Math.min(clamp01(v), 0.999); portalApp.setRegion(lo, Math.max(s.end, lo), false); } },
            regionEnd:  { label: 'Sample region end',   group: 'sample', get: () => portalApp.sampler.end,             set: (v) => { const s = portalApp.sampler; const hi = Math.max(clamp01(v), 0.001); portalApp.setRegion(Math.min(s.start, hi), hi, false); } },
            seqSource:  { label: 'Sequencer plays sample', group: 'sample', get: () => portalApp.sampler.seqSource === 'sample' ? 1 : 0, set: (v) => portalApp.setSeqSource(v >= 0.5 ? 'sample' : 'synth', true) },
            stepColor:  { label: 'Row colour / effect', group: 'sequencer', get: () => portalApp.activeColorIndex / 7, set: (v) => portalApp.setActiveColor(clamp01(v) * 7, false) }
        };

        portalApp.manifest = () => ({
            name: 'Mighty Morph 08g',
            kind: 'morphic-field-sequencer-sampler',
            version: 1,
            params: Object.keys(portalApp.params).map(id => {
                const p = portalApp.params[id];
                return { id, label: p.label, group: p.group, value: p.get() };
            })
        });

        portalApp.emitParam = (id, value) => {
            if (!portalApp.ready || window.parent === window) return;
            try { window.parent.postMessage({ type: 'scion-param', id, value }, '*'); } catch (err) {}
        };

        window.scionDeck = {
            version: 1,
            manifest: () => portalApp.manifest(),
            getStream: () => portalApp.getStream(),
            set: (id, v01) => {
                const p = portalApp.params[id];
                const v = Number(v01);
                if (!p || !isFinite(v)) return false;
                p.set(clamp01(v));
                portalApp.updateStateInURL();
                return true;
            },
            get: (id) => { const p = portalApp.params[id]; return p ? p.get() : undefined; },
            start: () => portalApp.start(),
            stop: () => portalApp.stop(),
            setMonitor: (on) => portalApp.setMonitor(on),
            setBpm: (bpm) => {
                const b = Number(bpm);
                if (!isFinite(b)) return;
                portalApp.rightDeck.setBPM(b);
                portalApp.faders.bpm.set(portalApp.rightDeck.bpm);
                portalApp.updateStateInURL();
            }
        };

        window.addEventListener('message', (e) => {
            const m = e.data;
            if (!m || typeof m !== 'object' || typeof m.type !== 'string' || !portalApp.ready) return;
            const reply = (msg) => { try { (e.source || window.parent).postMessage(msg, '*'); } catch (err) {} };
            switch (m.type) {
                case 'scion-hello': reply({ type: 'scion-manifest', manifest: portalApp.manifest() }); break;
                case 'scion-set': window.scionDeck.set(m.id, m.value); break;
                case 'set-bpm': window.scionDeck.setBpm(m.bpm); break;
                case 'set-monitor': portalApp.setMonitor(m.on !== false); break;
                case 'resume-audio': portalApp.started ? portalApp.ensureRunning() : portalApp.start(); break;
                case 'suspend-audio':
                    if (portalApp.audioContext && portalApp.audioContext.state === 'running') {
                        const pr = portalApp.audioContext.suspend(); if (pr && pr.catch) pr.catch(() => {});
                    }
                    break;
                case 'request-audio-stream': {
                    let stream = null;
                    try { stream = portalApp.getStream(); } catch (err) {}
                    try { (e.source || window.parent).postMessage({ type: 'audio-stream', id: m.id, stream }, '*'); }
                    catch (err) {
                        // MediaStreams are not structured-cloneable in most browsers: point the host at the same-origin bridge
                        reply({ type: 'audio-stream', id: m.id, stream: null, bridge: 'scionDeck.getStream' });
                    }
                    break;
                }
            }
        });

        // ---------------------------------------------------------
        // Boot: visuals, controls and sample exist immediately; audio starts on the first gesture
        // ---------------------------------------------------------
        portalApp.boot = () => {
            if (portalApp.embed) document.body.classList.add('embed');

            portalApp.leftDeck = new MorphicDeck('deck-a-container', 'canvas-a', droneConfig);
            portalApp.rightDeck = new MorphicDeck('deck-b-container', 'canvas-b', sequencerConfig);

            portalApp.loadStateFromURL();
            portalApp.buildFaders();
            portalApp.setupColorPaletteUI();
            portalApp.setupSurfaces();
            portalApp.setupSamplerUI();
            portalApp.setupChrome();

            // panels: both open where there is room; on a phone / embed the surfaces get the space
            const small = portalApp.isSmallScreen();
            portalApp.setPanel('mix', !small && !portalApp.embed);
            // (on a phone-width screen the sample panel only opens by itself when the screen is tall enough to
            //  leave the two surfaces clearly larger than the dock)
            portalApp.setPanel('sample', !portalApp.embed && window.innerHeight >= (window.innerWidth < 620 ? 760 : 560));

            portalApp.loadBuiltInSample();
            if (portalApp._savedRegion) portalApp.setRegion(portalApp._savedRegion[0], portalApp._savedRegion[1], false);
            portalApp.setSeqSource(portalApp.sampler.seqSource, true);
            portalApp.setField(portalApp.fieldX, portalApp.fieldY, false);
            portalApp.updateCrossfader(portalApp.crossfaderValue);
            portalApp.updateTransportUI();

            portalApp.ready = true;
            portalApp.leftDeck.resize(); portalApp.rightDeck.resize();
            portalApp.drawWave();
            portalApp.animate();

            if (window.parent !== window) {
                try { window.parent.postMessage({ type: 'scion-manifest', manifest: portalApp.manifest() }, '*'); } catch (err) {}
            }
        };

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', portalApp.boot);
        else portalApp.boot();
    </script>
</body>
</html>
